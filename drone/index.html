<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Killer Drone — heuristic face tracking</title>
<style>
  html, body {
    margin: 0; min-height: 100%;
    background: #07080a; color: #e8e6e3;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px; }
  canvas {
    width: min(1280px, 100%); height: auto; display: block;
    border: 1px solid #1d2126; border-radius: 10px; background: #0b0d10;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .7); cursor: crosshair;
  }
  p { margin: 0; max-width: 900px; text-align: center; color: #767d85; }
  b { color: #e5484d; font-weight: 600; }
  code { color: #c9c6c2; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1280" height="620"></canvas>
  <p>
    Click the field to spawn a person · <code>space</code> pause · <code>r</code> reset ·
    <b>headshot kills</b>, body hits only wound ·
    detection is a pixel heuristic (skin blob + eye pair), not an ML model
  </p>
</div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Scene constants
// ---------------------------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND = H - 64;
const DET_S = 0.5;               // detector works on a half-resolution frame
const DET_EVERY = 3;             // frames between detection passes
const HEAD_DY = -158;            // head centre relative to a person's feet
const HEAD_R = 19;

const SKIN = '#e0b28c', SKIN_EDGE = '#b98a63', EYE = '#17130f', HAIR = '#1a1512';
const ACCENT = '#e5484d', OK = '#46a758', INK = '#e8e6e3', DIM = '#6f767d';
const CLOTHES = ['#39485a', '#483d50', '#2f4a3f', '#51443a', '#3c3c46', '#424964'];

const detCv = document.createElement('canvas');
detCv.width = Math.round(W * DET_S);
detCv.height = Math.round(H * DET_S);
const detCtx = detCv.getContext('2d', { willReadFrequently: true });

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

// ---------------------------------------------------------------------------
// World state
// ---------------------------------------------------------------------------
let uid = 1;
const world = {
  t: 0,
  frame: 0,
  paused: false,
  flash: 0,
  humans: [],
  bullets: [],
  blood: [],
  smokes: [],
  faces: [],
  facesAt: -1e9,
  stats: { detRuns: 0, facesSeen: 0, shots: 0, hits: 0, headshots: 0, kills: 0, ms: 0 },
  drone: {
    x: W - 340, y: 170, vx: 0, vy: 0, aim: Math.PI * 0.85,
    ammo: 30, mag: 30, reload: 0, fireCd: 0.6, burst: 0,
    lock: 0, state: 'SCAN', targetId: 0,
  },
};

function makeHuman(x) {
  return {
    id: uid++,
    x: clamp(x, 60, W - 60),
    y: GROUND,
    dir: Math.random() < 0.5 ? -1 : 1,
    speed: rnd(42, 78),
    hp: 3,
    alive: true,
    fallT: 0,
    fallDir: 1,
    panic: 0,
    fleeDir: 1,
    fade: 1,
    phase: Math.random() * 6.283,
    clothes: CLOTHES[(Math.random() * CLOTHES.length) | 0],
    hair: Math.random() < 0.75,
  };
}

function populate(n) {
  for (let i = 0; i < n; i++) world.humans.push(makeHuman(rnd(140, W - 140)));
}
populate(5);

// ---------------------------------------------------------------------------
// Drawing — the same pass feeds the screen and the detector
// ---------------------------------------------------------------------------
function drawBackground(g) {
  const sky = g.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#0a0d11');
  sky.addColorStop(1, '#161b21');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, GROUND);

  g.fillStyle = '#11161b';
  g.beginPath();
  g.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 80) {
    g.lineTo(x, GROUND - 70 - 60 * Math.sin(x * 0.004) - 30 * Math.sin(x * 0.011));
  }
  g.lineTo(W, GROUND);
  g.closePath();
  g.fill();

  g.fillStyle = '#171b20';
  g.fillRect(0, GROUND, W, H - GROUND);
  g.strokeStyle = '#20252b';
  g.lineWidth = 1;
  for (let x = -40; x < W + 80; x += 44) {
    g.beginPath();
    g.moveTo(x, H);
    g.lineTo(x + 40, GROUND);
    g.stroke();
  }
  g.strokeStyle = '#22272d';
  g.beginPath();
  g.moveTo(0, GROUND + 0.5);
  g.lineTo(W, GROUND + 0.5);
  g.stroke();
}

function drawHead(g, human, hx, hy) {
  g.save();
  g.translate(hx, hy);
  g.beginPath();
  g.arc(0, 0, HEAD_R, 0, Math.PI * 2);
  g.fillStyle = SKIN;
  g.fill();
  g.lineWidth = 2;
  g.strokeStyle = SKIN_EDGE;
  g.stroke();

  if (human.alive) {
    // eyes: the two dark blobs the detector looks for
    const eo = HEAD_R * 0.32, erx = HEAD_R * 0.2, ery = HEAD_R * 0.16;
    g.fillStyle = EYE;
    g.beginPath();
    g.ellipse(-eo, -HEAD_R * 0.1, erx, ery, 0, 0, Math.PI * 2);
    g.ellipse(eo, -HEAD_R * 0.1, erx, ery, 0, 0, Math.PI * 2);
    g.fill();
    // mouth sits below the detector's eye band
    g.strokeStyle = '#8c6a4d';
    g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(-HEAD_R * 0.26, HEAD_R * 0.47);
    g.lineTo(HEAD_R * 0.26, HEAD_R * 0.47);
    g.stroke();
    if (human.hair) {
      g.save();
      g.beginPath();
      g.arc(0, 0, HEAD_R + 0.5, 0, Math.PI * 2);
      g.clip();
      g.fillStyle = HAIR;
      g.fillRect(-HEAD_R - 2, -HEAD_R - 2, (HEAD_R + 2) * 2, (HEAD_R + 2) * 2 * 0.20);
      g.restore();
    }
  } else {
    // face-down: hair covers most of the head, so no eye pair and no face lock
    g.save();
    g.beginPath();
    g.arc(0, 0, HEAD_R + 1, 0, Math.PI * 2);
    g.clip();
    g.fillStyle = HAIR;
    g.fillRect(-HEAD_R - 2, -HEAD_R - 2, (HEAD_R + 2) * 2, (HEAD_R + 2) * 2 * 0.82);
    g.restore();
  }
  g.restore();
}

function drawHuman(g, h) {
  const walk = Math.sin(world.t * 7 + h.phase) * (h.alive ? 1 : 0);
  const flee = h.panic > 0 && h.alive ? 1.35 : 1;

  g.save();
  if (!h.alive) {
    g.translate(h.x, h.y);
    g.rotate(h.fallDir * Math.PI * 0.5 * Math.min(1, h.fallT * 3.4));
    g.translate(-h.x, -h.y);
  }
  g.globalAlpha = Math.max(0, h.fade);

  const hipY = h.y - 64;
  const shY = h.y - 132;
  g.lineCap = 'round';
  g.strokeStyle = '#25292e';
  g.lineWidth = 10;
  g.beginPath();
  g.moveTo(h.x - 7, hipY);
  g.lineTo(h.x - 7 + walk * 11 * flee, h.y);
  g.moveTo(h.x + 7, hipY);
  g.lineTo(h.x + 7 - walk * 11 * flee, h.y);
  g.stroke();

  g.strokeStyle = h.clothes;
  g.lineWidth = 11;
  if (!h.alive || h.panic > 0) {
    g.beginPath();
    g.moveTo(h.x - 15, shY + 6);
    g.lineTo(h.x - 24, shY - 16);
    g.moveTo(h.x + 15, shY + 6);
    g.lineTo(h.x + 24, shY - 16);
  } else {
    g.beginPath();
    g.moveTo(h.x - 15, shY + 6);
    g.lineTo(h.x - 20 - walk * 6, h.y - 78);
    g.moveTo(h.x + 15, shY + 6);
    g.lineTo(h.x + 20 + walk * 6, h.y - 78);
  }
  g.stroke();

  g.fillStyle = h.clothes;
  g.beginPath();
  g.roundRect(h.x - 17, shY - 4, 34, 76, 11);
  g.fill();

  // blood on the torso, body hits only wound
  if (h.hp < 3 && h.alive) {
    g.fillStyle = 'rgba(179,38,30,.85)';
    g.beginPath();
    g.arc(h.x - 4, h.y - 104, 5 - h.hp, 0, Math.PI * 2);
    g.fill();
  }

  drawHead(g, h, h.x, h.y + HEAD_DY);
  g.restore();
}

function drawDrone(g) {
  const d = world.drone;
  const bob = Math.sin(world.t * 3.1) * 3;

  // shadow on the ground, sold as altitude
  g.fillStyle = 'rgba(0,0,0,.42)';
  g.beginPath();
  g.ellipse(d.x, GROUND + 6, 46, 9, 0, 0, Math.PI * 2);
  g.fill();

  g.save();
  g.translate(d.x, d.y + bob);

  g.strokeStyle = '#2b3138';
  g.lineWidth = 6;
  g.beginPath();
  g.moveTo(-30, 0); g.lineTo(-52, -9);
  g.moveTo(30, 0);  g.lineTo(52, -9);
  g.stroke();

  for (const rx of [-52, 52]) {
    g.strokeStyle = '#3b4249';
    g.lineWidth = 2;
    g.beginPath();
    g.arc(rx, -10, 15, 0, Math.PI * 2);
    g.stroke();
    g.strokeStyle = 'rgba(200,206,212,.34)';
    g.lineWidth = 1.5;
    const spin = (world.t * 42) % Math.PI;
    for (let i = 0; i < 2; i++) {
      const a = spin + (i * Math.PI) / 2;
      g.beginPath();
      g.moveTo(rx - Math.cos(a) * 15, -10 - Math.sin(a) * 15);
      g.lineTo(rx + Math.cos(a) * 15, -10 + Math.sin(a) * 15);
      g.stroke();
    }
  }

  const body = g.createLinearGradient(0, -16, 0, 16);
  body.addColorStop(0, '#39414a');
  body.addColorStop(1, '#1d2228');
  g.fillStyle = body;
  g.beginPath();
  g.roundRect(-30, -14, 60, 28, 12);
  g.fill();
  g.strokeStyle = '#4a525b';
  g.lineWidth = 1.5;
  g.stroke();

  g.fillStyle = '#0d1114';
  g.beginPath();
  g.roundRect(-9, 4, 18, 12, 5);
  g.fill();

  // gimbal turret aimed at the locked face
  g.save();
  g.rotate(d.aim - Math.PI / 2);
  g.fillStyle = '#2f363d';
  g.beginPath();
  g.roundRect(-4, 6, 8, 26, 3);
  g.fill();
  g.fillStyle = '#0f1317';
  g.beginPath();
  g.arc(0, 32, 5, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = d.lock >= 1 ? ACCENT : '#8a9098';
  g.beginPath();
  g.arc(0, 33, 2.1, 0, Math.PI * 2);
  g.fill();
  g.restore();

  g.fillStyle = d.lock >= 1 ? ACCENT : '#5a626b';
  g.beginPath();
  g.arc(0, -8, 2.6, 0, Math.PI * 2);
  g.fill();

  g.restore();
}

function drawScene(g) {
  drawBackground(g);
  for (const h of world.humans) drawHuman(g, h);
  drawDrone(g);

  for (const b of world.blood) {
    g.globalAlpha = Math.max(0, b.life / b.max);
    g.fillStyle = b.c;
    g.beginPath();
    g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;

  for (const s of world.smokes) {
    g.globalAlpha = Math.max(0, s.life / s.max) * 0.5;
    g.fillStyle = '#c8ced4';
    g.beginPath();
    g.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;

  for (const b of world.bullets) {
    g.strokeStyle = '#fff3c4';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(b.x, b.y);
    g.lineTo(b.x - b.vx * 0.016, b.y - b.vy * 0.016);
    g.stroke();
    g.fillStyle = '#ffd166';
    g.beginPath();
    g.arc(b.x, b.y, 1.7, 0, Math.PI * 2);
    g.fill();
  }
}

// ---------------------------------------------------------------------------
// Detector: skin-tone blob + eye-pair heuristic on the rendered frame
// ---------------------------------------------------------------------------
function isSkin(r, g, b) {
  return r > 150 && r < 255 && g > 110 && g < 205 && b > 80 && b < 185 &&
         r > g + 25 && g > b + 15 && r - b > 45;
}

function detectFaces() {
  const t0 = performance.now();
  const w = detCv.width, h = detCv.height;
  detCtx.setTransform(1, 0, 0, 1, 0, 0);
  detCtx.clearRect(0, 0, w, h);
  detCtx.save();
  detCtx.scale(DET_S, DET_S);
  drawScene(detCtx);
  detCtx.restore();

  const px = detCtx.getImageData(0, 0, w, h).data;
  const mask = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < mask.length; i++, p += 4) {
    if (isSkin(px[p], px[p + 1], px[p + 2])) mask[i] = 1;
  }

  const seen = new Uint8Array(w * h);
  const stack = new Int32Array(w * h);
  const faces = [];

  for (let i = 0; i < mask.length; i++) {
    if (!mask[i] || seen[i]) continue;
    let sp = 0;
    stack[sp++] = i;
    seen[i] = 1;
    let area = 0, minX = w, maxX = -1, minY = h, maxY = -1;

    while (sp > 0) {
      const idx = stack[--sp];
      const x = idx % w, y = (idx / w) | 0;
      area++;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      if (x > 0 && mask[idx - 1] && !seen[idx - 1]) { seen[idx - 1] = 1; stack[sp++] = idx - 1; }
      if (x < w - 1 && mask[idx + 1] && !seen[idx + 1]) { seen[idx + 1] = 1; stack[sp++] = idx + 1; }
      if (y > 0 && mask[idx - w] && !seen[idx - w]) { seen[idx - w] = 1; stack[sp++] = idx - w; }
      if (y < h - 1 && mask[idx + w] && !seen[idx + w]) { seen[idx + w] = 1; stack[sp++] = idx + w; }
    }

    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    if (area < 18 || bw < 8 || bh < 8 || bw > 34 || bh > 34) continue;
    const ratio = bw / bh;
    if (ratio < 0.62 || ratio > 1.5) continue;      // a head is roughly round
    if (area / (bw * bh) < 0.45) continue;          // a disc, not a crescent or an arm

    // eye band: upper-middle of the blob must contain a small number of dark pixels
    const x0 = minX + Math.floor(bw * 0.16), x1 = maxX - Math.floor(bw * 0.16);
    const y0 = minY + Math.floor(bh * 0.28), y1 = minY + Math.floor(bh * 0.60);
    let dark = 0, band = 0;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const p = (y * w + x) * 4;
        band++;
        const lum = 0.299 * px[p] + 0.587 * px[p + 1] + 0.114 * px[p + 2];
        if (lum < 70) dark++;
      }
    }
    if (dark < 2 || dark > band * 0.7) continue;

    faces.push({
      x: ((minX + maxX) / 2) / DET_S,
      y: ((minY + maxY) / 2) / DET_S,
      w: bw / DET_S,
      h: bh / DET_S,
      dark,
      vx: 0,
      conf: clamp(1 - dark / (band * 0.7), 0.4, 1),
    });
  }

  // match this pass's faces to the previous pass so the turret can lead a runner
  const prev = world.faces, prevAt = world.facesAt;
  const gap = world.t - prevAt;
  if (gap > 0.001 && gap < 0.5) {
    for (const f of faces) {
      let best = null, bd = 90;
      for (const p of prev) {
        const dd = Math.hypot(p.x - f.x, p.y - f.y);
        if (dd < bd) { bd = dd; best = p; }
      }
      if (best) { f.vx = (f.x - best.x) / gap; f.vy = (f.y - best.y) / gap; }
    }
  }

  const sorted = faces.sort((a, b) => a.x - b.x);
  world.stats.detRuns++;
  world.stats.ms = performance.now() - t0;
  if (sorted.length > world.stats.facesSeen) world.stats.facesSeen = sorted.length;
  world.faces = sorted;
  world.facesAt = world.t;
  return sorted;
}

// ---------------------------------------------------------------------------
// Flight + fire control
// ---------------------------------------------------------------------------
function pickFace() {
  const d = world.drone;
  if (!world.faces.length) return null;
  let best = null, bestScore = Infinity;
  for (const f of world.faces) {
    const cur = f.w * f.h;
    // prefer the face we were already locked on, then the nearest one
    const stick = d.targetId && Math.abs(f.x - d.tx) < 40 && Math.abs(f.y - d.ty) < 40 ? -260 : 0;
    const score = Math.hypot(f.x - d.x, f.y - d.y) + stick - cur * 0.02;
    if (score < bestScore) { bestScore = score; best = f; }
  }
  return best;
}

function fireAt(fx, fy) {
  const d = world.drone;
  d.aim = Math.atan2(fy - d.y, fx - d.x);
  const spread = rnd(-0.014, 0.014);
  const a = d.aim + spread;
  const speed = 1500;
  world.bullets.push({
    x: d.x + Math.cos(a) * 34,
    y: d.y + Math.sin(a) * 34,
    vx: Math.cos(a) * speed,
    vy: Math.sin(a) * speed,
    life: 1.1,
  });
  world.smokes.push({ x: d.x + Math.cos(a) * 36, y: d.y + Math.sin(a) * 36, r: 3, life: 0.22, max: 0.22 });
  world.stats.shots++;
  d.ammo--;
  d.burst++;
  d.fireCd = d.burst >= 3 ? 1.05 : 0.16;
  if (d.burst >= 3) d.burst = 0;
  world.flash = 0.08;
}

function updateDrone(dt) {
  const d = world.drone;
  const face = pickFace();

  if (d.reload > 0) {
    d.reload -= dt;
    if (d.reload <= 0) { d.ammo = d.mag; }
  }

  if (face) {
    d.targetId = 1;
    d.tx = face.x; d.ty = face.y;
    // standing off on the near side so the drone chases from behind
    const side = Math.sign(d.x - face.x) || 1;
    const goalX = clamp(face.x + side * 250, 60, W - 60);
    const goalY = clamp(face.y - 120, 60, GROUND - 120);

    const ax = (goalX - d.x) * 5.2 - d.vx * 2.3;
    const ay = (goalY - d.y) * 5.2 - d.vy * 2.3;
    d.vx = clamp(d.vx + ax * dt, -520, 520);
    d.vy = clamp(d.vy + ay * dt, -420, 420);

    const want = Math.atan2(face.y - d.y, face.x - d.x);
    let da = ((want - d.aim + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    d.aim += clamp(da, -4.4 * dt, 4.4 * dt);
    da = Math.abs(((want - d.aim + Math.PI * 3) % (Math.PI * 2)) - Math.PI);

    const range = Math.hypot(face.x - d.x, face.y - d.y);
    const settled = Math.hypot(d.vx, d.vy) < 460;
    if (da < 0.1 && range < 900 && settled) {
      d.lock = Math.min(1, d.lock + dt * 2.6);
      d.state = d.lock >= 1 ? 'ENGAGED' : 'TRACKING';
    } else {
      d.lock = Math.max(0, d.lock - dt * 2.4);
      d.state = 'TRACKING';
    }
  } else {
    d.targetId = 0;
    d.lock = Math.max(0, d.lock - dt * 3);
    d.state = 'SCAN';
    const scanX = W / 2 + Math.cos(world.t * 0.6) * (W / 2 - 220);
    const scanY = 190 + Math.sin(world.t * 0.9) * 55;
    d.vx = clamp(d.vx + (scanX - d.x) * 2.2 * dt - d.vx * 1.4 * dt, -300, 300);
    d.vy = clamp(d.vy + (scanY - d.y) * 2.2 * dt - d.vy * 1.4 * dt, -220, 220);
    d.aim += 0.5 * dt;
  }

  d.x = clamp(d.x + d.vx * dt, 40, W - 40);
  d.y = clamp(d.y + d.vy * dt, 56, GROUND - 96);

  if (d.fireCd > 0) d.fireCd -= dt;
  if (d.ammo <= 0 && d.reload <= 0) { d.reload = 1.6; d.state = 'RELOAD'; }

  if (face && d.lock >= 1 && d.fireCd <= 0 && d.ammo > 0 && d.reload <= 0 &&
      Math.hypot(face.x - d.x, face.y - d.y) < 470) {
    // lead the runner: the face moves, the bullet does not
    const travel = Math.hypot(face.x - d.x, face.y - d.y) / 1500;
    fireAt(face.x + face.vx * travel, face.y + face.vy * travel);
  }
}

function updateHumans(dt) {
  const d = world.drone;
  for (const h of world.humans) {
    if (!h.alive) {
      h.fallT += dt;
      if (h.fallT > 2.2) h.fade = Math.max(0, h.fade - dt * 1.4);
      continue;
    }
    const near = Math.hypot(h.x - d.x, h.y - (h.y + HEAD_DY) - d.y);
    if (near < 430 && h.panic <= 0) {
      h.panic = 1.4;
      h.fleeDir = h.x < d.x ? -1 : 1;
    }
    h.panic = Math.max(0, h.panic - dt);

    if (h.panic > 0) {
      // latched flee direction; a cornered runner breaks past the drone
      if ((h.x < 80 && h.fleeDir < 0) || (h.x > W - 80 && h.fleeDir > 0)) h.fleeDir *= -1;
      h.dir = h.fleeDir;
      h.x += h.dir * h.speed * 1.7 * dt;
    } else {
      h.x += h.dir * h.speed * 0.55 * dt;
      if (Math.random() < 0.006) h.dir *= -1;
    }
    if (h.x < 70) { h.x = 70; h.dir = 1; }
    if (h.x > W - 70) { h.x = W - 70; h.dir = -1; }

    // keep bodies apart: overlapping heads merge into one blob and lose the face
    for (const o of world.humans) {
      if (o === h || !o.alive) continue;
      const dx = h.x - o.x;
      if (Math.abs(dx) < 46) h.x += (dx >= 0 ? 1 : -1) * (46 - Math.abs(dx)) * 0.5;
    }
    h.phase += dt * (h.panic > 0 ? 12 : 7);
  }

  world.humans = world.humans.filter(h => h.alive || h.fade > 0.02);
  const aliveCount = world.humans.filter(h => h.alive).length;
  if (aliveCount < 4 && Math.random() < dt * 1.8) {
    world.humans.push(makeHuman(Math.random() < 0.5 ? 90 : W - 90));
  }
}

function segPointDist(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay;
  const len = dx * dx + dy * dy;
  let t = len > 0 ? ((px - ax) * dx + (py - ay) * dy) / len : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(ax + dx * t - px, ay + dy * t - py);
}

function updateBullets(dt) {
  for (const b of world.bullets) {
    const px = b.x, py = b.y;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    for (const h of world.humans) {
      if (!h.alive) continue;
      const hy = h.y + HEAD_DY;
      // segment test: a 1500px/s bullet moves further than a head is wide
      if (segPointDist(px, py, b.x, b.y, h.x, hy) < HEAD_R * 0.95) {
        h.alive = false;
        h.fallDir = b.vx > 0 ? 1 : -1;
        h.fallT = 0;
        world.stats.hits++;
        world.stats.headshots++;
        world.stats.kills++;
        burstBlood(b.x, b.y, 26);
        b.life = -1;
        world.flash = 0.15;
        break;
      }
      if (segPointDist(px, py, b.x, b.y, h.x, h.y - 98) < 21) {
        h.hp = Math.max(1, h.hp - 1);
        h.panic = 2;
        world.stats.hits++;
        burstBlood(b.x, b.y, 9);
        b.life = -1;
        break;
      }
    }
  }
  world.bullets = world.bullets.filter(b => b.life > 0 && b.x > -40 && b.x < W + 40 && b.y > -40 && b.y < GROUND + 20);

  for (const p of world.blood) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 900 * dt; p.vx *= 0.985;
    p.life -= dt;
  }
  world.blood = world.blood.filter(p => p.life > 0);

  for (const s of world.smokes) { s.life -= dt; s.r += 40 * dt; s.y -= 14 * dt; }
  world.smokes = world.smokes.filter(s => s.life > 0);
}

function burstBlood(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(40, 260);
    world.blood.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      r: rnd(1.2, 3.4), life: rnd(0.5, 1.3), max: 1.3, c: i % 3 ? '#b3261e' : '#7d1a14',
    });
  }
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------
function drawHud() {
  const d = world.drone, s = world.stats;
  const age = world.t - world.facesAt;

  if (age < 0.5) {
    for (const f of world.faces) {
      const locked = d.lock >= 1 && Math.abs(f.x - d.tx) < 6 && Math.abs(f.y - d.ty) < 6;
      const c = locked ? ACCENT : OK;
      ctx.strokeStyle = c;
      ctx.lineWidth = locked ? 2 : 1.2;
      const pad = 6;
      const x0 = f.x - f.w / 2 - pad, y0 = f.y - f.h / 2 - pad;
      const w = f.w + pad * 2, h = f.h + pad * 2, k = 7;
      ctx.beginPath();
      ctx.moveTo(x0, y0 + k); ctx.lineTo(x0, y0); ctx.lineTo(x0 + k, y0);
      ctx.moveTo(x0 + w - k, y0); ctx.lineTo(x0 + w, y0); ctx.lineTo(x0 + w, y0 + k);
      ctx.moveTo(x0 + w, y0 + h - k); ctx.lineTo(x0 + w, y0 + h); ctx.lineTo(x0 + w - k, y0 + h);
      ctx.moveTo(x0 + k, y0 + h); ctx.lineTo(x0, y0 + h); ctx.lineTo(x0, y0 + h - k);
      ctx.stroke();
      if (locked) {
        ctx.fillStyle = c;
        ctx.font = '10px ui-monospace, monospace';
        ctx.fillText('FACE ' + Math.round(f.conf * 100) + '%', x0, y0 - 4);
        ctx.strokeStyle = ACCENT;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 27 + Math.sin(world.t * 14) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  // heading line and aim
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.rotate(d.aim);
  ctx.strokeStyle = d.lock >= 1 ? 'rgba(229,72,77,.55)' : 'rgba(70,167,88,.35)';
  ctx.setLineDash([4, 6]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(34, 0);
  ctx.lineTo(1200, 0);
  ctx.stroke();
  ctx.restore();
  ctx.setLineDash([]);

  // panel
  ctx.fillStyle = 'rgba(8,10,12,.82)';
  ctx.strokeStyle = '#1d2126';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(18, 16, 268, 132, 8);
  ctx.fill();
  ctx.stroke();

  ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.fillStyle = INK;
  ctx.fillText('KILLER DRONE', 32, 38);
  ctx.font = '11px ui-monospace, monospace';
  const rows = [
    ['STATE', d.state, d.lock >= 1 ? ACCENT : DIM],
    ['FACES', String(world.faces.length), world.faces.length ? OK : DIM],
    ['KILLS', String(s.kills), INK],
    ['ROUNDS', d.reload > 0 ? 'RELOADING' : d.ammo + '/' + d.mag, d.ammo > 6 ? INK : ACCENT],
    ['ACCURACY', s.shots ? Math.round((s.hits / s.shots) * 100) + '%' : '—', INK],
  ];
  rows.forEach((r, i) => {
    ctx.fillStyle = DIM;
    ctx.fillText(r[0], 32, 58 + i * 17);
    ctx.fillStyle = r[2];
    ctx.fillText(r[1], 132, 58 + i * 17);
  });

  // detector inset: proof that detection runs on pixels, not on object ids
  const ix = W - 262, iy = 16, iw = 244, ih = Math.round(244 * detCv.height / detCv.width);
  ctx.fillStyle = 'rgba(8,10,12,.82)';
  ctx.strokeStyle = '#1d2126';
  ctx.beginPath();
  ctx.roundRect(ix, iy, iw, ih + 26, 8);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.font = '10px ui-monospace, monospace';
  ctx.fillText('DETECTOR · skin+eye heuristic · ' + world.stats.ms.toFixed(1) + 'ms', ix + 10, iy + 15);
  ctx.drawImage(detCv, ix + 6, iy + 20, iw - 12, ih - 8);
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = world.faces.length ? OK : '#3a4048';
  ctx.strokeRect(ix + 6.5, iy + 20.5, iw - 13, ih - 9);
  ctx.globalAlpha = 1;

  ctx.fillStyle = DIM;
  ctx.font = '11px ui-monospace, monospace';
  ctx.fillText(
    'detections ' + world.stats.detRuns + ' · headshot = lethal · body = wound',
    18, H - 18
  );

  if (world.flash > 0) {
    ctx.fillStyle = 'rgba(229,72,77,' + world.flash * 0.35 + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!world.paused) {
    world.t += dt;
    world.frame++;
    world.flash = Math.max(0, world.flash - dt * 3);
    updateHumans(dt);
    updateDrone(dt);
    updateBullets(dt);
    if (world.frame % DET_EVERY === 0) detectFaces();
  }

  drawScene(ctx);
  drawHud();
  requestAnimationFrame(frame);
}

function reset() {
  world.t = 0;
  world.frame = 0;
  world.humans = [];
  world.bullets = [];
  world.blood = [];
  world.smokes = [];
  world.faces = [];
  world.facesAt = -1e9;
  world.stats = { detRuns: 0, facesSeen: 0, shots: 0, hits: 0, headshots: 0, kills: 0, ms: 0 };
  Object.assign(world.drone, {
    x: W - 340, y: 170, vx: 0, vy: 0, aim: Math.PI * 0.85,
    ammo: 30, reload: 0, fireCd: 0.6, burst: 0, lock: 0, state: 'SCAN', targetId: 0,
  });
  populate(5);
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); world.paused = !world.paused; }
  if (e.key === 'r' || e.key === 'R') reset();
});
cv.addEventListener('click', (e) => {
  const r = cv.getBoundingClientRect();
  world.humans.push(makeHuman(((e.clientX - r.left) / r.width) * W));
});

requestAnimationFrame(frame);

// Test surface: assertions read this instead of poking at the canvas.
window.__drone = {
  get stats() { return JSON.parse(JSON.stringify(world.stats)); },
  get drone() { return { ...world.drone }; },
  get faces() { return JSON.parse(JSON.stringify(world.faces)); },
  get humans() { return world.humans.map(h => ({ id: h.id, x: h.x, alive: h.alive, hp: h.hp })); },
  spawn(x) { world.humans.push(makeHuman(x)); },
  pause(v) { world.paused = v; },
  reset,
};
})();
</script>
