<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>Kortix</title>
    <style>
      /* Kortix tokens: .agents/skills/kortix-brand/references/visual/tokens.css. The CSP
         blocks web fonts, so Roobert applies only where installed; the system stack follows. */
      :root { color-scheme: light dark; --background: var(--background); --card: #f4f4f4; --foreground: #1f1f1f; --muted-foreground: #666666; --border: #e2e2e2; --primary: #1f1f1f; --primary-foreground: #ffffff; --destructive: #e7000b; --font-sans: Roobert, ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", "Noto Sans", sans-serif; }
      @media (prefers-color-scheme: dark) { :root { --background: #0b0b0b; --card: #141414; --foreground: #ffffff; --muted-foreground: #999999; --border: #262626; --primary: #ffffff; --primary-foreground: #090909; --destructive: #ff6467; } }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--background);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        font-family: var(--font-sans);
      }
      .ring {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.14);
        border-top-color: rgba(0, 0, 0, 0.78);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* Update status, driven from the main process (see updater.js). Empty by
         default so it occupies no visual space until there's something to say. */
      #kx-status {
        min-height: 14px;
        font-size: 12px;
        line-height: 14px;
        color: var(--muted-foreground);
        letter-spacing: 0.01em;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: var(--background); }
        .ring {
          border-color: rgba(255, 255, 255, 0.14);
          border-top-color: rgba(255, 255, 255, 0.85);
        }
        #kx-status { color: var(--muted-foreground); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ring" aria-label="Loading"></div>
      <div id="kx-status" aria-live="polite"></div>
    </div>
  </body>
</html>
