[test]
# Each test file runs in its own process to avoid mock.module() collisions
# between billing unit tests that mock different sets of modules.
isolation = true

# CI's env world: scrub the host sandbox's injected session wiring. See
# src/__tests__/preload-clean-sandbox-env.ts.
preload = ["./src/__tests__/preload-clean-sandbox-env.ts"]
