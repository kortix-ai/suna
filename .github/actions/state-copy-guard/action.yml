name: Terraform state copy guard
description: >-
  Run before `terraform init`. A root whose backend.tf names a regional state
  bucket may init only when its old key in the us-west-2 bucket
  kortix-terraform-state is gone, or when the old key's current version carries
  the tag statemove=copied. The cutover script copy-states.mjs writes that tag
  on the exact version it copied and verified by SHA-256. Any write to the old
  key after the copy creates an untagged version, so the regional state would
  miss it.
inputs:
  root:
    description: Terraform root directory, relative to the workspace.
    required: true
  mode:
    description: "`fail` (apply) or `warn` (read-only plan)."
    required: false
    default: fail
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ROOT: ${{ inputs.root }}
        MODE: ${{ inputs.mode }}
      run: bash "$GITHUB_ACTION_PATH/guard.sh"
