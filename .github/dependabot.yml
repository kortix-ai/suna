# Dependabot — automated dependency updates + security PRs.
# Supports SOC 2 CC7.1 (vulnerability management). Security updates for
# vulnerable deps are opened regardless of the schedule below.
version: 2
updates:
  # JS/TS dependencies (pnpm uses the npm ecosystem).
  - package-ecosystem: "npm"
    directory: "/"
    # main is the dev trunk; PRs target it so they get CI-gated before merge.
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 20
    # `test` runs the six Tests lanes on the PR. A plain PR into main skips
    # them, and #7518 merged a package.json bump whose root pnpm-lock.yaml was
    # stale: every lane on main then failed at `pnpm install --frozen-lockfile`.
    labels: ["dependencies", "test"]
    groups:
      # Batch low-risk minor/patch bumps into one PR to cut review noise.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep GitHub Actions pinned and current (supply-chain hygiene).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/modules/*"
      - "/infra/terraform/environments/*"
      - "/infra/terraform/environments/*/*"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "terraform"]

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/apps/sandbox"
      - "/.kortix"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker"]
