name: Desktop

# Desktop (Electron) PRERELEASE builds — kept OUT of Deploy Dev on purpose. The
# desktop app is a thin shell around the web app that changes rarely and needs
# slow, signed macOS/Windows runners, so building it on every main push would be
# wasteful and would gate the fast API/frontend/CLI path on scarce runners.
#
# It builds only when desktop code changes, or when manually dispatched:
#   push to main     → the `dev` channel     → prerelease `desktop-dev-latest`
#   push to staging  → the `staging` channel → prerelease `desktop-staging-latest`
#
# Each channel is a SEPARATE application — its own appId, product name, icon and
# kortix:// scheme (apps/desktop-electron/src/channel.js) — so a developer can
# install prod, staging and dev on one machine and run them side by side. The
# per-host /download route serves the matching build: dev.kortix.com hands over
# `desktop-dev-latest`, staging.kortix.com `desktop-staging-latest`.
#
# Production desktop installers are built separately by deploy-prod.yml on the
# `stable` channel and bundled into the unified vX.Y.Z release.

on:
  push:
    branches: [main, staging]
    paths:
      - 'apps/desktop-electron/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which desktop channel to build'
        type: choice
        options: [dev, staging]
        default: dev

concurrency:
  # Per-channel: a staging build must never cancel an in-flight dev build.
  group: desktop-${{ inputs.channel || (github.ref_name == 'staging' && 'staging' || 'dev') }}
  cancel-in-progress: true

jobs:
  # ── Resolve the channel + version once, so no job re-derives them ───────────
  setup:
    name: Resolve channel
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'blacksmith-4vcpu-ubuntu-2204' }}
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve channel and version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.channel }}" ]; then
            channel="${{ inputs.channel }}"
          elif [ "$GITHUB_REF_NAME" = "staging" ]; then
            channel="staging"
          else
            channel="dev"
          fi
          # `stable` is deploy-prod.yml's alone: it publishes the immutable
          # vX.Y.Z release, and building it here would overwrite production
          # identity from a mutable prerelease tag.
          if [ "$channel" = "stable" ]; then
            echo "::error::The stable channel is built by deploy-prod.yml, not this workflow."
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-$channel-latest" >> "$GITHUB_OUTPUT"
          echo "::notice::Building the $channel desktop channel → desktop-$channel-latest"

  build:
    name: Build ${{ needs.setup.outputs.channel }} desktop ${{ matrix.target_pretty }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    env:
      # The ONLY identity input. electron-builder.js resolves appId, productName,
      # icon, target URL and kortix:// scheme from it via src/channel.js.
      KORTIX_CHANNEL: ${{ needs.setup.outputs.channel }}
      KORTIX_VERSION: ${{ needs.setup.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal (Apple Silicon + Intel) in one signed/notarized .dmg.
          # `files` lists EVERYTHING the release needs: the installer/download
          # AND the auto-update metadata electron-updater reads (latest*.yml +
          # blockmaps, plus the mac update zip). Without the yml/zip the updater
          # has nothing to fetch.
          - target_pretty: macos
            runner: macos-14
            eb_flag: --mac
            artifact: desktop-macos
            files: |
              apps/desktop-electron/dist/*.dmg
              apps/desktop-electron/dist/*.zip
              apps/desktop-electron/dist/*.blockmap
              apps/desktop-electron/dist/latest-mac.yml
          - target_pretty: windows-x64
            runner: windows-2022
            eb_flag: --win
            artifact: desktop-windows-x64
            files: |
              apps/desktop-electron/dist/*.exe
              apps/desktop-electron/dist/*.blockmap
              apps/desktop-electron/dist/latest.yml
          - target_pretty: linux-x64
            runner: ${{ vars.CI_RUNNER_M_2204 || 'blacksmith-4vcpu-ubuntu-2204' }}
            eb_flag: --linux
            artifact: desktop-linux-x64
            files: |
              apps/desktop-electron/dist/*.AppImage
              apps/desktop-electron/dist/latest-linux.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/desktop-electron
        env:
          npm_config_engine_strict: "false"

      # Fails the build on a typo'd channel or a channel whose icons were never
      # generated — better here than as an unsigned bundle carrying the wrong
      # bundle id.
      - name: Verify channel identity
        shell: bash
        working-directory: apps/desktop-electron
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const c = require("./electron-builder.js");
            for (const f of [c.mac.icon, c.win.icon, c.linux.icon]) {
              if (!fs.existsSync(f)) throw new Error(`missing icon ${f} — run pnpm --filter @kortix/desktop-electron icons`);
            }
            console.log(JSON.stringify({
              appId: c.appId,
              productName: c.productName,
              scheme: c.protocols[0].schemes[0],
              url: c.extraMetadata.kortixDefaultUrl,
              version: c.extraMetadata.version,
            }, null, 1));
          '

      # Decide whether this platform can SIGN. We never hard-fail on missing
      # certs — a build should always produce an installer. If the platform's
      # signing secrets are present we sign (+ notarize on macOS); otherwise we
      # build UNSIGNED (Gatekeeper/SmartScreen warning).
      - name: Decide signing
        id: sign
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          enabled=false
          case "${{ runner.os }}" in
            macOS)   [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && enabled=true ;;
            Windows) [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ] && enabled=true ;;
            *)       enabled=true ;;  # Linux AppImage isn't code-signed anyway
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = true ]; then
            echo "::notice::${{ runner.os }} signing ENABLED."
          else
            echo "::warning::${{ runner.os }} signing secrets absent — building UNSIGNED."
          fi

      - name: Prepare macOS notarization key
        if: runner.os == 'macOS' && steps.sign.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      # electron-builder reads electron's binary from node_modules; .npmrc sets
      # ignore-scripts=true so its download postinstall is skipped — ensure it.
      - name: Ensure Electron runtime
        run: pnpm --filter @kortix/desktop-electron exec node scripts/ensure-runtime.js

      - name: Build desktop installer (Electron)
        shell: bash
        run: |
          pnpm --filter @kortix/desktop-electron exec electron-builder ${{ matrix.eb_flag }} \
            --publish never
        env:
          # macOS signing + notarization (electron-builder conventions).
          CSC_LINK: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_API_ISSUER || '' }}
          # Apple-ID notarization fallback — electron-builder uses whichever set
          # is populated (API key above OR Apple-ID here).
          APPLE_ID: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.sign.outputs.enabled == 'true' && (secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD) || '' }}
          APPLE_TEAM_ID: ${{ steps.sign.outputs.enabled == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # Windows signing (pfx via CSC_*). Both runners read CSC_*; only the
          # matching platform's secret is non-empty.
          WIN_CSC_LINK: ${{ steps.sign.outputs.enabled == 'true' && secrets.WINDOWS_CERTIFICATE || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ steps.sign.outputs.enabled == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          # Never let an unsigned build fail the job.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.sign.outputs.enabled }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # ── Publish/refresh the mutable `desktop-<channel>-latest` prerelease ───────
  publish:
    name: Publish ${{ needs.setup.outputs.tag }}
    needs: [setup, build]
    # Publish whatever installers built — a single OS's signing failure shouldn't
    # discard the others.
    if: always() && needs.build.result != 'cancelled' && needs.setup.result == 'success'
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'blacksmith-4vcpu-ubuntu-2204' }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          path: desktop-artifacts/
          pattern: desktop-*
          merge-multiple: true

      - name: Assemble assets + checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find desktop-artifacts -maxdepth 1 -type f -exec cp -v {} release/ \;
          cd release
          if [ -z "$(ls -A)" ]; then
            echo "No desktop installers were produced (all targets failed)." >&2
            exit 1
          fi
          sha256sum ./* > SHA256SUMS
          ls -lh

      - name: Move ${{ env.TAG }} to this commit
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "$TAG"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Mutable **${{ needs.setup.outputs.channel }}** desktop build for `${{ github.sha }}`.

            Installs alongside the other channels — its own app name, icon and
            `kortix-${{ needs.setup.outputs.channel }}://` scheme. Get it from
            https://${{ needs.setup.outputs.channel }}.kortix.com/download
          files: |
            release/*
