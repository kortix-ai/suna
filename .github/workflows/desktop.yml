name: Desktop

# Desktop (Electron) DEV and STAGING builds — kept OUT of Deploy Dev on purpose. The desktop
# app is a thin shell around the web app that changes rarely and needs slow,
# signed macOS/Windows runners, so building it on every dev push would be
# wasteful and would gate the fast API/frontend/CLI path on scarce runners.
#
# It builds only when manually dispatched (since 2026-10-03: a push to dev
# touching apps/desktop-electron/** no longer builds; macOS bills at 10x and
# Windows at 2x GitHub-hosted minutes). Signed installers are published to the mutable `desktop-<channel>-latest`
# prerelease: `dev` opens dev.kortix.com, `staging` opens staging.kortix.com.
# Each deployment's /download serves its own channel
# (apps/web/src/features/marketing/download/releases.ts).
#
# Production desktop installers are built separately by deploy-prod.yml and
# bundled into the unified vX.Y.Z release.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Deployment the build opens and the prerelease it publishes to
        type: choice
        options: [dev, staging]
        default: dev

env:
  CHANNEL: ${{ inputs.channel || 'dev' }}
  PRODUCT_NAME: ${{ inputs.channel == 'staging' && 'Kortix Staging' || 'Kortix Dev' }}

concurrency:
  group: desktop-${{ inputs.channel || 'dev' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.channel || 'dev' }} desktop ${{ matrix.target_pretty }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)
    env:
      # Baked into the app so the shell points at its deployment by default.
      DESKTOP_URL: https://${{ inputs.channel || 'dev' }}.kortix.com/projects
      # Distinct bundle id so dev, staging and prod installs sit side by side.
      DESKTOP_APP_ID: com.kortix.desktop.${{ inputs.channel || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal (Apple Silicon + Intel) in one signed/notarized .dmg.
          # `files` lists EVERYTHING the release needs: the installer/download
          # AND the auto-update metadata electron-updater reads (latest*.yml +
          # blockmaps, plus the mac update zip). Without the yml/zip the updater
          # has nothing to fetch.
          - target_pretty: macos
            runner: macos-14
            eb_flag: --mac
            artifact: desktop-macos
            files: |
              apps/desktop-electron/dist/*.dmg
              apps/desktop-electron/dist/*.zip
              apps/desktop-electron/dist/*.blockmap
              apps/desktop-electron/dist/latest-mac.yml
          - target_pretty: windows-x64
            runner: windows-2022
            eb_flag: --win
            artifact: desktop-windows-x64
            files: |
              apps/desktop-electron/dist/*.exe
              apps/desktop-electron/dist/*.blockmap
              apps/desktop-electron/dist/latest.yml
          - target_pretty: linux-x64
            runner: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
            eb_flag: --linux
            artifact: desktop-linux-x64
            files: |
              apps/desktop-electron/dist/*.AppImage
              apps/desktop-electron/dist/latest-linux.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      # The app bundles the computer agent (packages/agent-tunnel), built with
      # bun by scripts/ensure-runtime.js before electron-builder runs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/desktop-electron --filter @kortix/agent-tunnel
        env:
          npm_config_engine_strict: "false"

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # The bundled agent reads its version from the package.json shipped next
      # to it. The checked-in value is inert, so stamp the release: the app
      # restarts a service that runs another version (v2 R5).
      - name: Stamp the bundled agent version
        shell: bash
        run: node -e "const f='packages/agent-tunnel/package.json';const p=JSON.parse(require('fs').readFileSync(f,'utf8'));p.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "${{ steps.ver.outputs.version }}"

      # Signing material lives in kortix-ci-env. Every key is optional: a build
      # never hard-fails on missing certs. The read is skipped on Windows,
      # where no signing material has ever been stored (WINDOWS_CERTIFICATE*
      # stays empty, so Windows installers build UNSIGNED, as before). Only
      # the Apple-ID notarization keys are stored today; the APPLE_API_* keys
      # are read in case they are added later.
      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read signing credentials from AWS Secrets Manager
        continue-on-error: true
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            APPLE_CERTIFICATE?
            APPLE_CERTIFICATE_PASSWORD?
            APPLE_ID?
            APPLE_APP_SPECIFIC_PASSWORD?
            APPLE_TEAM_ID?
            APPLE_API_KEY_P8?
            APPLE_API_KEY_ID=kortix-ci-env:APPLE_API_KEY?
            APPLE_API_ISSUER?
            AZURE_SIGNING_TENANT_ID?
            AZURE_SIGNING_CLIENT_ID?
            AZURE_SIGNING_CLIENT_SECRET?
            AZURE_SIGNING_ENDPOINT?
            AZURE_SIGNING_ACCOUNT?
            AZURE_SIGNING_PROFILE?
            KORTIX_DESKTOP_SENTRY_DSN?
            # The dev site's HTTP Basic password, for the Windows chrome screenshot below.
            WEB_PROTECTION_PASSWORD=kortix-dev-use2-web-env:WEB_PROTECTION_PASSWORD?

      # Decide whether this platform can SIGN. We never hard-fail on missing
      # certs — a build should always produce an installer. If the platform's
      # signing secrets are present we sign (+ notarize on macOS); otherwise we
      # build UNSIGNED (Gatekeeper/SmartScreen warning).
      - name: Decide signing
        id: sign
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE || secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ env.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ env.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_SIGNING_CLIENT_SECRET: ${{ env.AZURE_SIGNING_CLIENT_SECRET }}
          AZURE_SIGNING_PROFILE: ${{ env.AZURE_SIGNING_PROFILE }}
        run: |
          enabled=false
          case "${{ runner.os }}" in
            macOS)   [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && enabled=true ;;
            Windows) { [ -n "$AZURE_SIGNING_CLIENT_SECRET" ] && [ -n "$AZURE_SIGNING_PROFILE" ]; } || { [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; } && enabled=true ;;
            *)       enabled=true ;;  # Linux AppImage isn't code-signed anyway
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = true ]; then
            echo "::notice::${{ runner.os }} signing ENABLED."
          else
            echo "::warning::${{ runner.os }} signing secrets absent — building UNSIGNED."
          fi

      - name: Prepare macOS notarization key
        if: runner.os == 'macOS' && steps.sign.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ env.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      # electron-builder reads electron's binary from node_modules; .npmrc sets
      # ignore-scripts=true so its download postinstall is skipped — ensure it.
      - name: Ensure Electron runtime
        run: pnpm --filter @kortix/desktop-electron exec node scripts/ensure-runtime.js

      - name: Build desktop installer (Electron)
        shell: bash
        run: |
          # Windows: Authenticode through Microsoft Artifact Signing when kortix-ci-env has it.
          azure=()
          if [ "${{ runner.os }}" = Windows ] && [ "${{ steps.sign.outputs.enabled }}" = true ] && [ -n "${AZURE_CLIENT_SECRET:-}" ]; then
            azure=(--config.win.azureSignOptions.publisherName="Kortix AI Corp"
                   --config.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
                   --config.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
                   --config.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE")
          fi
          pnpm --filter @kortix/desktop-electron exec electron-builder ${{ matrix.eb_flag }} \
          "${azure[@]}" \
            --publish never \
            --config.extraMetadata.version="${{ steps.ver.outputs.version }}" \
            --config.extraMetadata.kortixDefaultUrl="$DESKTOP_URL" \
            --config.extraMetadata.kortixDesktopSentryDsn="$KORTIX_DESKTOP_SENTRY_DSN" \
            --config.extraMetadata.kortixUpdateChannel="$CHANNEL" \
            --config.productName="$PRODUCT_NAME" \
            --config.extraMetadata.productName="$PRODUCT_NAME" \
            --config.appId="$DESKTOP_APP_ID"
        env:
          # macOS signing + notarization (electron-builder conventions).
          KORTIX_DESKTOP_SENTRY_DSN: ${{ env.KORTIX_DESKTOP_SENTRY_DSN || secrets.KORTIX_DESKTOP_SENTRY_DSN }}
          CSC_LINK: ${{ steps.sign.outputs.enabled == 'true' && (env.APPLE_CERTIFICATE || secrets.APPLE_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ steps.sign.outputs.enabled == 'true' && (env.APPLE_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD) || '' }}
          APPLE_API_KEY_ID: ${{ steps.sign.outputs.enabled == 'true' && env.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.sign.outputs.enabled == 'true' && env.APPLE_API_ISSUER || '' }}
          # Apple-ID notarization fallback — electron-builder uses whichever set
          # is populated (API key above OR Apple-ID here).
          APPLE_ID: ${{ steps.sign.outputs.enabled == 'true' && (env.APPLE_ID || secrets.APPLE_ID) || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.sign.outputs.enabled == 'true' && (env.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_APP_SPECIFIC_PASSWORD) || '' }}
          APPLE_TEAM_ID: ${{ steps.sign.outputs.enabled == 'true' && (env.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID) || '' }}
          # Windows signing (pfx via CSC_*). Both runners read CSC_*; only the
          # matching platform's secret is non-empty.
          WIN_CSC_LINK: ${{ steps.sign.outputs.enabled == 'true' && env.WINDOWS_CERTIFICATE || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ steps.sign.outputs.enabled == 'true' && env.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          # Windows Artifact Signing (electron-builder `win.azureSignOptions` reads these).
          AZURE_TENANT_ID: ${{ steps.sign.outputs.enabled == 'true' && env.AZURE_SIGNING_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.sign.outputs.enabled == 'true' && env.AZURE_SIGNING_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.sign.outputs.enabled == 'true' && env.AZURE_SIGNING_CLIENT_SECRET || '' }}
          # Never let an unsigned build fail the job.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.sign.outputs.enabled }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The Windows installer is signed by Kortix AI Corp
        if: runner.os == 'Windows' && steps.sign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem apps/desktop-electron/dist/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($sig.Status)" }
          }
      # Visual check of the Windows window chrome on a real Windows desktop:
      # start the unpacked build against dev, screenshot the screen, press a
      # lone Alt (opens the Kortix application menu), screenshot again. The
      # PNGs are a run artifact (`screenshot-windows-chrome`, outside the
      # `desktop-*` pattern the publish job releases). Never fails the build.
      - name: Screenshot the Windows window chrome
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          KORTIX_DESKTOP_URL: ${{ env.DESKTOP_URL }}
          KORTIX_DESKTOP_BASIC_PASSWORD: ${{ env.WEB_PROTECTION_PASSWORD }}
        run: |
          $env:KORTIX_DESKTOP_USER_DATA = Join-Path $env:RUNNER_TEMP 'kortix-chrome-smoke'
          $out = Join-Path $env:RUNNER_TEMP 'window-chrome'
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe = Get-ChildItem apps/desktop-electron/dist/win-unpacked/*.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 40
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Win32 -Name Keys -MemberDefinition '[DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, System.UIntPtr extra);'
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $out "$name.png"))
          }
          Shot '1-window'
          [Win32.Keys]::keybd_event(0x12, 0, 0, [System.UIntPtr]::Zero)
          [Win32.Keys]::keybd_event(0x12, 0, 2, [System.UIntPtr]::Zero)
          Start-Sleep -Seconds 2
          Shot '2-alt-menu'
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem $out
      - name: Upload the window-chrome screenshots
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-windows-chrome
          path: ${{ runner.temp }}/window-chrome
          if-no-files-found: warn

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # ── Publish/refresh the mutable `desktop-<channel>-latest` prerelease ───────
  publish:
    name: Publish desktop-${{ inputs.channel || 'dev' }}-latest
    needs: build
    # Publish whatever installers built — a single OS's signing failure shouldn't
    # discard the others.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: desktop-artifacts/
          pattern: desktop-*
          merge-multiple: true

      - name: Assemble assets + checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find desktop-artifacts -maxdepth 1 -type f -exec cp -v {} release/ \;
          cd release
          if [ -z "$(ls -A)" ]; then
            echo "No desktop installers were produced (all targets failed)." >&2
            exit 1
          fi
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Move the channel tag to this commit
        run: |
          git tag -f "desktop-$CHANNEL-latest" "$GITHUB_SHA"
          git push -f origin "desktop-$CHANNEL-latest"

      - name: Publish GitHub prerelease (desktop-${{ env.CHANNEL }}-latest)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: desktop-${{ env.CHANNEL }}-latest
          name: desktop-${{ env.CHANNEL }}-latest
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Mutable ${{ env.CHANNEL }} desktop build for `${{ github.sha }}`.
            Defaults to `https://${{ env.CHANNEL }}.kortix.com/projects`.
          files: |
            release/*
