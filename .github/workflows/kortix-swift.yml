name: Kortix Swift

# Test the Swift package on macOS and build it for iOS Simulator through the single
# root test runner. The matrix keeps the runner replaceable without changing the job.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'packages/kortix-swift/**'
      - 'tests/bin/local.ts'
      - 'tests/src/core/local-runner.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/kortix-swift.yml'
  workflow_dispatch:

concurrency:
  group: kortix-swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift package validation (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
        env:
          npm_config_engine_strict: 'false'

      - name: Show Swift version
        run: swift --version

      - name: Validate Swift package through the root runner
        run: pnpm test -- --swift-only
