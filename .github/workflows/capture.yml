name: Capture

# Real-OS checks for the Kortix Capture recorder (apps/capture): build, unit
# tests, engine protocol test, then a 90 s local recording of a desktop with
# known text, asserting frames, OCR search, URLs, video chunks and image export.
# Windows needs GitHub's runner: it has an interactive desktop (session 2).

on:
  workflow_dispatch:
  push:
    branches: [main, kortix-capture]
    paths:
      - "apps/capture/**"
      - ".github/workflows/capture.yml"

permissions:
  contents: read

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: apps/capture
    env:
      EV: ${{ github.workspace }}\evidence
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/capture
      - name: Build
        run: cargo build --release --bins
      - name: Tests
        run: cargo test --release
      - name: Record a known desktop
        run: |
          New-Item -ItemType Directory -Force $env:EV | Out-Null
          $env:KORTIX_CAPTURE_DIR = "$env:RUNNER_TEMP\caplib"
          New-Item -ItemType Directory -Force $env:KORTIX_CAPTURE_DIR | Out-Null
          '{"pause_on_inactivity": false, "record_unknown_bundle_ids": true}' | Set-Content "$env:KORTIX_CAPTURE_DIR\settings.json"
          "KORTIX CAPTURE WINDOWS VERIFY`r`nThe quick brown fox jumps over the lazy dog`r`nInvoice number 4815162342" | Set-Content "$env:RUNNER_TEMP\note.txt"
          Start-Process msedge.exe "--no-first-run --new-window https://example.com/"
          Start-Sleep 8
          Start-Process notepad.exe "$env:RUNNER_TEMP\note.txt"
          Start-Sleep 3
          $flip = Start-Job {
            $sh = New-Object -ComObject WScript.Shell
            for ($i = 0; $i -lt 6; $i++) { Start-Sleep 9; $null = $sh.AppActivate("Edge"); Start-Sleep 9; $null = $sh.AppActivate("note") }
          }
          .\target\release\kortix-capture.exe record --local --duration 90
          Stop-Job $flip -ErrorAction SilentlyContinue
          $k = ".\target\release\kortix-capture.exe"
          & $k --json status | Out-File -Encoding utf8 "$env:EV\status.json"
          & $k --json query fts "VERIFY OR fox OR 4815162342" --limit 5 | Out-File -Encoding utf8 "$env:EV\fts_notepad.json"
          & $k --json query fts "Example Domain" --limit 5 | Out-File -Encoding utf8 "$env:EV\fts_edge.json"
          & $k usage top-applications | Out-File -Encoding utf8 "$env:EV\top_apps.txt"
          $id = (Get-Content "$env:EV\fts_notepad.json" -Raw | ConvertFrom-Json)[0].frame_id
          & $k query frame --id $id --show-ocr | Out-File -Encoding utf8 "$env:EV\frame_ocr.txt"
          $png = & $k query image --id $id
          Copy-Item $png "$env:EV\frame.png"
      - name: Assert
        shell: python
        run: |
          import json, os, pathlib
          ev = pathlib.Path(os.environ["EV"])
          load = lambda n: json.loads((ev / n).read_text(encoding="utf-8-sig"))
          c = load("status.json")["counts"]; print("counts", c)
          assert c["frames"] >= 30, c
          assert c["videos"] >= 1, c
          assert c["ocr_pending"] == 0, c
          notepad, edge = load("fts_notepad.json"), load("fts_edge.json")
          print("fts notepad", len(notepad), "edge", len(edge))
          assert notepad, "Notepad text not searchable"
          assert edge, "Edge page text not searchable"
          assert any("example.com" in (h.get("url") or "") for h in edge), "browser URL not captured"
          apps = (ev / "top_apps.txt").read_text(encoding="utf-8-sig").lower()
          assert "notepad" in apps and "edge" in apps, apps
          assert (ev / "frame.png").stat().st_size > 10_000
          print("WINDOWS OK")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-windows
          path: evidence
          if-no-files-found: ignore

  linux:
    runs-on: ${{ vars.CI_RUNNER_M || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/capture
    env:
      EV: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/capture
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb openbox xterm tesseract-ocr ffmpeg
      - name: Build and test
        run: cargo build --release --bins && cargo test --release
      - name: Record a known desktop
        run: |
          mkdir -p $EV
          export DISPLAY=:99 KORTIX_CAPTURE_DIR=$RUNNER_TEMP/caplib
          Xvfb :99 -screen 0 1600x1000x24 & sleep 2
          openbox & sleep 1
          mkdir -p $KORTIX_CAPTURE_DIR
          echo '{"pause_on_inactivity": false, "record_unknown_bundle_ids": true}' > $KORTIX_CAPTURE_DIR/settings.json
          xterm -fa Monospace -fs 16 -geometry 90x20+50+50 -e bash -c 'echo KORTIX CAPTURE LINUX VERIFY; echo Invoice number 4815162342; sleep 900' & sleep 3
          k=./target/release/kortix-capture
          $k record --local --duration 60
          $k --json status > $EV/status.json
          $k --json query fts "VERIFY OR 4815162342" --limit 5 > $EV/fts.json
          id=$(python3 -c "import json;print(json.load(open('$EV/fts.json'))[0]['frame_id'])")
          cp "$($k query image --id $id | tail -1)" $EV/frame.png
      - name: Assert
        shell: python3 {0}
        run: |
          import json, os, pathlib
          ev = pathlib.Path(os.environ["EV"])
          c = json.loads((ev / "status.json").read_text())["counts"]; print("counts", c)
          assert c["frames"] >= 20 and c["videos"] >= 1 and c["ocr_pending"] == 0, c
          assert json.loads((ev / "fts.json").read_text()), "xterm text not searchable"
          assert (ev / "frame.png").stat().st_size > 5_000
          print("LINUX OK")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-linux
          path: evidence
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/capture
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/capture
      - name: Build and test (no screen permission on hosted runners)
        run: cargo build --release --bins && cargo test --release
