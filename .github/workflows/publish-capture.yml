name: Publish Kortix Capture

# Kortix Capture is its own app, built and released in kortix-ai/capture (a
# private repo). This copies the installers of one of its releases into a
# public Release of this repo, tagged `capture-<tag>` and never marked
# "latest", where /download/capture/<windows|macos|linux> finds them
# (apps/web/src/features/marketing/download/releases.ts). It is independent of
# the Kortix release: run it whenever a new Capture release should ship.
#
#   gh workflow run publish-capture.yml -f tag=v0.39
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The kortix-ai/capture release tag to publish, e.g. v0.39
        required: true
        type: string

concurrency:
  group: publish-capture
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)

jobs:
  publish:
    name: Publish Kortix Capture ${{ inputs.tag }}
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read the Capture release token from AWS Secrets Manager
        uses: ./.github/actions/aws-env
        with:
          keys: |
            CAPTURE_RELEASES_TOKEN
      - name: Copy the installers into capture-${{ inputs.tag }}
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTURE_RELEASES_TOKEN: ${{ env.CAPTURE_RELEASES_TOKEN || secrets.CAPTURE_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::tag must look like v0.39"; exit 1; }
          mkdir installers && cd installers
          GH_TOKEN="$CAPTURE_RELEASES_TOKEN" gh release download "$TAG" --repo kortix-ai/capture \
            --pattern 'KortixCapture-*-x64.msi' --pattern 'KortixCapture-*-universal.pkg' --pattern 'KortixCapture-*-universal.dmg' --pattern 'kortix-capture_*_amd64.deb'
          for want in 'KortixCapture-*-x64.msi' 'KortixCapture-*-universal.pkg' 'KortixCapture-*-universal.dmg' 'kortix-capture_*_amd64.deb'; do
            compgen -G "$want" > /dev/null || { echo "::error::kortix-ai/capture $TAG has no $want"; exit 1; }
          done
          # Stable names for the copy-paste install commands (Devices → Roll out, docs).
          cp KortixCapture-*-x64.msi KortixCapture-x64.msi
          cp KortixCapture-*-universal.pkg KortixCapture-universal.pkg
          cp KortixCapture-*-universal.dmg KortixCapture-universal.dmg
          cp kortix-capture_*_amd64.deb kortix-capture_amd64.deb
          sha256sum ./* > SHA256SUMS
          release="capture-$TAG"
          notes="Kortix Capture $TAG: Windows (.msi), macOS (.dmg; .pkg for IT) and Linux (.deb). Install guide: https://kortix.com/docs/capture#install-kortix-capture"
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$release" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release" ./* --repo "$GITHUB_REPOSITORY" --title "Kortix Capture $TAG" --notes "$notes" --latest=false
          fi
          gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
