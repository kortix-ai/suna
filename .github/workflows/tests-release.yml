name: Tests - release

on:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened, ready_for_review]
  # Dry run. `RELEASE_SOURCE_SHA` only exists on a `release/*` branch, so before
  # this input the gate could not be exercised without opening a release PR into
  # `prod` — a gate that has never been green could never be rehearsed either.
  # `expected_sha` supplies the same value the file would, and nothing else
  # changes: the same jobs, the same staging URLs, the same SHA assertion.
  #
  #   gh workflow run tests-release.yml --ref staging -f expected_sha=<sha>
  #
  # `--ref` selects which branch's workflow and tests run; the target is always
  # staging, because the staging URLs come from the env block below and not from
  # the ref. Dispatch against the branch under test to rehearse a change to the
  # gate itself.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 40-character Git SHA that staging must already be serving
        required: true
        type: string

# ONE gate against staging at a time, across every ref. Rehearsal 38278168762
# (2026-10-12) ran beside two other branches' gates: staging dropped database
# connections and boot prompts timed out, and the run proved nothing. Runs
# queue; GitHub keeps one waiting run and a newer one replaces it, so do not
# dispatch a rehearsal while a release gate waits. A run made stale by a newer
# staging deploy fails its SHA assertion in seconds, so it barely delays the
# next one.
concurrency:
  group: tests-release-staging
  cancel-in-progress: false

# Shared by every job. Top-level env is the only way to avoid repeating this
# block per matrix job — GitHub Actions has no YAML anchors.
env:
  KE2E_API_URL: ${{ vars.QA_API_BASE_URL || 'https://staging-api.kortix.com/v1' }}
  E2E_BASE_URL: ${{ vars.QA_WEB_BASE_URL || 'https://staging.kortix.com' }}
  KE2E_GATEWAY_URL: ${{ vars.QA_GATEWAY_URL || 'https://gateway-staging.kortix.com' }}
  KE2E_TARGET: staging
  KE2E_LIVE_CONFIRM: ci
  KE2E_CAP_MANAGED_GIT_PUSH: ${{ vars.KE2E_CAP_MANAGED_GIT_PUSH || '0' }}
  # Credentials are NOT here: a workflow-level env cannot read AWS. Every job
  # that talks to staging reads them first thing through .github/actions/aws-env
  # (the "Read staging credentials" step), from kortix-staging-env,
  # kortix-staging-euw2-web-env, and kortix-ci-env. Notes on the less obvious ones:
  # - VERCEL_AUTOMATION_BYPASS_SECRET: staging is behind Vercel SSO deployment
  #   protection; the browser lane must send x-vercel-protection-bypass
  #   (playwright.config) or every authenticated page 302s to vercel.com/sso-api.
  # - KE2E_CI_PASSTHROUGH_SECRET: lets the api-router edge Worker return the
  #   TRUE origin status/body to the gate instead of laundering every origin
  #   failure into MAINTENANCE_MODE (worker.mjs CI_PASSTHROUGH_SECRET binding).
  #   Diagnosability only; the Worker's public behavior is unchanged.
  # - KE2E_AUTH_EMAIL_HOOK_SECRET: AUTH-2 signs a Supabase send-email hook
  #   payload with the secret the DEPLOYED API verifies with
  #   (kortix-staging-env AUTH_EMAIL_HOOK_SECRET). When it is unset the flow's
  #   signed steps skip themselves and its unsigned `401 | 503` assertion
  #   still runs.
  # - KE2E_OWNER_EMAIL / KE2E_OWNER_PASSWORD: optional, not stored today.

jobs:
  # Reclaim debris left by EARLIER runs. `--older-than 2h` cannot touch an
  # account this run just created, so it runs BESIDE the deployed jobs, not in
  # front of them: as a prerequisite it added ~1.5 min to every gate run
  # (38495058722: 01:44:55 -> 01:46:29 before any shard started).
  # continue-on-error keeps a janitorial failure from blocking the release: the
  # next run sweeps again.
  sweep-before:
    name: sweep stale test accounts
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read staging credentials from AWS Secrets Manager
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            KE2E_OWNER_EMAIL?
            KE2E_OWNER_PASSWORD?
            KE2E_SUPABASE_URL=kortix-staging-env:SUPABASE_URL
            KE2E_SUPABASE_ANON_KEY=kortix-staging-env:SUPABASE_ANON_KEY
            KE2E_SUPABASE_SERVICE_ROLE_KEY=kortix-staging-env:SUPABASE_SERVICE_ROLE_KEY
            KE2E_DATABASE_URL=kortix-staging-env:DATABASE_URL
            KE2E_INTERNAL_SERVICE_KEY=kortix-staging-env:INTERNAL_SERVICE_KEY
            KE2E_STRIPE_SECRET_KEY=kortix-staging-env:STRIPE_SECRET_KEY
            KE2E_STRIPE_WEBHOOK_SECRET=kortix-staging-env:STRIPE_WEBHOOK_SECRET
            E2E_AGENTMAIL_API_KEY
            WEB_PROTECTION_PASSWORD=kortix-staging-euw2-web-env:WEB_PROTECTION_PASSWORD
            VERCEL_AUTOMATION_BYPASS_SECRET
            KE2E_CI_PASSTHROUGH_SECRET=kortix-ci-env:CF_WORKER_CI_PASSTHROUGH_SECRET
            KE2E_AUTH_EMAIL_HOOK_SECRET=kortix-staging-env:AUTH_EMAIL_HOOK_SECRET?
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install runner dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/tests...
        # Every other workflow that installs from this lockfile (tests.yml,
        # deploy-prod, deploy-staging) already relaxes engine-strict here. The
        # runner cache resolves `node-version: 22` to 22.22.0, and
        # write-file-atomic@8.0.0 (via apps/web, since #7121) declares
        # `^22.22.2`; with .npmrc engine-strict=true that killed every shard at
        # install (run 33995649798, release/v0.13.11).
        env:
          npm_config_engine_strict: "false"
      # Bounded at the STEP so a slow sweep ends as a job *failure* (which
      # continue-on-error absorbs) — never as a job *cancelled*: on run
      # 32226539107 the 15-minute job cap fired while gc was still deleting a
      # day's worth of debris, GitHub recorded the job as cancelled, and every
      # shard (then a dependent) was skipped. A janitor must never be able to
      # skip the gate. Whatever it did not reach, the next run's sweep gets.
      - name: Reclaim test accounts older than 2h
        timeout-minutes: 12
        run: bun tests/bin/ke2e.ts gc --older-than 2h

  # The deployed API smoke: the flows tagged `deployed`
  # (tests/src/core/local-runner.ts DEPLOYED_FLOW_TAG, seam table in
  # tests/README.md "Release gate"). The staging pull request's `Tests` lanes
  # already ran every flow on this tree, so this job proves only what a
  # deployment can break: real Supabase auth, real sandbox boot and wake, the
  # runtime proxy and SSE through the edge, the LLM gateway, Stripe, object
  # storage, managed git push, email, health and SHA, CORS and domains.
  #
  # One job, no matrix. Before 2026-10-16 this was 6 shards of the whole
  # registry (~700 flows), 10-17 min each (green run 38495058722), and 5 gate
  # rounds for v0.13.57 on shared-staging flakes. The `deployed` set is ~45
  # flows: about 1 min of runner setup, the sandbox image/runtime check, then
  # ~2-3 min of flows. `--require-all` applies to the whole set.
  api:
    name: deployed api smoke
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)
    # A ceiling that turns a hang into a readable failure, never a throttle.
    # The normal run is ~5 min. The cap is larger because runner.ts waits up to
    # 15 min for a cold default sandbox image and 10 min for its runtime before
    # the first sandbox flow (unit/gate-setup-budgets.test.ts). A cold image
    # right after a staging deploy is a slow pass, not a failure.
    timeout-minutes: 30
    env:
      # Pin the run id so the post-run sweep below can reclaim exactly THIS
      # job's principals (`principals.ts` names them `e2e-<runId>-…`).
      #
      # The ATTEMPT is part of the identity, or `gh run rerun --failed` collides
      # with its own debris: `github.run_id` is identical across attempts, so
      # every run-scoped fixture name is too. Run 32330628092 attempt 2 failed
      # KAAB-7 in 2.2s with `409 IDEMPOTENCY_KEY_CONFLICT` for exactly this
      # reason. Only a re-run gets the suffix. The reclaim step below reads this
      # same variable, so the sweep stays exact.
      KE2E_RUN_ID: ${{ github.run_id }}-api${{ github.run_attempt != 1 && format('-a{0}', github.run_attempt) || '' }}
      # Staging concurrency, the fleet total: 4 API + 5 sandbox workers here
      # plus 4 browser workers = 13. Run 32231251280 collapsed staging at 26;
      # 15 held (32240074477); 19 produced origin 5xx on team-create
      # (32323656671). Lower these first if MAINTENANCE_MODE 503s reappear.
      KE2E_API_WORKERS: '4'
      KE2E_SANDBOX_WORKERS: '5'
      KE2E_TIMEOUT_ATTEMPTS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read staging credentials from AWS Secrets Manager
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            KE2E_OWNER_EMAIL?
            KE2E_OWNER_PASSWORD?
            KE2E_SUPABASE_URL=kortix-staging-env:SUPABASE_URL
            KE2E_SUPABASE_ANON_KEY=kortix-staging-env:SUPABASE_ANON_KEY
            KE2E_SUPABASE_SERVICE_ROLE_KEY=kortix-staging-env:SUPABASE_SERVICE_ROLE_KEY
            KE2E_DATABASE_URL=kortix-staging-env:DATABASE_URL
            KE2E_INTERNAL_SERVICE_KEY=kortix-staging-env:INTERNAL_SERVICE_KEY
            KE2E_STRIPE_SECRET_KEY=kortix-staging-env:STRIPE_SECRET_KEY
            KE2E_STRIPE_WEBHOOK_SECRET=kortix-staging-env:STRIPE_WEBHOOK_SECRET
            E2E_AGENTMAIL_API_KEY
            WEB_PROTECTION_PASSWORD=kortix-staging-euw2-web-env:WEB_PROTECTION_PASSWORD
            VERCEL_AUTOMATION_BYPASS_SECRET
            KE2E_CI_PASSTHROUGH_SECRET=kortix-ci-env:CF_WORKER_CI_PASSTHROUGH_SECRET
            KE2E_AUTH_EMAIL_HOOK_SECRET=kortix-staging-env:AUTH_EMAIL_HOOK_SECRET?
      # One SHA, two sources. A release PR carries RELEASE_SOURCE_SHA in the
      # tree; a dry run supplies the same value as `expected_sha`. The input
      # arrives through env, never interpolated into this script, so a dispatch
      # cannot inject shell — and it is accepted only after the same
      # 40-hex-character check the file gets.
      - name: Require the deployed staging source SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ -n "${EXPECTED_SHA:-}" ]; then
            source_sha="$(printf '%s' "$EXPECTED_SHA" | tr -d '[:space:]')"
            origin="workflow_dispatch input expected_sha"
          else
            test -f RELEASE_SOURCE_SHA || {
              echo "::error::No RELEASE_SOURCE_SHA in the tree and no expected_sha input."
              exit 1
            }
            source_sha="$(tr -d '[:space:]' < RELEASE_SOURCE_SHA)"
            origin="RELEASE_SOURCE_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::$origin must give one 40-character Git SHA."
            exit 1
          }
          echo "KE2E_EXPECT_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Expected deployed staging SHA: $source_sha (from $origin)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install deployed-target dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/tests...
        # Every other workflow that installs from this lockfile (tests.yml,
        # deploy-prod, deploy-staging) already relaxes engine-strict here. The
        # runner cache resolves `node-version: 22` to 22.22.0, and
        # write-file-atomic@8.0.0 (via apps/web, since #7121) declares
        # `^22.22.2`; with .npmrc engine-strict=true that killed every shard at
        # install (run 33995649798, release/v0.13.11).
        env:
          npm_config_engine_strict: "false"
      - name: Run the deployed staging API smoke
        run: pnpm test -- --target-api-full
      # A cancelled job is SIGKILLed before the runner's `finally` teardown, so
      # every cancel used to leak its whole world. `always()` covers cancelled,
      # failed and passed; --run-id scopes the sweep to this job so it cannot
      # delete another run's live accounts.
      - name: Reclaim this job's test accounts
        if: always()
        continue-on-error: true
        run: bun tests/bin/ke2e.ts gc --run-id "$KE2E_RUN_ID"
      - name: Guard test artifacts against secrets
        id: artifact-secrets
        if: always()
        run: |
          set -euo pipefail
          # grep, never rg: GitHub's ubuntu images ship no ripgrep, and with the
          # tool missing under `2>/dev/null` this guard passed on nothing from
          # its first run until 2026-08-25, when Blacksmith images (which ship
          # rg) ran it for real. Pattern = GUARD_PATTERN_SOURCE in
          # tests/src/core/scrub.ts; the runner scrubs the same shapes before
          # writing results.json / report.html.
          pattern='kortix_(pat|sa)_[A-Za-z0-9]{12,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,}\.'
          if [ -d tests/test-results ] && grep -rEIl "$pattern" tests/test-results; then
            echo "::error::A test artifact contains a secret-shaped value."
            exit 1
          fi
          if [ -n "${KE2E_CI_PASSTHROUGH_SECRET:-}" ] && [ -d tests/test-results ] \
            && grep -rFq -- "$KE2E_CI_PASSTHROUGH_SECRET" tests/test-results; then
            echo "::error::A test artifact contains the CI diagnostic credential."
            exit 1
          fi
          echo "No secret-shaped values found."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Cancellation can leave raw Playwright traces before reporter scrubbing.
        if: ${{ always() && steps.artifact-secrets.outcome == 'success' }}
        with:
          name: tests-release-api
          path: |
            tests/test-results/**
            !tests/test-results/deployment-bypass-state.json
          if-no-files-found: warn
          retention-days: 90

  # The deployed browser journeys, split by measured spec duration
  # (tests/src/core/browser-shard.ts, table in tests/e2e/shard-durations.json).
  browser:
    name: deployed browser shard
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Four shards, one browser each: the `deployed` table in
      # tests/e2e/shard-durations.json puts each spec 27 file on a shard of its
      # own and splits the other 8 specs over two: 217/190/176/180 s.
      # Two shards ran 9.5-12.8 min each; the release suite targets <= 10 min.
      E2E_BROWSER_WORKERS: '1'
      # No spec is quarantined; the exclusion stays as a guard against a stray tag.
      # Playwright applies this at collection, so an excluded spec is absent,
      # not "skipped" — the strict-skip reporter stays strict. See #6584.
      E2E_EXCLUDE_TAGS: '@quarantine'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read staging credentials from AWS Secrets Manager
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            KE2E_OWNER_EMAIL?
            KE2E_OWNER_PASSWORD?
            KE2E_SUPABASE_URL=kortix-staging-env:SUPABASE_URL
            KE2E_SUPABASE_ANON_KEY=kortix-staging-env:SUPABASE_ANON_KEY
            KE2E_SUPABASE_SERVICE_ROLE_KEY=kortix-staging-env:SUPABASE_SERVICE_ROLE_KEY
            KE2E_DATABASE_URL=kortix-staging-env:DATABASE_URL
            KE2E_INTERNAL_SERVICE_KEY=kortix-staging-env:INTERNAL_SERVICE_KEY
            KE2E_STRIPE_SECRET_KEY=kortix-staging-env:STRIPE_SECRET_KEY
            KE2E_STRIPE_WEBHOOK_SECRET=kortix-staging-env:STRIPE_WEBHOOK_SECRET
            E2E_AGENTMAIL_API_KEY
            WEB_PROTECTION_PASSWORD=kortix-staging-euw2-web-env:WEB_PROTECTION_PASSWORD
            VERCEL_AUTOMATION_BYPASS_SECRET
            KE2E_CI_PASSTHROUGH_SECRET=kortix-ci-env:CF_WORKER_CI_PASSTHROUGH_SECRET
            KE2E_AUTH_EMAIL_HOOK_SECRET=kortix-staging-env:AUTH_EMAIL_HOOK_SECRET?
      # One SHA, two sources. A release PR carries RELEASE_SOURCE_SHA in the
      # tree; a dry run supplies the same value as `expected_sha`. The input
      # arrives through env, never interpolated into this script, so a dispatch
      # cannot inject shell — and it is accepted only after the same
      # 40-hex-character check the file gets.
      - name: Require the deployed staging source SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ -n "${EXPECTED_SHA:-}" ]; then
            source_sha="$(printf '%s' "$EXPECTED_SHA" | tr -d '[:space:]')"
            origin="workflow_dispatch input expected_sha"
          else
            test -f RELEASE_SOURCE_SHA || {
              echo "::error::No RELEASE_SOURCE_SHA in the tree and no expected_sha input."
              exit 1
            }
            source_sha="$(tr -d '[:space:]' < RELEASE_SOURCE_SHA)"
            origin="RELEASE_SOURCE_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::$origin must give one 40-character Git SHA."
            exit 1
          }
          echo "KE2E_EXPECT_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Expected deployed staging SHA: $source_sha (from $origin)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install deployed-target dependencies
        run: |
          pnpm install --frozen-lockfile --filter @kortix/tests...
          pnpm --dir tests exec playwright install --with-deps chromium
        # See the same env on the API shard install above.
        env:
          npm_config_engine_strict: "false"
      - name: Run this shard of the deployed staging browser journeys
        run: pnpm test -- --target-browser-full --browser-shard=${{ matrix.shard }}/4
      # No --run-id sweep here: the Playwright specs mint their own Supabase
      # users (@example.test / @kortix.test) with no run-scoped prefix, so there
      # is nothing to scope to. sweep-before now covers those domains, which it
      # did not before, so their debris is reclaimed on the next run.
      - name: Guard test artifacts against secrets
        id: artifact-secrets
        if: always()
        run: |
          set -euo pipefail
          # grep, never rg: GitHub's ubuntu images ship no ripgrep, and with the
          # tool missing under `2>/dev/null` this guard passed on nothing from
          # its first run until 2026-08-25, when Blacksmith images (which ship
          # rg) ran it for real. Pattern = GUARD_PATTERN_SOURCE in
          # tests/src/core/scrub.ts; the runner scrubs the same shapes before
          # writing results.json / report.html.
          pattern='kortix_(pat|sa)_[A-Za-z0-9]{12,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,}\.'
          if [ -d tests/test-results ] && grep -rEIl "$pattern" tests/test-results; then
            echo "::error::A test artifact contains a secret-shaped value."
            exit 1
          fi
          if [ -n "${KE2E_CI_PASSTHROUGH_SECRET:-}" ] && [ -d tests/test-results ] \
            && grep -rFq -- "$KE2E_CI_PASSTHROUGH_SECRET" tests/test-results; then
            echo "::error::A test artifact contains the CI diagnostic credential."
            exit 1
          fi
          echo "No secret-shaped values found."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Cancellation can leave raw Playwright traces before reporter scrubbing.
        if: ${{ always() && steps.artifact-secrets.outcome == 'success' }}
        with:
          name: tests-release-browser-shard-${{ matrix.shard }}
          path: |
            tests/test-results/**
            !tests/test-results/deployment-bypass-state.json
          if-no-files-found: warn
          retention-days: 90

  # Backstop for an API job that was killed before its own post-run sweep ran.
  # Every attempt's run id starts with `<github.run_id>-`, so this one filter
  # reclaims all of them, and it runs only after every deployed job has finished.
  sweep-after:
    name: sweep this run's test accounts
    needs: [api, browser]
    if: always()
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read staging credentials from AWS Secrets Manager
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            KE2E_OWNER_EMAIL?
            KE2E_OWNER_PASSWORD?
            KE2E_SUPABASE_URL=kortix-staging-env:SUPABASE_URL
            KE2E_SUPABASE_ANON_KEY=kortix-staging-env:SUPABASE_ANON_KEY
            KE2E_SUPABASE_SERVICE_ROLE_KEY=kortix-staging-env:SUPABASE_SERVICE_ROLE_KEY
            KE2E_DATABASE_URL=kortix-staging-env:DATABASE_URL
            KE2E_INTERNAL_SERVICE_KEY=kortix-staging-env:INTERNAL_SERVICE_KEY
            KE2E_STRIPE_SECRET_KEY=kortix-staging-env:STRIPE_SECRET_KEY
            KE2E_STRIPE_WEBHOOK_SECRET=kortix-staging-env:STRIPE_WEBHOOK_SECRET
            E2E_AGENTMAIL_API_KEY
            WEB_PROTECTION_PASSWORD=kortix-staging-euw2-web-env:WEB_PROTECTION_PASSWORD
            VERCEL_AUTOMATION_BYPASS_SECRET
            KE2E_CI_PASSTHROUGH_SECRET=kortix-ci-env:CF_WORKER_CI_PASSTHROUGH_SECRET
            KE2E_AUTH_EMAIL_HOOK_SECRET=kortix-staging-env:AUTH_EMAIL_HOOK_SECRET?
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install runner dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/tests...
        # Every other workflow that installs from this lockfile (tests.yml,
        # deploy-prod, deploy-staging) already relaxes engine-strict here. The
        # runner cache resolves `node-version: 22` to 22.22.0, and
        # write-file-atomic@8.0.0 (via apps/web, since #7121) declares
        # `^22.22.2`; with .npmrc engine-strict=true that killed every shard at
        # install (run 33995649798, release/v0.13.11).
        env:
          npm_config_engine_strict: "false"
      - name: Reclaim this run's test accounts
        run: bun tests/bin/ke2e.ts gc --run-id ${{ github.run_id }}

  # The required status check on `prod` branch protection is this job's NAME.
  # Sharding turned one job into seven, so this aggregator keeps the single
  # context that branch protection already requires. Do not rename it without
  # updating repos/kortix-ai/suna/branches/prod/protection in the same change.
  # The contract lanes (core-flows, core-db, packages-*) on the release tree:
  # the same lanes the nightly run on `dev` uses (tests.yml), run once here so
  # the release suite is the one gate. They run beside the deployed jobs, so
  # the gate's wall clock is the slowest job, not the sum.
  contract:
    name: contract
    uses: ./.github/workflows/tests.yml
    # tests.yml's trunk-report job declares these; a called workflow may not
    # ask for more than its caller grants. trunk-report runs only on schedule.
    permissions:
      contents: write
      actions: read

  release-gate:
    name: full suite + quality gates
    needs: [api, browser, contract]
    if: always()
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    # Waits for the other workflows on the release commit (CI and CodeQL are
    # the long pole, ~15 min) after the deployed jobs end.
    timeout-minutes: 45
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require every deployed job to pass
        run: |
          set -euo pipefail
          api='${{ needs.api.result }}'
          browser='${{ needs.browser.result }}'
          contract='${{ needs.contract.result }}'
          echo "api smoke: $api"
          echo "browser shards: $browser"
          echo "contract lanes: $contract"
          failed=0
          [ "$api" = "success" ] || failed=1
          [ "$browser" = "success" ] || failed=1
          [ "$contract" = "success" ] || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::A release suite job did not pass (api=$api browser=$browser contract=$contract)."
            exit 1
          fi
          echo "The contract lanes, the deployed API smoke and every browser shard passed."
      # The release suite is ONE gate: this check is the only one the `prod`
      # ruleset requires, so it also requires every other check on the release
      # commit (CI, CodeQL, DB Migrations, scanners) to finish green. A check
      # that is still running is waited for; a skipped or neutral one passes.
      - name: Require every other check on the release commit to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 40 * 60 ))
          while :; do
            # Latest attempt per check name, excluding this run's own jobs.
            latest="$(RID="$RUN_ID" gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select((.details_url // "") | contains("/runs/" + env.RID + "/") | not)' \
              | jq -s 'group_by(.name) | map(max_by(.started_at // ""))')"
            pending="$(jq -r '.[] | select(.status != "completed") | .name' <<<"$latest")"
            red="$(jq -r '.[] | select(.status == "completed") | select((.conclusion // "") | IN("success","skipped","neutral") | not) | "\(.name): \(.conclusion)"' <<<"$latest")"
            if [ -n "$red" ]; then
              echo "::error::Checks on the release commit are not green:"
              echo "$red"
              exit 1
            fi
            if [ -z "$pending" ]; then
              echo "Every check on $SHA is green ($(jq length <<<"$latest") checks)."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Checks still running after 40 min:"
              echo "$pending"
              exit 1
            fi
            echo "Waiting for: $(echo "$pending" | paste -sd, -)"
            sleep 30
          done

  # A run that github-actions[bot] started or approved (promote.yml approves the
  # release pull request's run) gets no workflow_run event, so
  # rerun-failed-once.yml never fires on its own. Ask for that one rerun
  # explicitly; the rerun job waits until this run has ended and reruns only a
  # first attempt. A run a person started or approved gets workflow_run instead.
  request-rerun:
    needs: release-gate
    if: failure() && github.run_attempt <= 2 && github.triggering_actor == 'github-actions[bot]'
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the one rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rerun-failed-once.yml --repo "$GITHUB_REPOSITORY" --ref dev -f run_id="$GITHUB_RUN_ID"
