name: Deploy Preview (PR)

on:
  pull_request_target:
    branches: [main]
    types: [labeled, unlabeled, opened, synchronize, reopened, closed]
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  build-api:
    name: Build preview API image
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["labeled","opened","synchronize","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
      - run: git submodule sync --recursive && git submodule update --init --recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SERVICE=apps/api
            KORTIX_VERSION=pr-${{ github.event.pull_request.number }}
            KORTIX_COMMIT=${{ github.event.pull_request.head.sha }}
          tags: kortix/kortix-api:pr-${{ github.event.pull_request.head.sha }}

  build-gateway:
    name: Build preview gateway image
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["labeled","opened","synchronize","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/llm-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            KORTIX_VERSION=pr-${{ github.event.pull_request.number }}
            KORTIX_COMMIT=${{ github.event.pull_request.head.sha }}
          tags: kortix/kortix-gateway:pr-${{ github.event.pull_request.head.sha }}

  deploy:
    name: Deploy preview backend
    needs: [build-api, build-gateway]
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["labeled","opened","synchronize","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_REGION: us-west-2
      PREVIEW_ROLE: arn:aws:iam::935064898258:role/kortix-gha-preview-deploy
      NUM: ${{ github.event.pull_request.number }}
      COMMIT: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.PREVIEW_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy isolated Fargate service
        run: |
          bash infra/scripts/ecs-preview.sh deploy "$NUM" \
            "kortix/kortix-api:pr-${COMMIT}" \
            "kortix/kortix-gateway:pr-${COMMIT}" \
            "$COMMIT"
      - name: Require preview health
        run: |
          set -euo pipefail
          host="pr-${NUM}.preview-api.kortix.com"
          for _ in $(seq 1 30); do
            health="$(curl -fsS --max-time 8 "https://${host}/v1/health" 2>/dev/null || true)"
            environment="$(printf '%s' "$health" | jq -r '.environment // empty' 2>/dev/null || true)"
            commit="$(printf '%s' "$health" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$environment" = "preview" ] && [ "$commit" = "$COMMIT" ]; then
              printf '%s\n' "$health" > /tmp/preview-health.json
              exit 0
            fi
            sleep 10
          done
          echo "::error::${host} did not report environment=preview for commit ${COMMIT}."
          exit 1
      - name: Update sticky status comment
        run: |
          set -euo pipefail
          marker='<!-- preview-status -->'
          host="pr-${NUM}.preview-api.kortix.com"
          body="$(printf '%s\n' "$marker" '## Preview environment - live' '' \
            "- **Backend:** https://${host}" \
            "- **Health:** https://${host}/v1/health" \
            '- **Frontend:** see the Vercel preview deployment for this branch' '' \
            '_One isolated Fargate service; automatic close/unlabel teardown._')"
          id="$(gh api "repos/${REPO}/issues/${NUM}/comments" --paginate \
            --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${NUM}/comments" -f body="$body" >/dev/null
          fi

  wire:
    name: Wire preview frontend to preview backend
    needs: deploy
    runs-on: ubuntu-latest
    env:
      NUM: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      ENV_KEYS: NEXT_PUBLIC_BACKEND_URL KORTIX_PUBLIC_BACKEND_URL
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Require Vercel credentials
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN PROJECT_ID TEAM_ID; do
            [ -n "${!name:-}" ] || { echo "::error::$name is required for preview wiring."; exit 1; }
          done
      - name: Upsert branch-scoped backend URLs and redeploy
        env:
          NUM: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}")
          api="https://api.vercel.com"
          backend="https://pr-${NUM}.preview-api.kortix.com/v1"
          for key in $ENV_KEYS; do
            code="$(curl -sS -o "/tmp/env-${key}.json" -w '%{http_code}' -X POST \
              "${api}/v10/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}&upsert=true" \
              "${auth[@]}" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg v "$backend" --arg b "$BRANCH" --arg k "$key" \
                '{key:$k,value:$v,type:"plain",target:["preview"],gitBranch:$b}')")"
            [ "$code" = 200 ] || [ "$code" = 201 ] || { jq . "/tmp/env-${key}.json"; exit 1; }
          done
          project="$(curl -fsS "${api}/v9/projects/${PROJECT_ID}?teamId=${TEAM_ID}" "${auth[@]}")"
          name="$(printf '%s' "$project" | jq -r .name)"
          repo_id="$(printf '%s' "$project" | jq -r '.link.repoId')"
          deployment="$(curl -fsS -X POST "${api}/v13/deployments?teamId=${TEAM_ID}&forceNew=1&skipAutoDetectionConfirmation=1" \
            "${auth[@]}" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg n "$name" --argjson r "$repo_id" --arg b "$BRANCH" \
              '{name:$n,target:"preview",gitSource:{type:"github",repoId:$r,ref:$b}}')")"
          deployment_id="$(printf '%s' "$deployment" | jq -r '.id // error("Vercel deployment response has no id")')"
          frontend="https://$(printf '%s' "$deployment" | jq -r '.url // error("Vercel deployment response has no URL")')"
          ready=false
          for _ in $(seq 1 60); do
            current="$(curl -fsS "${api}/v13/deployments/${deployment_id}?teamId=${TEAM_ID}" "${auth[@]}")"
            state="$(printf '%s' "$current" | jq -r '.readyState // .state // empty')"
            deployed_sha="$(printf '%s' "$current" | jq -r '.meta.githubCommitSha // empty')"
            deployed_branch="$(printf '%s' "$current" | jq -r '.meta.githubCommitRef // empty')"
            if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
              echo "::error::Vercel deployment ${deployment_id} entered ${state}."
              exit 1
            fi
            if [ "$state" = "READY" ] && [ "$deployed_sha" = "$COMMIT" ] && [ "$deployed_branch" = "$BRANCH" ]; then
              ready=true
              break
            fi
            sleep 10
          done
          [ "$ready" = true ] || { echo "::error::Vercel deployment was not READY for exact SHA ${COMMIT}."; exit 1; }
          deployed_envs="$(curl -fsS "${api}/v9/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}" "${auth[@]}")"
          for key in $ENV_KEYS; do
            count="$(printf '%s' "$deployed_envs" | jq --arg k "$key" --arg b "$BRANCH" --arg v "$backend" \
              '[.envs[] | select(.key==$k and .gitBranch==$b and .value==$v)] | length')"
            [ "$count" = 1 ] || {
              echo "::error::${key} does not uniquely target ${backend} for branch ${BRANCH}."
              exit 1
            }
          done
          curl -fsS --max-time 20 "$frontend" >/dev/null
          marker='<!-- preview-status -->'
          body="$(printf '%s\n' "$marker" '## Preview environment - live' '' \
            "- **Backend:** https://pr-${NUM}.preview-api.kortix.com" \
            "- **Health:** https://pr-${NUM}.preview-api.kortix.com/v1/health" \
            "- **Frontend:** ${frontend}" '' \
            '_One isolated Fargate service; automatic close/unlabel teardown._')"
          id="$(gh api "repos/${REPO}/issues/${NUM}/comments" --paginate \
            --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
          [ -z "$id" ] || gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null

  teardown:
    name: Tear down preview backend and frontend wiring
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      AWS_REGION: us-west-2
      PREVIEW_ROLE: arn:aws:iam::935064898258:role/kortix-gha-preview-deploy
      NUM: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      ENV_KEYS: NEXT_PUBLIC_BACKEND_URL KORTIX_PUBLIC_BACKEND_URL
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.PREVIEW_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Delete isolated Fargate resources
        run: bash infra/scripts/ecs-preview.sh teardown "$NUM"
      - name: Delete branch-scoped Vercel environment
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN PROJECT_ID TEAM_ID; do
            [ -n "${!name:-}" ] || { echo "::error::$name is required for deterministic teardown."; exit 1; }
          done
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}")
          api="https://api.vercel.com"
          envs="$(curl -fsS "${api}/v9/projects/${PROJECT_ID}/env?teamId=${TEAM_ID}" "${auth[@]}")"
          expected="https://pr-${NUM}.preview-api.kortix.com/v1"
          deleted=0
          conflicts=0
          for key in $ENV_KEYS; do
            ids="$(printf '%s' "$envs" | jq -r --arg k "$key" --arg b "$BRANCH" \
              --arg v "$expected" '.envs[] | select(.key==$k and .gitBranch==$b and .value==$v) | .id')"
            conflicts="$((conflicts + $(printf '%s' "$envs" | jq --arg k "$key" --arg b "$BRANCH" --arg v "$expected" \
              '[.envs[] | select(.key==$k and .gitBranch==$b and .value!=$v)] | length')))"
            for id in $ids; do
              curl -fsS -X DELETE "${api}/v9/projects/${PROJECT_ID}/env/${id}?teamId=${TEAM_ID}" "${auth[@]}" >/dev/null
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted ${deleted} Vercel variables owned by PR ${NUM}; preserved ${conflicts} variables with a different backend value."
      - name: Mark sticky status comment torn down
        run: |
          set -euo pipefail
          marker='<!-- preview-status -->'
          id="$(gh api "repos/${REPO}/issues/${NUM}/comments" --paginate \
            --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
          body="$(printf '%s\n' "$marker" '## Preview environment - torn down' '' \
            'The ECS service, listener rule, target group, and task definitions were deleted.' \
            'Vercel cleanup deleted only branch variables whose value still targeted this PR backend.')"
          [ -z "$id" ] || gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null

  reconcile:
    name: Reconcile stale preview backends
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    env:
      AWS_REGION: us-west-2
      PREVIEW_ROLE: arn:aws:iam::935064898258:role/kortix-gha-preview-deploy
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PREVIEW_MAX_AGE_HOURS: "72"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.PREVIEW_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: bash infra/scripts/ecs-preview.sh reconcile 0
