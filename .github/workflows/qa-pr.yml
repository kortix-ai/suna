name: QA - PR

on:
  pull_request:
    branches: [main, staging, prod]
  workflow_dispatch:

concurrency:
  group: qa-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: full local suite
    uses: ./.github/workflows/test.yml
    with:
      mode: full
      artifact-name: qa-pr-results
      retention-days: 14
    secrets: inherit
