name: QA - PR

on:
  pull_request:
    branches: [main, staging, prod]
  workflow_dispatch:
    inputs:
      provider:
        description: Sandbox provider for this run.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - platinum
          - daytona

concurrency:
  group: qa-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: full local suite
    uses: ./.github/workflows/test.yml
    with:
      mode: full
      provider: ${{ inputs.provider || 'auto' }}
      artifact-name: qa-pr-results
      retention-days: 14
    secrets: inherit
