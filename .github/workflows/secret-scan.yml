name: secret-scan

# Scans pull-request commits for committed secrets with gitleaks.
# Supports SOC 2 CC6.1 (protect credentials). Complements GitHub's native
# secret scanning + push protection (which cover known provider patterns).
# We run the gitleaks binary directly: the gitleaks GitHub Action requires a
# paid license for organizations, but the binary itself is free (MIT).

on:
  # A pull request into `dev` runs no CI: the developer runs `pnpm test` in
  # their box. The push to `dev` is the non-blocking post-merge check; release
  # pull requests (`staging`, `prod`) are the gate.
  push:
    branches: [dev]
  pull_request:
    branches: [staging, prod]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ vars.CI_RUNNER_S || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the pushed or pull request commits for secrets
        run: |
          ./gitleaks git \
            --log-opts="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}" \
            --redact --verbose --exit-code 1
