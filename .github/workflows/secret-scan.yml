name: secret-scan

# Scans pull-request commits for committed secrets with gitleaks.
# Supports SOC 2 CC6.1 (protect credentials). Complements GitHub's native
# secret scanning + push protection (which cover known provider patterns).
# We run the gitleaks binary directly: the gitleaks GitHub Action requires a
# paid license for organizations, but the binary itself is free (MIT).

on:
  # A pull request into `dev` runs no CI: the developer runs `pnpm test` in
  # their box. The push to `dev` is the non-blocking post-merge check; release
  # pull request (`prod`) is the gate.
  push:
    branches: [dev]
  # Only into `prod`: the release pull request is the one gate. The pull
  # request into `staging` runs nothing; Promote merges it (2026-10-16).
  pull_request:
    branches: [prod]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # CWE-494: verify the release archive against the published
          # checksums.txt before the binary runs (same as security-scan.yml).
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep -q " ${archive}$" checksums.txt
          curl -sSfL "${base}/${archive}" -o "${archive}"
          sha256sum -c --ignore-missing checksums.txt
          tar -xzf "${archive}" gitleaks
          ./gitleaks version

      - name: Scan the pushed or pull request commits for secrets
        run: |
          ./gitleaks git \
            --log-opts="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}" \
            --redact --verbose --exit-code 1
