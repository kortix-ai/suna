name: QA - release gate

on:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: qa-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: full suite + quality gates
    uses: ./.github/workflows/test.yml
    with:
      mode: full
      artifact-name: release-qa-results
      retention-days: 90
    secrets: inherit
