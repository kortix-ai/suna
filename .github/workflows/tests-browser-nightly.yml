name: Tests - browser quarantine (nightly)

# The non-blocking home for browser journeys that cannot be made deterministic
# against a deployed target.
#
# `tests-release.yml` excludes the `@quarantine` tag so a third-party outage
# cannot hold a production release. This workflow runs EXACTLY that tag, on a
# schedule, against the same staging origin and with the same secrets — so a
# quarantined journey keeps being exercised and keeps an owner, instead of
# rotting into a spec nobody runs.
#
# It is required by no branch and gates nothing, but it is the WATCHER of every
# quarantined test (policy: .agents/skills/testing/SKILL.md, "Quarantine").
# A red run fails this workflow, and the `Quarantine verdict` step comments on
# the commit the same way the daily `tests.yml` run does. A run that executes no
# quarantined test also fails: before 2026-10-12 this lane ran zero tests on 30
# of 34 nights and nobody noticed. The verdict step also names each test that
# has passed `GREEN_NIGHTS` nights in a row: remove its `@quarantine` tag and it
# returns to the blocking gate.

on:
  schedule:
    # 04:20 UTC daily — after the nightly deploys have settled and well clear of
    # the release-gate window, so the two lanes never contend for staging.
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tag filter to run (default @quarantine)'
        required: false
        default: '@quarantine'

concurrency:
  group: tests-browser-nightly
  cancel-in-progress: false

# Mirrors the top-level env of tests-release.yml. Both target the same deployed
# staging origin with the same credentials; keep them in step when either
# changes.
env:
  KE2E_API_URL: ${{ vars.QA_API_BASE_URL || 'https://staging-api.kortix.com/v1' }}
  E2E_BASE_URL: ${{ vars.QA_WEB_BASE_URL || 'https://staging.kortix.com' }}
  KE2E_GATEWAY_URL: ${{ vars.QA_GATEWAY_URL || 'https://gateway-staging.kortix.com' }}
  KE2E_TARGET: staging
  KE2E_LIVE_CONFIRM: ci
  KE2E_CAP_MANAGED_GIT_PUSH: ${{ vars.KE2E_CAP_MANAGED_GIT_PUSH || '0' }}
  # Credentials come from the "Read staging credentials" step (the same key
  # list as tests-release.yml, through .github/actions/aws-env).

jobs:
  quarantine:
    name: quarantined browser journeys
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    permissions:
      contents: write # commit comment (the verdict step)
      actions: read # earlier nights' verdict artifacts
      id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)
    timeout-minutes: 45
    env:
      # `playwright.config.ts` turns this into `grep`, so the run loads ONLY the
      # tagged journeys. Everything else is never collected.
      E2E_INCLUDE_TAGS: ${{ github.event.inputs.tags || '@quarantine' }}
      GREEN_NIGHTS: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read staging credentials from AWS Secrets Manager
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            KE2E_OWNER_EMAIL?
            KE2E_OWNER_PASSWORD?
            KE2E_SUPABASE_URL=kortix-staging-env:SUPABASE_URL
            KE2E_SUPABASE_ANON_KEY=kortix-staging-env:SUPABASE_ANON_KEY
            KE2E_SUPABASE_SERVICE_ROLE_KEY=kortix-staging-env:SUPABASE_SERVICE_ROLE_KEY
            KE2E_DATABASE_URL=kortix-staging-env:DATABASE_URL
            KE2E_INTERNAL_SERVICE_KEY=kortix-staging-env:INTERNAL_SERVICE_KEY
            KE2E_STRIPE_SECRET_KEY=kortix-staging-env:STRIPE_SECRET_KEY
            KE2E_STRIPE_WEBHOOK_SECRET=kortix-staging-env:STRIPE_WEBHOOK_SECRET
            E2E_AGENTMAIL_API_KEY
            WEB_PROTECTION_PASSWORD=kortix-staging-euw2-web-env:WEB_PROTECTION_PASSWORD
            VERCEL_AUTOMATION_BYPASS_SECRET
            KE2E_CI_PASSTHROUGH_SECRET=kortix-ci-env:CF_WORKER_CI_PASSTHROUGH_SECRET
      # The release gate pins the SHA a release PR promises (RELEASE_SOURCE_SHA).
      # A nightly run promises nothing: it exercises whatever staging serves. The
      # deployed-target preflight still needs one SHA to compare the API, gateway
      # and frontend against, so read it from the staging API's own /health. The
      # preflight then fails if the gateway or frontend serve a different commit,
      # i.e. a half-rolled staging.
      - name: Read the deployed staging source SHA
        run: |
          set -euo pipefail
          source_sha="$(curl -fsS --max-time 20 "${KE2E_API_URL}/health" | jq -r '.commit // empty')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::${KE2E_API_URL}/health did not report a 40-character commit."
            exit 1
          }
          echo "KE2E_EXPECT_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Deployed staging SHA: $source_sha"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install deployed-target dependencies
        run: |
          pnpm install --frozen-lockfile --filter @kortix/tests...
          pnpm --dir tests exec playwright install --with-deps chromium
      - name: Run the quarantined browser journeys against staging
        run: |
          set -o pipefail
          pnpm test -- --target-browser-full 2>&1 | tee "$RUNNER_TEMP/browser-list.log"
      - name: Quarantine verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/verdict"; mkdir -p "$out"

          # Final status of every test, from the Playwright `list` lines. A
          # retry line comes after the failed first attempt, so the last line
          # per test is its final status.
          sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/browser-list.log" 2>/dev/null \
            | grep -E '^[[:space:]]+(✓|✘|-)[[:space:]]+[0-9]+ \[' \
            | sed -E 's/^[[:space:]]*(✓|✘|-)[[:space:]]+[0-9]+ \[[a-z]+\] › (.*)$/\1\t\2/; s/ \([0-9.]+(ms|s|m)\)$//; s/ \(retry #[0-9]+\)$//' \
            | awk -F'\t' '{s[$2]=$1} END {for (k in s) print s[k] "\t" k}' \
            | jq -Rn '[inputs | split("\t") | {key: .[1], value: ({"✓":"pass","✘":"fail","-":"skip"}[.[0]])}] | from_entries' \
            > "$out/quarantine-verdict.json"
          executed="$(jq '[.[] | select(. != "skip")] | length' "$out/quarantine-verdict.json")"
          failing="$(jq -r 'to_entries[] | select(.value == "fail") | "- `\(.key)`"' "$out/quarantine-verdict.json")"

          # Streak: consecutive nights (this run, then earlier scheduled runs
          # newest first) in which the test passed. A night with no verdict
          # artifact (setup failure) ends the streak.
          mkdir -p "$RUNNER_TEMP/hist"; n=0
          for id in $(gh run list --repo "$REPO" --workflow tests-browser-nightly.yml --event schedule \
              --status completed --limit "$((GREEN_NIGHTS+1))" --json databaseId -q '.[].databaseId'); do
            [ "$id" = "$RUN_ID" ] && continue
            n=$((n+1)); [ "$n" -ge "$GREEN_NIGHTS" ] && break
            gh run download "$id" --repo "$REPO" -n quarantine-verdict -D "$RUNNER_TEMP/hist/$n" >/dev/null 2>&1 || break
          done
          streaks="$(jq -rn --slurpfile cur "$out/quarantine-verdict.json" \
            '[$cur[0] | to_entries[] | select(.value == "pass") | .key] | .[]' | while IFS= read -r t; do
              c=1
              for i in $(seq 1 $((GREEN_NIGHTS-1))); do
                f="$RUNNER_TEMP/hist/$i/quarantine-verdict.json"
                [ -f "$f" ] && [ "$(jq -r --arg t "$t" '.[$t] // ""' "$f")" = "pass" ] || break
                c=$((c+1))
              done
              printf '%s\t%s\n' "$c" "$t"
            done)"
          candidates="$(printf '%s\n' "$streaks" | awk -F'\t' -v n="$GREEN_NIGHTS" 'NF && $1 >= n {print "- `" $2 "`"}')"

          {
            echo "## Quarantined browser journeys: ${executed} executed"
            [ -n "$failing" ] && { echo; echo "Red:"; echo "$failing"; }
            echo; echo "Green nights in a row (a test needs ${GREEN_NIGHTS} to leave quarantine):"; echo
            printf '%s\n' "$streaks" | awk -F'\t' 'NF {print "- " $1 " / '"$GREEN_NIGHTS"': `" $2 "`"}'
          } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/verdict.md"

          if [ "$executed" -eq 0 ]; then
            echo "::error::No quarantined test executed. The lane is broken, not green."
            body="The nightly quarantine lane executed no test. Run: $RUN_URL"
          elif [ -n "$failing" ]; then
            body="$(printf 'Quarantined browser journeys are red on staging. Owner of each test: the author of its quarantine reason (see the test header).\n\n%s\n\nRun: %s' "$failing" "$RUN_URL")"
          elif [ -n "$candidates" ]; then
            body="$(printf 'Quarantined journeys green for %s nights; remove the @quarantine tag so the blocking gate runs them:\n\n%s\n\nRun: %s' "$GREEN_NIGHTS" "$candidates" "$RUN_URL")"
          else
            body=""
          fi
          [ -n "$body" ] && printf '%s\n' "$body" > "$RUNNER_TEMP/comment.md" \
            && gh api "repos/$REPO/commits/$SHA/comments" -F body=@"$RUNNER_TEMP/comment.md" --jq '.html_url'
          [ "$executed" -gt 0 ] || exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quarantine-verdict
          path: ${{ runner.temp }}/verdict/quarantine-verdict.json
          if-no-files-found: warn
          retention-days: 30
      - name: Guard test artifacts against secrets
        if: always()
        run: |
          set -euo pipefail
          # grep, never rg: GitHub's ubuntu images ship no ripgrep, and with the
          # tool missing under `2>/dev/null` this guard passed on nothing from
          # its first run until 2026-08-25, when Blacksmith images (which ship
          # rg) ran it for real. Pattern = GUARD_PATTERN_SOURCE in
          # tests/src/core/scrub.ts; the runner scrubs the same shapes before
          # writing results.json / report.html.
          pattern='kortix_(pat|sa)_[A-Za-z0-9]{12,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,}\.'
          if [ -d tests/test-results ] && grep -rEIl "$pattern" tests/test-results; then
            echo "::error::A test artifact contains a secret-shaped value."
            exit 1
          fi
          echo "No secret-shaped values found."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tests-browser-nightly-quarantine
          path: |
            tests/test-results/**
            !tests/test-results/deployment-bypass-state.json
          if-no-files-found: warn
          retention-days: 30
