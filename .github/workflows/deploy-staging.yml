name: Deploy Staging

# Staging is the release-candidate lane. It tracks the `staging` branch and is
# the only normal source for Promote to Production. Dev can be messy; staging
# should contain only code that is ready to ship after e2e validation.

on:
  workflow_run:
    workflows: ["Build Staging Artifacts"]
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Staging commit SHA to deploy; defaults to current staging HEAD"
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-west-2
  NAMESPACE: kortix-staging
  STAGING_SUPABASE_REF: ujzsbwvurfyeuerxxeaz
  API_APP: kortix-api
  GATEWAY_APP: kortix-gateway
  API_HOST: staging-api-ecs-fargate.kortix.com
  GATEWAY_HOST: gateway-staging.kortix.com
  PUBLIC_API_HOST: staging-api.kortix.com
  WEB_HOST: staging.kortix.com
  ECS_WEB_HOST: staging-fe-ecs.kortix.com

jobs:
  preflight:
    name: Resolve staging ref
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      sha8: ${{ steps.ref.outputs.sha8 }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 0
      - name: Resolve deploy commit
        id: ref
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin staging:refs/remotes/origin/staging --quiet
          sha="${INPUT_SHA:-${WORKFLOW_SHA:-}}"
          [ -n "$sha" ] || sha="$(git rev-parse origin/staging)"
          sha="$(git rev-parse "$sha")"
          git merge-base --is-ancestor "$sha" origin/staging || {
            echo "::error::$sha is not reachable from origin/staging"; exit 1;
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "sha8=${sha::8}" >> "$GITHUB_OUTPUT"
      - name: Compute staging version
        id: version
        env:
          SOURCE_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin >/dev/null 2>&1 || true
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          [ -n "$latest" ] || latest="$(tr -d '[:space:]' < VERSION)"
          IFS='.' read -r ma mi pa <<< "$latest"
          : "${ma:=0}"; : "${mi:=0}"; : "${pa:=0}"
          next="${ma}.${mi}.$((pa + 1))"
          echo "version=${next}-staging.${SOURCE_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Assert staging images exist
        env:
          SHA8: ${{ steps.ref.outputs.sha8 }}
        run: |
          set -euo pipefail
          for image in kortix/kortix-api kortix/kortix-gateway kortix/kortix-frontend; do
            docker buildx imagetools inspect "${image}:staging-${SHA8}" >/dev/null
            echo "found ${image}:staging-${SHA8}"
          done

  # ── Apply staging Terraform before any image rolls ──────────────────────────
  # Both staging roots are safe to apply unattended: every variable has a
  # default and the committed terraform.tfvars.example is identical to those
  # defaults (api_environment = {}, manage_dns = false), so CI plans exactly
  # what an operator plans. Skipped while TF_APPLY_ROLE_ARN_STAGING is unset.
  terraform-staging:
    name: Apply staging Terraform
    needs: preflight
    if: vars.TF_APPLY_ROLE_ARN_STAGING != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    with:
      tf_root: infra/terraform/environments/staging
      aws_region: us-west-2
      role_arn: ${{ vars.TF_APPLY_ROLE_ARN_STAGING }}
      github_environment: staging
      trusted_branch: staging
      cloudflare: true
      ref: ${{ needs.preflight.outputs.sha }}
    secrets: inherit

  # staging-web shares modules/ecs-api with staging; apply it after so a shared
  # module change lands in one order, not two racing ones.
  terraform-staging-web:
    name: Apply staging web Terraform
    needs: [preflight, terraform-staging]
    if: vars.TF_APPLY_ROLE_ARN_STAGING != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    with:
      tf_root: infra/terraform/environments/staging-web
      aws_region: us-west-2
      role_arn: ${{ vars.TF_APPLY_ROLE_ARN_STAGING }}
      github_environment: staging
      trusted_branch: staging
      cloudflare: true
      ref: ${{ needs.preflight.outputs.sha }}
    secrets: inherit

  sync-secret:
    name: Sync staging secret bundle
    needs: preflight
    runs-on: ubuntu-latest
    env:
      ROLE: arn:aws:iam::935064898258:role/kortix-gha-ecs-deploy
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Create or update kortix-staging-env
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_JWT_SECRET: ${{ secrets.STAGING_SUPABASE_JWT_SECRET }}
          STAGING_KORTIX_ADMIN_API_KEY: ${{ secrets.STAGING_KORTIX_ADMIN_API_KEY }}
        run: |
          set -euo pipefail

          missing() {
            [ -z "${1:-}" ] || [ "$1" = "-" ]
          }

          database="$STAGING_DATABASE_URL"
          supabase="$STAGING_SUPABASE_URL"
          anon="$STAGING_SUPABASE_ANON_KEY"
          service="$STAGING_SUPABASE_SERVICE_ROLE_KEY"
          jwt="$STAGING_SUPABASE_JWT_SECRET"

          for required in database supabase anon service jwt; do
            if missing "${!required:-}"; then
              echo "::error::$required is required for the real staging data plane; staging must never fall back to dev, KE2E, or prod."
              exit 1
            fi
          done
          if [[ "$database" != *"$STAGING_SUPABASE_REF"* ]]; then
            echo "::error::STAGING_DATABASE_URL must target the staging Supabase project ref ${STAGING_SUPABASE_REF}; refusing to sync a dev/prod DB into staging."
            exit 1
          fi
          if [ "$supabase" != "https://${STAGING_SUPABASE_REF}.supabase.co" ]; then
            echo "::error::STAGING_SUPABASE_URL must be https://${STAGING_SUPABASE_REF}.supabase.co."
            exit 1
          fi

          # Preserve staging-only integrations (Stripe, managed Git, alerting,
          # and any future operator-managed keys) across rollouts. Rebuilding
          # this payload from kortix-dev-env silently replaces those values
          # with dev credentials on every deploy. The dev bundle is only a
          # first-creation bootstrap; an existing staging bundle is canonical.
          if aws secretsmanager describe-secret --secret-id kortix-staging-env --region "$AWS_REGION" >/dev/null 2>&1; then
            staging_secret_exists=true
            base="$(aws secretsmanager get-secret-value \
              --secret-id kortix-staging-env \
              --region "$AWS_REGION" \
              --query SecretString \
              --output text)"
          else
            staging_secret_exists=false
            base="$(aws secretsmanager get-secret-value \
              --secret-id kortix-dev-env \
              --region "$AWS_REGION" \
              --query SecretString \
              --output text)"
          fi

          payload="$(jq -cn \
            --argjson base "$base" \
            --arg database "$database" \
            --arg supabase "$supabase" \
            --arg anon "$anon" \
            --arg service "$service" \
            --arg jwt "$jwt" \
            --arg admin "$STAGING_KORTIX_ADMIN_API_KEY" \
            --arg frontend "https://${WEB_HOST}" \
            --arg api "https://${PUBLIC_API_HOST}" \
            --arg gateway "https://${GATEWAY_HOST}/v1/llm" \
            '$base + {
              INTERNAL_KORTIX_ENV: "staging",
              DATABASE_URL: $database,
              SUPABASE_URL: $supabase,
              SUPABASE_ANON_KEY: $anon,
              SUPABASE_SERVICE_ROLE_KEY: $service,
              SUPABASE_JWT_SECRET: $jwt,
              KORTIX_ADMIN_API_KEY: $admin,
              FRONTEND_URL: $frontend,
              KORTIX_URL: $api,
              CORS_ALLOWED_ORIGINS: $frontend,
              LLM_GATEWAY_BASE_URL: $gateway,
              ALLOWED_SANDBOX_PROVIDERS: "daytona,platinum",
              KORTIX_WARM_SNAPSHOT_ENABLED: "false",
              # Pinned, not inherited: the base above can be kortix-dev-env,
              # which still carries the RETIRED `code-storage` value. The API
              # refuses that value for new repos anyway
              # (`defaultManagedProviderId`), but a stale key propagating from
              # dev into staging is how it survives — state it here so the
              # bundle says what is actually true.
              MANAGED_GIT_PROVIDER: "github",
              # The staging Supabase database permits 60 connections. ECS can
              # run 3 API tasks. Four app connections plus one leader connection
              # per process
              # leaves 12 slots for Supabase services, migrations, and QA.
              DB_POOL_MAX: "4",
              # Staging-only: the staging DB is in eu-west-2 while ECS is in
              # us-west-2 (~140ms per round trip), so heavy IAM/team writes
              # legitimately exceed the 25s default under gate load — with the
              # edge CI passthrough live, dry-run 32335937697 surfaced the
              # true origin failure: "Request exceeded the 25s server
              # processing deadline". 55s stays under the 60s ALB idle
              # timeout; browsers still abort at 30s so UX is unchanged; the
              # release-gate API client budgets are far larger. Prod keeps
              # the 25s default (co-regional DB).
              REQUEST_DEADLINE_MS: "55000"
            }')"

          if [ "$staging_secret_exists" = true ]; then
            aws secretsmanager put-secret-value \
              --secret-id kortix-staging-env \
              --region "$AWS_REGION" \
              --secret-string "$payload" >/dev/null
          else
            aws secretsmanager create-secret \
              --name kortix-staging-env \
              --region "$AWS_REGION" \
              --secret-string "$payload" >/dev/null
          fi
          echo "kortix-staging-env synced with $(printf '%s' "$payload" | jq 'keys | length') keys."

  migrate-db:
    name: Apply DB migrations to staging
    needs: [preflight, sync-secret]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --filter "@kortix/db..." --filter "kortix"
        env:
          npm_config_engine_strict: "false"
      - name: Apply pending migrations (node-pg-migrate; halts on failure)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ "$DATABASE_URL" = "-" ]; then
            echo "::error::STAGING_DATABASE_URL secret is not set — refusing to deploy staging without a migration check."
            exit 1
          fi
          if [[ "$DATABASE_URL" != *"$STAGING_SUPABASE_REF"* ]]; then
            echo "::error::STAGING_DATABASE_URL must target the staging Supabase project ref ${STAGING_SUPABASE_REF}; refusing to migrate dev/prod from staging."
            exit 1
          fi
          pnpm --filter @kortix/db migrate

  # Roll staging ECS Fargate (api + gateway). deploy-web `needs:` this job,
  # so a broken ECS staging deploy fails the staging rollout loudly.
  deploy-ecs:
    name: Deploy API + gateway to staging (ECS Fargate)
    needs: [preflight, sync-secret, migrate-db, terraform-staging]
    # `always()` is required because terraform-staging is SKIPPED while
    # TF_APPLY_ROLE_ARN_STAGING is unset. Every other upstream stays required.
    if: >-
      ${{ always()
        && needs.preflight.result == 'success'
        && needs.sync-secret.result == 'success'
        && needs.migrate-db.result == 'success'
        && (needs.terraform-staging.result == 'success' || needs.terraform-staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC → ECS deploy role
      contents: read
    env:
      AWS_REGION: us-west-2
      ROLE: arn:aws:iam::935064898258:role/kortix-gha-ecs-deploy
      SHA8: ${{ needs.preflight.outputs.sha8 }}
      VERSION: ${{ needs.preflight.outputs.version }}
      # Non-secret task environment. KORTIX_PREVIEW_BASE_DOMAIN is the wildcard
      # every sandbox preview origin sits under; it is declared, never derived
      # (see apps/api/src/sandbox-proxy/preview-hosts.ts). Setting it is what
      # makes clients stop using the path proxy, so it goes in only once the
      # certificate pack for that wildcard is active. Unset = path proxy, which
      # is also the complete rollback.
      KORTIX_ECS_ENV_OVERRIDES: '{"KORTIX_PREVIEW_BASE_DOMAIN":"p.kortix.com"}'
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll staging ECS (api + gateway) from the staging-env blob
        run: |
          bash infra/scripts/ecs-deploy.sh staging "kortix/kortix-api:staging-${SHA8}" --version "${VERSION}"
          bash infra/scripts/ecs-deploy.sh staging "kortix/kortix-gateway:staging-${SHA8}" --service gateway --version "${VERSION}"

  wire-cloudflare:
    name: Wire Cloudflare staging DNS and Worker
    runs-on: ubuntu-latest
    # Non-blocking: deploy-web-vercel, verify, and promote-staging-channel
    # `needs:` this job, and a Cloudflare auth failure (403 since 2026-08-18)
    # silently skipped every staging web deploy for a week — the suite then
    # drove a frozen Aug-12 frontend against the current API. The Worker/DNS
    # config this job manages already exists and rarely changes; when it
    # fails, the failed step stays visible here but must not freeze the
    # frontend. verify still curls the live staging hosts independently.
    continue-on-error: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_APPS_EDGE_API_TOKEN: ${{ secrets.CLOUDFLARE_APPS_EDGE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || 'af378d3df4e4dd5052a1fcbf263b685d' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '9785405a992435bb0c7bd19f9b6d26d5' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
      - name: Deploy staging API router Worker
        working-directory: infra/cloudflare/workers/api-router
        env:
          WORKER_NAME: staging-api-kortix-router
          WORKER_ROUTE: staging-api.kortix.com/*
          CF_WORKER_CI_PASSTHROUGH_SECRET: ${{ secrets.CF_WORKER_CI_PASSTHROUGH_SECRET }}
        run: |
          set -euo pipefail
          # Pick the first credential that actually AUTHENTICATES, probed with a
          # cheap zone read — since 2026-08-18 the global key 403s and, because
          # it was tried first and trusted blindly, every Worker deploy failed.
          # CLOUDFLARE_APPS_EDGE_API_TOKEN is a legitimate same-account token
          # (Apps edge) and serves as a fallback when it carries Workers scope.
          zone_probe() {
            curl -fsS -o /dev/null --max-time 15 \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}" "$@"
          }
          auth_headers=()
          if [ -n "${CLOUDFLARE_GLOBAL_API_KEY:-}" ] && [ -n "${CLOUDFLARE_EMAIL:-}" ] \
            && zone_probe -H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" -H "X-Auth-Key: ${CLOUDFLARE_GLOBAL_API_KEY}"; then
            auth_headers=(-H "X-Auth-Email: ${CLOUDFLARE_EMAIL}" -H "X-Auth-Key: ${CLOUDFLARE_GLOBAL_API_KEY}")
            echo "Cloudflare auth: global API key"
          elif [ -n "${CLOUDFLARE_API_TOKEN:-}" ] \
            && zone_probe -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"; then
            auth_headers=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            echo "Cloudflare auth: scoped API token"
          elif [ -n "${CLOUDFLARE_APPS_EDGE_API_TOKEN:-}" ] \
            && zone_probe -H "Authorization: Bearer ${CLOUDFLARE_APPS_EDGE_API_TOKEN}"; then
            auth_headers=(-H "Authorization: Bearer ${CLOUDFLARE_APPS_EDGE_API_TOKEN}")
            echo "Cloudflare auth: apps-edge API token (fallback)"
          else
            echo "::error::No Cloudflare credential authenticates (global key, scoped token, apps-edge token all absent or refused). Rotate CLOUDFLARE_GLOBAL_API_KEY or provide a CLOUDFLARE_API_TOKEN with Workers + zone permissions."
            exit 1
          fi

          # This REST deploy replaces all staging Worker bindings. The API
          # and gateway both use ECS Fargate. EKS was decommissioned 2026-08-02.
          #
          # CI_PASSTHROUGH_SECRET lets a trusted release-gate run see the TRUE
          # origin status instead of the synthetic MAINTENANCE_MODE 503 (see
          # worker.mjs isTrustedCiPassthrough). It is bound only when the
          # repository secret exists; without it the Worker's passthrough branch
          # is unreachable and staging behaves exactly as before.
          ci_binding='[]'
          if [ -n "${CF_WORKER_CI_PASSTHROUGH_SECRET:-}" ]; then
            ci_binding="$(jq -cn --arg secret "${CF_WORKER_CI_PASSTHROUGH_SECRET}" \
              '[{type:"secret_text", name:"CI_PASSTHROUGH_SECRET", text:$secret}]')"
          else
            echo "::notice::CF_WORKER_CI_PASSTHROUGH_SECRET unset — deploying staging Worker without the CI passthrough binding."
          fi
          metadata="$(jq -cn --argjson ci "$ci_binding" '{
            main_module: "worker.mjs",
            compatibility_date: "2026-06-01",
            bindings: ([
              {type:"plain_text", name:"ACTIVE_BACKEND", text:"ecs-fargate"},
              {type:"plain_text", name:"BACKEND_ECS_FARGATE", text:"https://staging-api-ecs-fargate.kortix.com"},
              {type:"plain_text", name:"GATEWAY_ACTIVE_BACKEND", text:"ecs-fargate"},
              {type:"plain_text", name:"GATEWAY_BACKEND_ECS_FARGATE", text:"https://gateway-staging-ecs-fargate.kortix.com"}
            ] + $ci)
          }')"
          curl -fsS -X PUT \
            "${auth_headers[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -F "metadata=${metadata};type=application/json" \
            -F "worker.mjs=@worker.mjs;type=application/javascript+module" >/dev/null

          routes="$(curl -fsS \
            "${auth_headers[@]}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes")"
          route_id="$(printf '%s' "$routes" | jq -r --arg pattern "$WORKER_ROUTE" '.result[]? | select(.pattern == $pattern) | .id' | head -n1)"
          route_body="$(jq -cn --arg pattern "$WORKER_ROUTE" --arg script "$WORKER_NAME" '{pattern:$pattern, script:$script}')"
          if [ -n "$route_id" ]; then
            curl -fsS -X PUT \
              "${auth_headers[@]}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes/${route_id}" \
              --data "$route_body" >/dev/null
          else
            curl -fsS -X POST \
              "${auth_headers[@]}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
              --data "$route_body" >/dev/null
          fi
          echo "deployed ${WORKER_NAME} and route ${WORKER_ROUTE}"

          # A Worker script upload replaces its bindings. Prove the gateway
          # bindings above survived the deploy before declaring staging ready.
          for attempt in $(seq 1 12); do
            response_headers="$(mktemp)"
            response_body="$(mktemp)"
            status="$(curl -sS --max-time 15 -D "$response_headers" -o "$response_body" -w '%{http_code}' "https://${GATEWAY_HOST}/health" || true)"
            backend_service="$(awk 'BEGIN { IGNORECASE=1 } /^x-backend-service:/ { gsub(/\r/, "", $2); print $2 }' "$response_headers" | tail -n1)"
            healthy="$(jq -r '.status == "healthy"' "$response_body" 2>/dev/null || echo false)"
            rm -f "$response_headers" "$response_body"
            if [ "$status" = "200" ] && [ "$backend_service" = "gateway" ] && [ "$healthy" = "true" ]; then
              echo "staging gateway Worker verified"
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::staging gateway Worker failed verification (status=$status service=$backend_service healthy=$healthy)"
              exit 1
            fi
            sleep 5
          done

  deploy-web-ecs:
    name: Deploy staging web to ECS Fargate
    needs: [preflight, deploy-ecs, terraform-staging-web]
    if: >-
      ${{ always()
        && needs.preflight.result == 'success'
        && needs.deploy-ecs.result == 'success'
        && (needs.terraform-staging-web.result == 'success' || needs.terraform-staging-web.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ROLE: arn:aws:iam::935064898258:role/kortix-gha-ecs-deploy
      DOTENV_PRIVATE_KEY_STAGING: ${{ secrets.WEB_DOTENV_PRIVATE_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync the encrypted staging web profile to Secrets Manager
        run: |
          set -euo pipefail
          test -n "${DOTENV_PRIVATE_KEY_STAGING:-}" || {
            echo "::error::WEB_DOTENV_PRIVATE_KEY_STAGING is not configured."
            exit 1
          }
          npx --yes @dotenvx/dotenvx@1.75.1 run \
            -f apps/web/.env.staging -- bash infra/scripts/sync-web-env.sh staging
      - name: Roll the staging web service onto the immutable image
        env:
          SHA8: ${{ needs.preflight.outputs.sha8 }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          bash infra/scripts/ecs-deploy.sh \
            staging \
            "kortix/kortix-frontend:staging-${SHA8}" \
            --service web \
            --version "${VERSION}"

  publish-web-ecs-dns:
    name: Publish staging FE-ECS DNS
    needs: [deploy-web-ecs]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ROLE: arn:aws:iam::935064898258:role/kortix-gha-ecs-deploy
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Point only the isolated staging FE-ECS hostname at the web ALB
        run: |
          set -euo pipefail
          alb="$(aws elbv2 describe-load-balancers \
            --names kortix-staging-web-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)"
          node infra/scripts/sync-web-dns.mjs staging "$alb"

  deploy-web-vercel:
    name: Deploy staging web to Vercel
    # deploy-ecs gates the staging rollout: a failed ECS roll can't pass silently.
    needs: [preflight, wire-cloudflare, deploy-ecs]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy and alias staging.kortix.com
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ] || [ -z "${VERCEL_TEAM_ID:-}" ]; then
            echo "::error::VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID are required."; exit 1
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ "${NEXT_PUBLIC_SUPABASE_URL:-}" = "-" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] || [ "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" = "-" ]; then
            echo "::error::staging Supabase URL and anon key are required."; exit 1
          fi
          mkdir -p .vercel
          jq -n --arg org "$VERCEL_TEAM_ID" --arg project "$VERCEL_PROJECT_ID" \
            '{orgId:$org, projectId:$project}' > .vercel/project.json
          export VERCEL_ORG_ID="$VERCEL_TEAM_ID"

          url="$(npx vercel deploy --yes --target preview --archive=tgz \
            --token "$VERCEL_TOKEN" \
            -e NEXT_PUBLIC_BACKEND_URL="https://${PUBLIC_API_HOST}/v1" \
            -e KORTIX_PUBLIC_BACKEND_URL="https://${PUBLIC_API_HOST}/v1" \
            -e NEXT_PUBLIC_APP_URL="https://${WEB_HOST}" \
            -e KORTIX_PUBLIC_APP_URL="https://${WEB_HOST}" \
            -e NEXT_PUBLIC_URL="https://${WEB_HOST}" \
            -e SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            -e SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -e NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            -e KORTIX_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -e KORTIX_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -e BACKEND_URL="https://${PUBLIC_API_HOST}/v1" \
            -e APP_URL="https://${WEB_HOST}" \
            -e NEXT_PUBLIC_BILLING_ENABLED="true" \
            -e KORTIX_PUBLIC_BILLING_ENABLED="true" \
            -e AUTH_PROVIDERS="google" \
            -e NEXT_PUBLIC_AUTH_PROVIDERS="google" \
            -e KORTIX_PUBLIC_AUTH_PROVIDERS="google" \
            -e AUTH_METHODS="magic,password" \
            -e NEXT_PUBLIC_AUTH_METHODS="magic,password" \
            -e KORTIX_PUBLIC_AUTH_METHODS="magic,password" \
            -b NEXT_PUBLIC_KORTIX_VERSION="$VERSION" \
            | tail -n1)"
          echo "Vercel deployment: ${url}"
          npx vercel alias set "$url" "$WEB_HOST" --token "$VERCEL_TOKEN"

  verify:
    name: Verify live staging on ECS and Vercel
    needs: [preflight, wire-cloudflare, deploy-web-vercel, publish-web-ecs-dns]
    runs-on: ubuntu-latest
    steps:
      - name: Verify API and both web deployment paths
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          # staging.kortix.com sits behind Vercel deployment protection (SSO);
          # send this header so the web verification reaches the app, not the
          # Vercel login wall. The API host is the ALB and needs no bypass.
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WEB_PROTECTION_PASSWORD: ${{ secrets.WEB_PROTECTION_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${WEB_PROTECTION_PASSWORD:-}" || {
            echo "::error::WEB_PROTECTION_PASSWORD is not configured."
            exit 1
          }
          for attempt in $(seq 1 30); do
            api="$(curl -fsS --max-time 15 "https://${PUBLIC_API_HOST}/v1/health" 2>/dev/null || true)"
            envv="$(printf '%s' "$api" | jq -r '.environment // empty' 2>/dev/null || true)"
            version="$(printf '%s' "$api" | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "$envv" = "staging" ] && [ "$version" = "$EXPECTED_VERSION" ]; then
              break
            fi
            echo "(${attempt}/30) waiting for staging API version ${EXPECTED_VERSION}"
            sleep 10
          done
          [ "${envv:-}" = "staging" ] || { echo "::error::staging API did not report environment=staging"; exit 1; }

          ecs="https://${ECS_WEB_HOST}"
          cookie_jar="$(mktemp)"
          trap 'rm -f "$cookie_jar"' EXIT
          anonymous="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$ecs/")"
          wrong="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -u 'kortix:wrong-password' "$ecs/")"
          protected="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -c "$cookie_jar" -u "kortix:${WEB_PROTECTION_PASSWORD}" "$ecs/")"
          cookie_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -b "$cookie_jar" "$ecs/")"
          [ "$anonymous" = 401 ] || { echo "::error::staging ECS frontend anonymous status=$anonymous"; exit 1; }
          [ "$wrong" = 401 ] || { echo "::error::staging ECS frontend wrong-password status=$wrong"; exit 1; }
          { [ "$protected" = 200 ] || [ "$protected" = 307 ] || [ "$protected" = 308 ]; } || {
            echo "::error::staging ECS frontend valid-password status=$protected"; exit 1;
          }
          { [ "$cookie_status" = 200 ] || [ "$cookie_status" = 307 ] || [ "$cookie_status" = 308 ]; } || {
            echo "::error::staging ECS frontend shared-cookie status=$cookie_status"; exit 1;
          }
          grep -E $'^(#HttpOnly_)?\\.kortix\\.com\t' "$cookie_jar" >/dev/null || {
            echo "::error::staging ECS frontend did not set the parent-domain access cookie"; exit 1;
          }
          ecs_health="$(curl -fsS --max-time 20 "$ecs/api/health")"
          [ "$(jq -r '.commit // empty' <<<"$ecs_health")" = "$EXPECTED_COMMIT" ] || {
            echo "::error::staging ECS frontend commit mismatch"; exit 1;
          }
          [ "$(jq -r '.version // empty' <<<"$ecs_health")" = "$EXPECTED_VERSION" ] || {
            echo "::error::staging ECS frontend version mismatch"; exit 1;
          }
          ecs_runtime="$(curl -fsS --max-time 20 -b "$cookie_jar" "$ecs/api/runtime-config")"
          printf '%s' "$ecs_runtime" | grep -F "\"BACKEND_URL\":\"https://${PUBLIC_API_HOST}/v1\"" >/dev/null
          printf '%s' "$ecs_runtime" | grep -F "\"APP_URL\":\"https://${ECS_WEB_HOST}\"" >/dev/null

          curl -fsSI --max-time 20 -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" "https://${WEB_HOST}/" >/tmp/web-headers
          runtime="$(curl -fsS --max-time 20 -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" "https://${WEB_HOST}/api/runtime-config")"
          printf '%s' "$runtime" | grep -F "\"BACKEND_URL\":\"https://${PUBLIC_API_HOST}/v1\"" >/dev/null
          printf '%s' "$runtime" | grep -F "\"APP_URL\":\"https://${WEB_HOST}\"" >/dev/null
          if printf '%s' "$runtime" | grep -F "dev-api.kortix.com" >/dev/null; then
            echo "::error::staging web runtime config still references dev-api.kortix.com"
            exit 1
          fi
          {
            echo "### Staging verified"
            echo "- API: https://${PUBLIC_API_HOST}/v1/health reports staging ${EXPECTED_VERSION}"
            echo "- ECS web: https://${ECS_WEB_HOST} reports ${EXPECTED_COMMIT} and accepts the shared test cookie"
            echo "- Vercel web: https://${WEB_HOST} serves staging runtime config"
            echo "- GitOps: API ALB via ECS Fargate"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Move the self-host `:staging` channel tag onto the images just verified ─
  # `kortix self-host init/update --tag staging` pulls `kortix/kortix-*:staging`
  # — a MOVING tag self-hosters track for the current staging environment (may
  # break at any time). Gated on `verify` (the last job — live staging
  # confirmed serving this exact build), so `:staging` never points at a
  # rollout that didn't actually land. Re-tag by digest only (imagetools
  # create — zero rebuild) from the immutable staging-<sha8> images
  # build-staging.yml already pushed for this commit.
  #
  # kortix/kortix-sandbox is NOT included: it has no CI publish pipeline at
  # all (see the note in deploy-dev.yml) — the Docker Hub repo doesn't exist,
  # so there is nothing to re-tag it from.
  promote-staging-channel:
    name: Move :staging → staging-${{ needs.preflight.outputs.sha8 }}
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Re-tag api/gateway/frontend → :staging
        env:
          SHA8: ${{ needs.preflight.outputs.sha8 }}
        run: |
          set -euo pipefail
          for IMAGE in kortix/kortix-api kortix/kortix-gateway kortix/kortix-frontend; do
            docker buildx imagetools create \
              --tag "$IMAGE:staging" \
              "$IMAGE:staging-${SHA8}"
            echo "✓ $IMAGE:staging → staging-${SHA8}"
          done
