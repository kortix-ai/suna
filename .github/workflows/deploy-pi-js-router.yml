# Point pi-js.kortix.com at a Platinum target.
#
# infra/cloudflare/workers/pi-js-router is the Cloudflare Worker that gives the
# name to ONE of two targets, chosen by `target_kind`:
#
#   cell   the bare JS pi agent (apps/pi-worker-js) as a Platinum Worker cell on
#          Platinum DEV. Its exposure is PRIVATE (the Worker injects the token)
#          and it has no auth of its own, so the name fails closed unless
#          `open_access` is chosen.
#   stack  a full Kortix branch environment — API + web + Supabase, the thing
#          pi.kortix.com is — deployed by deploy-preview.yml for the branch whose
#          PREVIEW_PUBLIC_ORIGINS entry is `pi-worker-js=https://pi-js.kortix.com`.
#          That workflow exposes the sandbox's 8080 PUBLIC and the stack
#          authenticates its own users, so the name runs OPEN (a browser cannot
#          present a Worker bearer) and NO exposure token is stored or sent.
#
# Run it once to create the name, and again whenever the target is recreated: an
# origin is derived from the sandbox id — stop/start keeps it, delete + recreate
# changes it. A branch environment REUSES its sandbox across deploys
# (previewSandboxIdentity in tests/src/core), so its origin holds still and this
# is not a per-deploy step. deploy-preview.yml re-points a name itself only when
# the PREVIEW_PUBLIC_ORIGINS entry names a worker, and that path publishes
# TARGET_ORIGIN alone — it would drop OPEN_ACCESS and shut the name — so the
# pi-js entry names none until the Worker's wrangler.toml defaults OPEN_ACCESS.
#
# Inputs: the target's exposure origin, e.g.
#   cell   https://8080-01m1s178mtjdff5gst7jqvc735.eu-west.sbx-dev.platinum.dev
#   stack  https://8080-<sandbox>.eu-west.sbx.platinum.dev  (Platinum PROD, where
#          deploy-preview.yml's PLATINUM_API_URL points)
# and `open_access` — the name FAILS CLOSED: without PI_JS_ACCESS_TOKEN the
# Worker answers 503 unless this input is set, which deploys OPEN_ACCESS=true
# (pi.kortix.com parity, stated out loud here rather than fallen into).
# Secrets — CLOUDFLARE_APPS_EDGE_API_TOKEN on the repo (same as pi-router); the
# two below in the `pi-js` ENVIRONMENT (the job declares it):
#   PI_JS_PREVIEW_TOKEN (the cell's exposure token — the Worker sends it to the
#   Platinum edge as x-pt-preview-token, so the port stays private),
#   PI_JS_ACCESS_TOKEN (the bearer the public name requires; optional only when
#   open_access is chosen).
#
# Deliberately gated on the target serving /health: re-pointing the name at a
# dead cell is how pi.kortix.com went dark on 2026-08-29 (see deploy-preview.yml).
name: deploy-pi-js-router

on:
  workflow_dispatch:
    inputs:
      target_origin:
        description: "the target's exposure origin — cell: https://8080-<cell>.eu-west.sbx-dev.platinum.dev; stack: https://8080-<sandbox>.eu-west.sbx.platinum.dev"
        required: true
        type: string
      target_kind:
        description: "cell = the bare JS agent on Platinum DEV (private exposure, token injected); stack = a full Kortix branch environment (public exposure, its own auth — pi.kortix.com parity)"
        required: false
        default: cell
        type: choice
        options:
          - cell
          - stack
      open_access:
        description: "run the name OPEN (no bearer) — pi.kortix.com parity; the JS agent has no auth of its own"
        required: false
        default: false
        type: boolean

concurrency:
  group: pi-js-router
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER_S || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    # The secrets live in the `pi-js` ENVIRONMENT, not on the repo: repo-level
    # secret writes on this repository answer HTTP 400 even for a repo admin
    # (2026-09-05), environment-scoped ones do not.
    environment: pi-js
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APPS_EDGE_API_TOKEN }}
      TARGET_ORIGIN: ${{ inputs.target_origin }}
      TARGET_KIND: ${{ inputs.target_kind || 'cell' }}
      OPEN_ACCESS: ${{ inputs.open_access && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The target must be a Platinum origin of its kind and answer its health route; the name must have an access policy
        env:
          PT_PREVIEW_TOKEN: ${{ secrets.PI_JS_PREVIEW_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.PI_JS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          case "$TARGET_KIND" in
            cell)
              case "$TARGET_ORIGIN" in
                https://8080-*.sbx-dev.platinum.dev|https://8080-*.sbx-dev.platinum.dev/) ;;
                *) echo "::error::target_kind=cell: target_origin must look like https://8080-<cell>[.<region>].sbx-dev.platinum.dev — got '$TARGET_ORIGIN'"; exit 1 ;;
              esac
              [ -n "${PT_PREVIEW_TOKEN:-}" ] || { echo "::error::PI_JS_PREVIEW_TOKEN is not set — the cell's port is private and the Worker cannot reach it without the token"; exit 1; }
              if [ -z "${ACCESS_TOKEN:-}" ] && [ "$OPEN_ACCESS" != "true" ]; then
                echo "::error::PI_JS_ACCESS_TOKEN is not set and open_access was not chosen — refusing to deploy a name that would answer 503; set the secret, or re-run with open_access=true to run it open on purpose"
                exit 1
              fi
              ;;
            stack)
              # A branch environment's 8080 is exposed PUBLIC by deploy-preview.yml
              # (sandbox-preview-providers.ts: `expose: [{ port: 8080, public: true }]`)
              # on Platinum PROD — the edge pi.kortix.com's sandbox is on. sbx-dev
              # is accepted too, for the day deploy-preview targets dev.
              case "$TARGET_ORIGIN" in
                https://8080-*.sbx.platinum.dev|https://8080-*.sbx.platinum.dev/|https://8080-*.sbx-dev.platinum.dev|https://8080-*.sbx-dev.platinum.dev/) ;;
                *) echo "::error::target_kind=stack: target_origin must look like https://8080-<sandbox>[.<region>].sbx.platinum.dev — got '$TARGET_ORIGIN'"; exit 1 ;;
              esac
              # The stack authenticates its own users (Supabase). A browser cannot
              # present the Worker's bearer, so a gated name would only break the
              # UI while protecting nothing the stack does not already protect.
              [ "$OPEN_ACCESS" = "true" ] || { echo "::error::target_kind=stack requires open_access=true — the Kortix stack has its own auth, and the Worker's bearer would only lock the browser out"; exit 1; }
              ;;
            *) echo "::error::target_kind must be cell or stack — got '$TARGET_KIND'"; exit 1 ;;
          esac
          ok=
          for _ in $(seq 1 12); do
            if [ "$TARGET_KIND" = stack ]; then
              # The proof deploy-preview.yml demands before it re-points
              # pi.kortix.com: the API answering, not merely the sandbox existing.
              if curl -fsS --max-time 15 "${TARGET_ORIGIN%/}/v1/health" 2>/dev/null | jq -e '.status == "ok"' >/dev/null 2>&1; then ok=1; break; fi
              echo "/v1/health → not ok yet (waiting)"
            else
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -H "x-pt-preview-token: $PT_PREVIEW_TOKEN" "${TARGET_ORIGIN%/}/health" || true)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "health → $code (a stopped cell cold-boots in ~4 s; waiting)"
            fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "::error::${TARGET_ORIGIN} does not answer its health route — leaving pi-js.kortix.com on its previous target"; exit 1; }
      - name: Publish the Worker with the new target and access policy
        working-directory: infra/cloudflare/workers/pi-js-router
        run: npx --yes wrangler@4 deploy --var "TARGET_ORIGIN:${TARGET_ORIGIN%/}" --var "OPEN_ACCESS:${OPEN_ACCESS}"
      - name: Store the Worker's secrets
        working-directory: infra/cloudflare/workers/pi-js-router
        env:
          PT_PREVIEW_TOKEN: ${{ secrets.PI_JS_PREVIEW_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.PI_JS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$TARGET_KIND" = stack ]; then
            # A public exposure needs no token, and the DEV cell's exposure token
            # must not ride along on every request to a PROD stack.
            npx --yes wrangler@4 secret delete PT_PREVIEW_TOKEN --force >/dev/null 2>&1 || true
            echo "target is a Kortix stack: no exposure token is stored on the Worker"
          else
            printf '%s' "$PT_PREVIEW_TOKEN" | npx --yes wrangler@4 secret put PT_PREVIEW_TOKEN
          fi
          if [ "$OPEN_ACCESS" = "true" ]; then
            # The operator chose an open name: a bearer left on the Worker from
            # an earlier gated deploy must not stay stored beside it.
            npx --yes wrangler@4 secret delete ACCESS_TOKEN --force >/dev/null 2>&1 || true
            echo "::warning::pi-js.kortix.com is OPEN (open_access=true) — the JS agent has no auth of its own"
          elif [ -n "${ACCESS_TOKEN:-}" ]; then
            printf '%s' "$ACCESS_TOKEN" | npx --yes wrangler@4 secret put ACCESS_TOKEN
            echo "pi-js.kortix.com requires a bearer (PI_JS_ACCESS_TOKEN is set)"
          fi
      - name: Read the name back
        run: |
          set -euo pipefail
          route=/health
          [ "$TARGET_KIND" != stack ] || route=/v1/health
          for _ in $(seq 1 12); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://pi-js.kortix.com${route}" || true)"
            case "$code" in
              200) echo "pi-js.kortix.com${route} → 200 (open, target_kind=${TARGET_KIND})"; exit 0 ;;
              401) echo "pi-js.kortix.com → 401 (gated by PI_JS_ACCESS_TOKEN)"; exit 0 ;;
              503) echo "::error::pi-js.kortix.com → 503 — the Worker has no access policy (ACCESS_TOKEN secret missing and OPEN_ACCESS not true)"; exit 1 ;;
            esac
            echo "pi-js.kortix.com → $code (custom domain / cert may still be provisioning)"; sleep 10
          done
          echo "::warning::pi-js.kortix.com did not answer 200/401 within 2 minutes — Cloudflare may still be issuing the certificate; check again shortly"
