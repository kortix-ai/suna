name: CI

# Pull-request gate. Required to pass before merging into protected branches
# (SOC 2 CC8.1 — automated checks run on every change before review/merge).

on:
  # A push or pull request into `dev` runs no CI (Actions minutes, 2026-10-03).
  # The release pull request into `prod` is the gate; the pull request into
  # `staging` runs nothing (2026-10-16). A weekly schedule runs every job as a
  # safety net on `dev`.
  pull_request:
    branches: [prod]
  schedule:
    - cron: '53 4 * * 1' # weekly, Monday 04:53 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which parts of the repo a PR touches so each build job runs only when
  # something in its dependency closure changed — no point typechecking the API
  # for a frontend-only PR, or rebuilding the desktop app for an API-only one.
  #
  # Each filter = the app's own dir + every workspace package it depends on (its
  # pnpm `--filter "X..."` closure) + the shared foundation files that can break
  # any pnpm build. The Bun-based sandbox agent has its own in-dir lockfile, so it
  # only shares tsconfig.base.json; desktop runs no TS typecheck.
  #
  # A job gated `if: needs.changes.outputs.* == 'true'` reports as "skipped" when
  # it doesn't run, and GitHub treats a skipped job as passing — safe even if
  # these are later made required checks. workflow_dispatch and schedule always run the
  # full suite (the `|| github.event_name != 'pull_request'` guard on each job).
  changes:
    name: Detect changes
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      app_runtime: ${{ steps.filter.outputs.app_runtime }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
      sandbox_agent: ${{ steps.filter.outputs.sandbox_agent }}
      sandbox_image: ${{ steps.filter.outputs.sandbox_image }}
      desktop: ${{ steps.filter.outputs.desktop }}
      self_host: ${{ steps.filter.outputs.self_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            # Shared foundation for the pnpm-installed jobs (frontend/cli/self-host):
            # a change here can break any of their installs/typechecks.
            pnpm: &pnpm
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            app_runtime:
              - '.github/workflows/ci.yml'
              - 'apps/kortix-app-runtime/**'
              # build_test.go asserts the Caddy pin in this file.
              - 'apps/api/Dockerfile'
            frontend:
              - *pnpm
              - 'apps/web/**'
              - 'packages/shared/**'
            cli:
              - *pnpm
              - 'apps/cli/**'
              - 'packages/manifest-schema/**'
              - 'packages/starter/**'
            sandbox_agent:
              - '.github/workflows/ci.yml'
              - 'tsconfig.base.json'
              - 'apps/kortix-sandbox-agent-server/**'
              - 'packages/shared/src/ssrf-guard.ts'
              # Bundled into the daemon (KORTIXD_SHARED_SOURCES).
              - 'packages/api-contract/src/**'
              - 'packages/sdk/src/core/session/wire-message-id.ts'
            sandbox_image:
              - '.github/workflows/ci.yml'
              - 'apps/sandbox/Dockerfile'
              - 'scripts/check-sandbox-apt-packages.sh'
            desktop:
              - '.github/workflows/ci.yml'
              - 'apps/desktop-electron/**'
            # self-host stack: anything that can break `kortix self-host start`'s
            # from-scratch DB bootstrap or the CLI's compose generation.
            self_host:
              - *pnpm
              - 'apps/api/Dockerfile'
              - 'apps/kortix-app-runtime/**'
              - 'apps/api/src/snapshots/builder.ts'
              - 'apps/api/src/config.ts'
              - 'packages/db/**'
              - 'apps/cli/src/commands/self-host.ts'
              - 'apps/cli/src/self-host/**'
              - 'apps/cli/scripts/self-host-e2e/**'

  # No API typecheck here: the `packages-api` contract lane runs
  # `pnpm --filter kortix-api typecheck` on the same release tree
  # (tests/bin/package-quality.ts), so a job here was the same tsc twice.

  frontend-build:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_L || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)"

      - name: Install dependencies (frontend + workspace deps)
        run: pnpm install --frozen-lockfile --filter "./apps/web..."
        env:
          npm_config_engine_strict: "false"

      # src/sdk-boundary.test.ts runs in the `packages-rest` contract lane
      # (apps/web `bun test`); only the lint is unique to this job.
      - name: Enforce frontend lint
        run: pnpm --dir apps/web exec eslint src --quiet

      - name: Lint translations
        run: pnpm --dir apps/web run lint:i18n

      # Next.js 16.3 turns on Turbopack's FileSystem cache for `next build`
      # (`experimental.turbopackFileSystemCacheForBuild`, default true) and
      # writes it to apps/web/.next/cache/turbopack. A bare runner starts with
      # no .next, so without this step 16.3 pays the cost of WRITING that cache
      # on every run and never reads it back. Restoring it is what turns the
      # 16.3 build-cache feature into an actual CI speedup.
      #
      # Key on the lockfile plus this run's SHA so every run saves a fresh
      # entry (actions/cache never overwrites an existing key); the restore-key
      # falls back to the newest entry built against the same dependency set.
      # Turbopack invalidates per-file from its own content hashes, so a
      # restored cache from an older SHA is a valid starting point, not a
      # source of stale output.
      #
      # The fallback deliberately stops at the lockfile hash. A broader
      # `nextjs-turbopack-<os>-` key would also match caches built against a
      # DIFFERENT next version, whose on-disk cache format need not be
      # compatible — that is ~1GB downloaded to be discarded. Upstream's recipe
      # scopes its restore-keys to the lockfile for the same reason:
      # https://nextjs.org/docs/app/guides/ci-build-caching
      #
      # Verified on this PR: run 1 logged "Cache not found" then "Cache saved";
      # a re-run logged "Cache restored from key" and the Turbopack compile
      # went 105s -> 1.549s.
      - name: Restore Turbopack build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: nextjs-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build standalone frontend
        run: pnpm --filter ./apps/web build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8008/v1
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder-anon-key
          NEXT_PUBLIC_BILLING_ENABLED: "false"
          NEXT_OUTPUT: standalone

  app-runtime-tests:
    name: App runtime Go tests
    needs: changes
    if: needs.changes.outputs.app_runtime == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/kortix-app-runtime/go.mod
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false

      - name: Go tests
        working-directory: apps/kortix-app-runtime
        run: go test ./...

  sandbox-agent-build:
    name: Sandbox agent build
    needs: changes
    if: needs.changes.outputs.sandbox_agent == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # The import-boundary lint runs under Node: ESLint's config validation
      # crashes under the Bun runtime (apps/kortix-sandbox-agent-server/ARCHITECTURE.md).
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/kortix-sandbox-agent-server

      # No typecheck: the `packages-kortixd` contract lane runs
      # `pnpm --filter kortixd typecheck` on the same release tree.
      - name: Import boundaries
        run: bun run lint && bun run test:architecture
        working-directory: apps/kortix-sandbox-agent-server

      - name: Build Linux sandbox agent daemon
        run: BUN_COMPILE_TARGET=bun-linux-x64 bun run build
        working-directory: apps/kortix-sandbox-agent-server

      - name: Verify binary exists
        run: |
          test -x apps/kortix-sandbox-agent-server/dist/kortix-agent
          ls -lh apps/kortix-sandbox-agent-server/dist/kortix-agent

  # The sandbox image builds on the provider after a merge, never here. A
  # package name apt cannot find (2026-09-23: `build-essential` scrubbed into
  # `build-samplecol`) failed every default image build for 16 hours. Resolve
  # the package list against the same base image before it can merge.
  sandbox-image-packages:
    name: Sandbox image apt packages
    needs: changes
    if: needs.changes.outputs.sandbox_image == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Every apt package the sandbox image installs resolves
        run: bash scripts/check-sandbox-apt-packages.sh

  cli-binary-smoke:
    name: CLI binary smoke
    needs: changes
    if: needs.changes.outputs.cli == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"

      - name: Install dependencies (CLI + workspace deps)
        run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: "false"

      - name: Build Linux CLI binary
        run: |
          bun build \
            --compile \
            --minify \
            --target=bun-linux-x64 \
            --outfile=/tmp/kortix-cli-smoke \
            apps/cli/src/index.ts

      - name: Smoke test binary
        run: /tmp/kortix-cli-smoke version

  # Always-on gate against the self-host schema-bootstrap regression class: a
  # fresh `kortix self-host` database must come up fully provisioned. Boots the
  # data plane (Postgres + Supabase + the kortix-migrate one-shot + the API) and
  # asserts the migrate one-shot applies all migrations and the
  # owner/account flow works. This is a deployment-topology gate. Product
  # behavior remains covered by the root test command.
  self-host-schema:
    name: Self-host schema bootstrap
    needs: changes
    if: needs.changes.outputs.self_host == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"

      - name: Install dependencies (CLI + workspace deps)
        run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        # --load: the buildx builder is a separate buildkitd, so the result
        # must be exported into the local daemon for the compose stack below.
        # The dev image's registry cache warms it (read-only).
        run: docker build --load --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile -t kortix/kortix-api:selfhost-local .

      - name: Self-host schema-bootstrap check (fresh DB)
        run: bash apps/cli/scripts/self-host-e2e/schema-check.sh
        env:
          API_IMAGE: kortix/kortix-api:selfhost-local

  desktop-installer-smoke:
    name: Desktop installer smoke
    # Skip on PRs that don't touch desktop code. Push-to-dev builds (desktop.yml)
    # still cover the full signed release artifacts.
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      # The installer bundles the computer agent (packages/agent-tunnel), built
      # with bun by scripts/ensure-runtime.js before electron-builder runs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/desktop-electron --filter @kortix/agent-tunnel
        env:
          npm_config_engine_strict: "false"

      - name: Ensure Electron runtime
        run: pnpm --filter @kortix/desktop-electron exec node scripts/ensure-runtime.js

      - name: Build Linux desktop installer (Electron, unsigned)
        run: pnpm --filter @kortix/desktop-electron exec electron-builder --linux --publish never
        env:
          KORTIX_DESKTOP_DEFAULT_URL: https://dev.kortix.com/projects
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer exists
        run: |
          shopt -s nullglob
          files=(apps/desktop-electron/dist/*.AppImage)
          test "${#files[@]}" -gt 0
          ls -lh "${files[@]}"

  lockfile-advisories:
    name: GHSA lockfile advisory check
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Check root lockfile against GHSA advisories
        # Exception: 4 better-auth advisories (GHSA-q84f-53jg-9ppm, GHSA-r4xp-prcw-77qf,
        # GHSA-965c-763c-88jm, GHSA-44jh-23m7-hpcf). Only apps/white-label/lumen pulls
        # better-auth; no workflow builds or deploys it; it uses none of the affected
        # features (device login, OAuth proxy, magic link); and @convex-dev/better-auth
        # has no release for the fixed better-auth 1.7.7+. pnpm 8.11 cannot ignore an
        # advisory by GHSA id, so the JSON report is filtered; anything else at moderate
        # or above fails, and an unreadable report fails.
        run: |
          npx --yes pnpm@8.11.0 audit --audit-level moderate --json > "$RUNNER_TEMP/audit.json" || true
          node -e '
            const ignore = new Set(["GHSA-q84f-53jg-9ppm", "GHSA-r4xp-prcw-77qf", "GHSA-965c-763c-88jm", "GHSA-44jh-23m7-hpcf"]);
            const rank = { info: 0, low: 1, moderate: 2, high: 3, critical: 4 };
            const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const bad = Object.values(report.advisories ?? {}).filter((a) => rank[a.severity] >= rank.moderate && !ignore.has(a.github_advisory_id));
            for (const a of bad) console.log(`${a.severity} ${a.module_name} ${a.github_advisory_id} ${a.url}`);
            process.exit(bad.length ? 1 : 0);
          ' "$RUNNER_TEMP/audit.json"
      - name: Check scanner lockfile against GHSA advisories
        if: always()
        working-directory: .deepsec
        run: npx --yes pnpm@9.15.4 audit --audit-level moderate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: always()
        with:
          bun-version: 1.4.3
      - name: Check daemon lockfile against GHSA advisories
        if: always()
        working-directory: apps/kortix-sandbox-agent-server
        # GHSA-mrhx-c7xc-m3w5 (zod collection-size DoS) has no 3.x fix. kortixd
        # compiles @kortix/api-contract's zod 3 types, so it moves to zod 4 with
        # api-contract. Root and .trivyignore carry the same exception.
        run: bun audit --audit-level moderate --ignore=GHSA-mrhx-c7xc-m3w5

  dependency-scan:
    name: Dependency + secret scan
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
