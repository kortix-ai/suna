name: Tests - PR

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: tests-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: all local tests
    uses: ./.github/workflows/tests.yml
    with:
      mode: full
      artifact-name: tests-pr-results
      retention-days: 14
    secrets: inherit
