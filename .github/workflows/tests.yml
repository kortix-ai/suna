name: Tests

# The four local-profile lanes run NATIVELY on Blacksmith runners since
# 2026-08-26. Before that each lane ran inside a Platinum/Daytona cloud sandbox
# (a cloud-sandbox worker script) with the runner as a thin orchestrator; the
# provider path failed on its own (Platinum restore timeouts → Daytona fallback
# whose kernel could not mount overlay2) on roughly every third lane on
# 2026-08-25. A Blacksmith runner already has Docker, 8 vCPU / 32 GB, a
# transparent pnpm/actions cache, and org-wide Docker image caching (the
# Supabase images stay pulled), so the lane is the unchanged root command:
# `pnpm test -- <lane args>`. Pull-request previews (deploy-preview.yml) still
# use a sandbox — they need a long-lived public HTTPS origin, which a runner
# cannot provide.

on:
  workflow_call:
    inputs:
      mode:
        description: Root test mode.
        required: false
        default: full
        type: string
      artifact-name:
        description: Uploaded artifact name.
        required: true
        type: string
      retention-days:
        description: Artifact retention in days.
        required: false
        default: 14
        type: number

permissions:
  contents: read

jobs:
  lane:
    name: ${{ matrix.lane }} lane
    runs-on: ${{ vars.CI_RUNNER_L || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            mode: core
            args: ""
          - lane: browser-1
            mode: browser
            args: --browser-only --browser-shard=1/2
          - lane: browser-2
            mode: browser
            args: --browser-only --browser-shard=2/2
          - lane: packages
            mode: packages
            args: --packages-only
    env:
      CI: "1"
      TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_MODE: ${{ inputs.mode }}
      TEST_LANE: ${{ matrix.lane }}
      TEST_ARGS: ${{ matrix.args }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Validate the requested test mode
        run: |
          case "$TEST_MODE" in
            full|core|browser|packages) ;;
            *) echo "::error::Invalid test mode: $TEST_MODE"; exit 2 ;;
          esac
      - uses: actions/checkout@v7
        if: inputs.mode == 'full' || inputs.mode == matrix.mode
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        if: inputs.mode == 'full' || inputs.mode == matrix.mode
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        if: inputs.mode == 'full' || inputs.mode == matrix.mode
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        if: inputs.mode == 'full' || inputs.mode == matrix.mode
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)  docker: $(docker -v)"
          pnpm install --frozen-lockfile
        env:
          npm_config_engine_strict: "false"
      - name: Restore Chromium
        if: matrix.mode == 'browser' && (inputs.mode == 'full' || inputs.mode == matrix.mode)
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: matrix.mode == 'browser' && (inputs.mode == 'full' || inputs.mode == matrix.mode)
        run: pnpm --dir tests exec playwright install --with-deps chromium
      - name: Prestart Supabase for the browser lane
        # The root runner reuses a running local Supabase. Starting it before the
        # lane keeps Next.js cold-route compilation and the Supabase image
        # extraction from overlapping inside the runner's memory budget.
        if: matrix.mode == 'browser' && (inputs.mode == 'full' || inputs.mode == matrix.mode)
        run: pnpm exec supabase start --ignore-health-check
      - name: Run the root test lane
        if: inputs.mode == 'full' || inputs.mode == matrix.mode
        run: |
          set -euo pipefail
          if [[ "$TEST_LANE" == "packages" && "$TEST_MODE" == "full" ]]; then
            export KORTIX_PACKAGE_SKIP_SDK_TESTS=1
          fi
          echo "[ci] lane=$TEST_LANE sha=$TEST_SHA command=pnpm test -- $TEST_ARGS"
          # shellcheck disable=SC2086 # TEST_ARGS is a matrix literal, split on purpose
          if [[ -n "$TEST_ARGS" ]]; then pnpm test -- $TEST_ARGS; else pnpm test; fi
      - name: Stop the local Supabase stack
        if: always() && matrix.mode == 'browser' && (inputs.mode == 'full' || inputs.mode == matrix.mode)
        run: pnpm exec supabase stop --no-backup || true
      - name: Guard test artifacts against secrets
        if: always() && (inputs.mode == 'full' || inputs.mode == matrix.mode)
        run: |
          set -euo pipefail
          # grep, never rg: GitHub's ubuntu images ship no ripgrep, and with the
          # tool missing under `2>/dev/null` this guard passed on nothing from
          # its first run until 2026-08-25, when Blacksmith images (which ship
          # rg) ran it for real. Pattern = GUARD_PATTERN_SOURCE in
          # tests/src/core/scrub.ts; the runner scrubs the same shapes before
          # writing results.json / report.html.
          pattern='kortix_(pat|sa)_[A-Za-z0-9]{12,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,}\.'
          if [ -d tests/test-results ] && grep -rEIl "$pattern" tests/test-results; then
            echo "::error::A test artifact contains a secret-shaped value."
            exit 1
          fi
          echo "No secret-shaped values found."
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.mode == 'full' || inputs.mode == matrix.mode)
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.lane }}
          path: |
            tests/test-results/**
            !tests/test-results/deployment-bypass-state.json
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
