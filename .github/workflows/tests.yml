name: Tests

# The local suite: ten lanes (core, browser-1..8, packages) on GitHub-hosted
# runners (free on this public repo). Each lane is the unchanged root command
# `pnpm test -- <args>`.
#
# It runs when ANY of these holds:
#   1. a daily `schedule` on `dev`        — safety-net trunk signal
#   2. a pull request into `staging`       — the release candidate
#   3. someone adds the `test` label       — one explicit run on that PR
#   4. a `workflow_dispatch`               — manual
#
# Nothing else runs it. A pull request into `dev` runs no lane unless a person
# adds `test`; that runs the suite ONCE, at the head SHA of that moment. A later
# push does not re-run it: re-add the label. The developer's box is the
# pre-merge gate (`pnpm test`). No run blocks a merge into `dev`.
#
# A push to `dev` does NOT run it (since 2026-10-03: Actions minutes). The
# per-merge gate is the local attestation plus the pre-push hook. The schedule
# only catches drift the attestation missed.
#
# `trunk-report` comments on the HEAD commit when a scheduled run is red.
# A superseded (cancelled) run reports nothing. A green run runs no extra job.

on:
  pull_request:
    branches: [dev, staging]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  schedule:
    # Off the top of the hour: GitHub drops congested top-of-hour crons.
    - cron: '41 5 * * *' # 05:41 UTC daily, runs on dev HEAD
  workflow_dispatch:

# A pull request cancels its superseded run: only its newest commit matters.
# A scheduled or manual run on `dev` QUEUES instead, so it always ends with a
# verdict.
#
# A labelled run has its own group: a later push (whose lanes skip) must not
# cancel the run a person asked for. Only re-adding the label supersedes it.
concurrency:
  group: tests-${{ github.ref }}${{ github.event.action == 'labeled' && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lane:
    name: ${{ matrix.lane }} lane
    # A release pull request runs on every update except a label change. Into
    # `dev`, only the act of adding `test` runs it.
    if: >-
      github.event_name != 'pull_request'
      || (github.base_ref == 'staging' && github.event.action != 'labeled')
      || (github.event.action == 'labeled' && github.event.label.name == 'test')
    runs-on: ${{ vars.CI_RUNNER_L || 'ubuntu-24.04' }}
    # 40, not 20 and not 60. On free 4 vCPU runners the lanes run ~3x their
    # Blacksmith time: core 15.4 min, browser-1 17.7 min (run 37812339796),
    # so 40 is ~2x the slowest measured lane. The cap is a hang detector: on
    # 2026-09-21 `@kortix/cli` hung and the lane burned the full 60 min before
    # `trunk-report` could say `dev` was red.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            mode: core
            args: ""
          # Eight browser shards, one Playwright worker each, since 2026-10-08.
          # The lanes moved from Blacksmith 8 vCPU / 32 GB to free GitHub-hosted
          # 4 vCPU / 16 GB runners. Four shards x two workers ran ~3x slower
          # there (browser-1 17.7 min vs 6.1), a 180 s journey timed out, and
          # one runner died mid-lane (run 37812339796). Half the tests per
          # runner and one worker keep each test near its old CPU budget.
          # `--browser-shard` is Playwright's native `--shard`, which splits by
          # test count, not by duration.
          - lane: browser-1
            mode: browser
            args: --browser-only --browser-shard=1/8
          - lane: browser-2
            mode: browser
            args: --browser-only --browser-shard=2/8
          - lane: browser-3
            mode: browser
            args: --browser-only --browser-shard=3/8
          - lane: browser-4
            mode: browser
            args: --browser-only --browser-shard=4/8
          - lane: browser-5
            mode: browser
            args: --browser-only --browser-shard=5/8
          - lane: browser-6
            mode: browser
            args: --browser-only --browser-shard=6/8
          - lane: browser-7
            mode: browser
            args: --browser-only --browser-shard=7/8
          - lane: browser-8
            mode: browser
            args: --browser-only --browser-shard=8/8
          - lane: packages
            mode: packages
            args: --packages-only
    env:
      CI: "1"
      TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_LANE: ${{ matrix.lane }}
      TEST_ARGS: ${{ matrix.args }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TEST_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)  docker: $(docker -v)"
          pnpm install --frozen-lockfile
        env:
          npm_config_engine_strict: "false"
      - name: Install ripgrep
        # The sandbox agent's glob/grep tools (kortix-sandbox-agent-server)
        # shell out to rg. The sandbox image ships it; GitHub's runner image
        # does not (Blacksmith's did, which hid this until 2026-10-08).
        if: matrix.mode == 'packages'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ripgrep
      - name: Restore Chromium
        # The core and packages lanes also run apps/web's layout test that launches Chromium.
        if: matrix.mode == 'browser' || matrix.mode == 'packages' || matrix.mode == 'core'
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: matrix.mode == 'browser' || matrix.mode == 'packages' || matrix.mode == 'core'
        run: pnpm --dir tests exec playwright install --with-deps chromium
      - name: Free the local Supabase ports
        # Blacksmith runners are reused, and a job that ended without stopping
        # its stack leaves containers holding 54321-54324. The next
        # `supabase start` then dies with
        #   failed to bind host port for 0.0.0.0:54324: address already in use
        # which looks exactly like a test failure. Seen four times on
        # 2026-09-21 across the core, packages and browser lanes.
        #
        # Three things have to happen, in this order, because each one misses
        # what the next catches:
        #
        # 1. `supabase stop` — reaches only containers of its own project name.
        # 2. Remove by PUBLISHED PORT — catches a stack another checkout left.
        # 3. WAIT for the kernel to release the port. Removing a container does
        #    not free its binding instantly. On run 35630898515 (browser-1,
        #    dev @ 3c67a5e0b6) steps 1 and 2 both ran clean, `docker ps`
        #    matched nothing, 54322 then bound fine — and 54324 still refused.
        #    Nothing was left to delete; the binding simply had not been given
        #    back yet.
        #
        # If a port is STILL busy after the wait, say who holds it. The three
        # occurrences so far were each diagnosed by inference; the next one
        # should arrive with evidence instead.
        run: |
          set -uo pipefail
          pnpm exec supabase stop --no-backup || true
          for port in 54321 54322 54323 54324; do
            ids=$(docker ps -aq --filter "publish=$port" || true)
            if [ -n "$ids" ]; then
              echo "[ci] removing stale container(s) on port $port: $ids"
              docker rm -f $ids || true
            fi
          done
          # Wait by ATTEMPTING A BIND, not by reading `ss`.
          #
          # `ss -ltn` lists LISTENING sockets only, so it reports a port free
          # while `bind()` still returns EADDRINUSE — a closing docker-proxy is
          # not "listening". Measured on browser-2: `supabase stop` returned at
          # 09:19:26.710, the old `ss` loop cleared all four ports by
          # 09:19:27.448 (0.74s, first poll), and `supabase start` still failed
          # to bind 54324 twenty-five seconds later. The check was passing on a
          # port that was not free, and two earlier fixes rested on that.
          #
          # A bind cannot disagree with Docker, because it is what Docker does.
          # An uncaught OSError exits 1, so no try/except is needed — which
          # keeps this a ONE-LINER. Multi-line python here would sit at column 0
          # inside this block scalar and break the YAML.
          # SO_REUSEADDR matches docker-proxy: without it a lingering TIME_WAIT
          # would make this wait the full 30s on a healthy runner.
          bindable() { python3 -c "import socket,sys; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(('0.0.0.0',int(sys.argv[1])))" "$1" 2>/dev/null; }
          for port in 54321 54322 54323 54324; do
            for _ in $(seq 1 30); do
              bindable "$port" && break
              sleep 1
            done
            if ! bindable "$port"; then
              echo "::warning::port $port still refuses a bind after the sweep; supabase start will fail"
              ss -ltnp "sport = :$port" || true
              ss -tanH "sport = :$port" || true
              docker ps -a --filter "publish=$port" --format '{{.ID}} {{.Image}} {{.Status}} {{.Ports}}' || true
            fi
          done
      - name: Prestart Supabase for the browser lane
        # The root runner reuses a running local Supabase. Starting it before the
        # lane keeps Next.js cold-route compilation and the Supabase image
        # extraction from overlapping inside the runner's memory budget.
        if: matrix.mode == 'browser'
        run: pnpm exec supabase start --ignore-health-check
      - name: Run the root test lane
        run: |
          set -euo pipefail
          # SDK tests run in the core lane; skipping them here keeps the
          # binding `packages` lane as short as it can be.
          if [[ "$TEST_LANE" == "packages" ]]; then
            export KORTIX_PACKAGE_SKIP_SDK_TESTS=1
          fi
          # One Playwright worker per browser shard on a 4 vCPU / 16 GB
          # runner (see the matrix). Browser lanes only: the core lane's unit
          # tests assert the default of two.
          if [[ "$TEST_LANE" == browser-* ]]; then
            export E2E_BROWSER_WORKERS=1
          fi
          echo "[ci] lane=$TEST_LANE sha=$TEST_SHA command=pnpm test -- $TEST_ARGS"
          # shellcheck disable=SC2086 # TEST_ARGS is a matrix literal, split on purpose
          if [[ -n "$TEST_ARGS" ]]; then pnpm test -- $TEST_ARGS; else pnpm test; fi
      - name: Stop the local Supabase stack
        # EVERY lane, not just the browser ones. The core and packages lanes
        # start Supabase too (through `pnpm test`), and leaving it running is
        # what strands the ports for the next job on a reused runner.
        if: always()
        run: pnpm exec supabase stop --no-backup || true
      - name: Guard test artifacts against secrets
        if: always()
        run: |
          set -euo pipefail
          # grep, never rg: GitHub's ubuntu images ship no ripgrep, and with the
          # tool missing under `2>/dev/null` this guard passed on nothing from
          # its first run until 2026-08-25, when Blacksmith images (which ship
          # rg) ran it for real. Pattern = GUARD_PATTERN_SOURCE in
          # tests/src/core/scrub.ts; the runner scrubs the same shapes before
          # writing results.json / report.html.
          pattern='kortix_(pat|sa)_[A-Za-z0-9]{12,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,}\.'
          if [ -d tests/test-results ] && grep -rEIl "$pattern" tests/test-results; then
            echo "::error::A test artifact contains a secret-shaped value."
            exit 1
          fi
          echo "No secret-shaped values found."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-results-${{ matrix.lane }}
          path: |
            tests/test-results/**
            !tests/test-results/deployment-bypass-state.json
          if-no-files-found: warn
          retention-days: 14

  trunk-report:
    name: trunk verdict
    needs: lane
    # A lane that hits `timeout-minutes` concludes `cancelled`, not `failure`,
    # so `failure()` would miss it. `cancelled()` is true only when the whole
    # run is cancelled: a manual cancel, or a queued run that a newer
    # one replaced before it started.
    if: github.event_name == 'schedule' && !cancelled() && needs.lane.result != 'success'
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: write # commit comment
      actions: read # read this run's per-lane conclusions
    steps:
      - name: Report the trunk verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # `|| true`: a failed lookup must not swallow the comment below.
          failed="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | select(.name | endswith("lane")) | .name] | join(", ")' || true)"

          # Merges land faster than the suite and queued runs supersede each
          # other, so the red commit is often not the culprit. Name every
          # commit since the last green scheduled run: those are the suspects.
          green="$(gh api "repos/$REPO/actions/workflows/tests.yml/runs?branch=dev&event=schedule&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)"
          suspects=""
          if [ -n "$green" ]; then
            suspects="$(gh api "repos/$REPO/compare/${green}...${SHA}" \
              --jq '.commits[] | "- `\(.sha[0:10])` \(.commit.message | split("\n")[0]) (@\(.author.login // .commit.author.name))"' || true)"
          fi

          {
            echo "## \`dev\` @ \`${SHA:0:8}\`: failure"
            echo
            echo "Full local suite (\`core\`, \`browser-1..4\`, \`packages\`)."
            if [ -n "$failed" ]; then
              echo
              echo "Failing lanes: \`$failed\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Built line by line: every line of this script must stay indented
          # inside the YAML block scalar, so no embedded multi-line literal.
          {
            echo "\`dev\` is red at this commit."
            echo
            echo "Failing lanes: \`${failed:-see the run}\`"
            echo
            echo "Run: $RUN_URL"
            echo
            if [ -n "$suspects" ]; then
              echo "Commits since the last green run (\`${green:0:10}\`), newest last:"
              echo
              echo "$suspects"
              echo
            fi
            echo "The author whose commit broke it fixes forward. If \`dev\` is still"
            echo "red 1 hour after this comment, anyone may revert the culprit PR."
            echo
            echo "This is the scheduled trunk suite (\`tests.yml\`). It did not"
            echo "block the merge — \`dev\` is the dev trunk. Reproduce locally with"
            echo "\`pnpm test -- --full\`, or one lane at a time:"
            echo
            echo '```'
            echo "pnpm test                                        # core"
            echo "pnpm test -- --packages-only                     # packages"
            echo "pnpm test -- --browser-only --browser-shard=1/8  # browser-1"
            echo "pnpm test -- --browser-only --browser-shard=2/8  # browser-2"
            echo "pnpm test -- --browser-only --browser-shard=3/8  # browser-3"
            echo "pnpm test -- --browser-only --browser-shard=4/8  # browser-4"
            echo "pnpm test -- --browser-only --browser-shard=5/8  # browser-5"
            echo "pnpm test -- --browser-only --browser-shard=6/8  # browser-6"
            echo "pnpm test -- --browser-only --browser-shard=7/8  # browser-7"
            echo "pnpm test -- --browser-only --browser-shard=8/8  # browser-8"
            echo '```'
          } > /tmp/trunk-verdict.md

          gh api "repos/$REPO/commits/$SHA/comments" -F body=@/tmp/trunk-verdict.md --jq '.html_url'
          echo "::error::dev is red at $SHA (lanes: ${failed:-unknown})"
          exit 1
