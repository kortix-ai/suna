name: ECS manual scale

# Manual, reversible lever to change desired_count on a live ECS service
# without going through Terraform (the ecs-api module deliberately has
# `ignore_changes = [task_definition, desired_count]` on the service — see
# infra/terraform/modules/ecs-api/main.tf — so ops-level scaling like this is
# the intended mechanism, not a Terraform apply). Uses the same
# `kortix-gha-ecs-deploy` OIDC role every deploy-*.yml already assumes, scoped
# to ecs:UpdateService on kortix-*/kortix-* only.
on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "ECS cluster name, e.g. kortix-staging"
        required: true
        type: string
      service:
        description: "ECS service name, e.g. kortix-staging or kortix-staging-gateway"
        required: true
        type: string
      desired_count:
        description: "New desired task count"
        required: true
        type: number
      region:
        description: "AWS region"
        required: false
        type: string
        default: "us-west-2"

permissions:
  contents: read
  id-token: write

jobs:
  scale:
    name: scale ${{ inputs.service }} to ${{ inputs.desired_count }}
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    # Inputs reach the shell only through env, never through `${{ }}` in `run:`.
    env:
      CLUSTER: ${{ inputs.cluster }}
      SERVICE: ${{ inputs.service }}
      DESIRED_COUNT: ${{ inputs.desired_count }}
      REGION: ${{ inputs.region }}
    steps:
      - name: Guard — only kortix-* clusters/services, plain names only
        run: |
          set -euo pipefail
          for v in "$CLUSTER" "$SERVICE"; do
            if ! [[ "$v" =~ ^kortix-[a-z0-9-]+$ ]]; then
              echo "::error::refusing '$v': must match ^kortix-[a-z0-9-]+$"; exit 1
            fi
          done
          [[ "$REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]$ ]] || { echo "::error::bad region '$REGION'"; exit 1; }
          [[ "$DESIRED_COUNT" =~ ^[0-9]+$ ]] || { echo "::error::bad desired_count '$DESIRED_COUNT'"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::935064898258:role/kortix-gha-ecs-deploy
          aws-region: ${{ inputs.region }}
      - name: Update desired count
        run: |
          set -euo pipefail
          aws ecs update-service --region "$REGION" \
            --cluster "$CLUSTER" --service "$SERVICE" \
            --desired-count "$DESIRED_COUNT" >/dev/null
          echo "✔ $SERVICE desired-count set to $DESIRED_COUNT"
      - name: Wait for stability
        run: |
          set -euo pipefail
          aws ecs wait services-stable --region "$REGION" \
            --cluster "$CLUSTER" --services "$SERVICE"
          aws ecs describe-services --region "$REGION" \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount}'
