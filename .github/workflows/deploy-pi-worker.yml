name: Deploy pi-worker environment

# A PERSISTENT environment for the `pi-worker` branch — not a PR preview.
#
# Why this exists: the PR-preview workflow deletes and recreates its sandbox on
# every head change, so its URL rotates on every push, its data is wiped, and
# Stripe has no stable webhook target. The pi worker is developed on a branch
# that never merges to main, so it needs a real environment of its own.
#
# The difference is lifecycle, not shape: the same self-host stack (Postgres,
# Supabase, API, gateway, frontend, Mailpit) is deployed into a sandbox that is
# created ONCE and redeployed in place. The sandbox id — and therefore the
# public URL — stays put, the Postgres volume survives, and a signed-in session
# and Stripe webhook keep working across deploys.
#
# This workflow lives on the `pi-worker` branch and is triggered by `push`, so
# GitHub runs the copy from THIS branch. Nothing on `main` has to change for it
# to work (unlike `pull_request_target`, which always uses the base branch).
on:
  push:
    branches: [pi-worker]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run the full suite inside the environment (adds ~10 min)'
        type: boolean
        default: false

concurrency:
  group: deploy-pi-worker
  # A newer push supersedes an older deploy, exactly as deploy-dev does. Queuing
  # them instead made every push wait out the one before it, so two pushes in a
  # row cost two full cycles to reach a state only the second one describes.
  # Cancelling is safe here because the environment is reused, not replaced: a
  # cancelled deploy leaves the previous stack serving, and the next `compose
  # up -d` reconciles it.
  cancel-in-progress: true

permissions:
  contents: read

env:
  BRANCH_ENV: pi-worker
  # The name this environment is reached at, the way dev.kortix.com is for dev.
  # Served by the kortix-pi-router Worker (infra/cloudflare/workers/pi-router),
  # which is re-pointed at the current sandbox on every deploy.
  PUBLIC_ORIGIN: https://pi.kortix.com

jobs:
  build-api:
    name: Build API image
    runs-on: ${{ vars.CI_RUNNER_L || 'blacksmith-8vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: apps/api/Dockerfile:linux/amd64
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/pi-api.tar
          build-args: |
            SERVICE=apps/api
            KORTIX_VERSION=pi-${{ github.sha }}
            KORTIX_COMMIT=${{ github.sha }}
          tags: kortix/kortix-api:pr-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: pi-api-${{ github.sha }}
          path: /tmp/pi-api.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-gateway:
    name: Build gateway image
    runs-on: ${{ vars.CI_RUNNER_L || 'blacksmith-8vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: apps/llm-gateway/Dockerfile:linux/amd64
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/llm-gateway/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/pi-gateway.tar
          build-args: |
            KORTIX_VERSION=pi-${{ github.sha }}
            KORTIX_COMMIT=${{ github.sha }}
          tags: kortix/kortix-gateway:pr-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: pi-gateway-${{ github.sha }}
          path: /tmp/pi-gateway.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-web:
    name: Build frontend image
    runs-on: ${{ vars.CI_RUNNER_L || 'blacksmith-8vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
        env:
          npm_config_engine_strict: "false"
      # NEXT_OUTPUT=standalone is load-bearing: without it Next emits no
      # .next/standalone and the Dockerfile COPY fails on a missing path.
      - name: Build standalone frontend
        run: pnpm --filter ./apps/web build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8008/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder-anon-key
          NEXT_PUBLIC_BILLING_ENABLED: "true"
          NEXT_PUBLIC_KORTIX_VERSION: pi-${{ github.sha }}
          NEXT_PUBLIC_KORTIX_COMMIT: ${{ github.sha }}
          NEXT_OUTPUT: standalone
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: apps/web/Dockerfile:linux/amd64
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/pi-web.tar
          build-args: |
            KORTIX_VERSION=pi-${{ github.sha }}
            KORTIX_COMMIT=${{ github.sha }}
          tags: kortix/kortix-frontend:pr-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: pi-web-${{ github.sha }}
          path: /tmp/pi-web.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy the persistent pi-worker environment
    needs: [build-api, build-gateway, build-web]
    runs-on: ${{ vars.CI_RUNNER_L || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: pi-api-${{ github.sha }}
          path: /tmp/pi-api
      - uses: actions/download-artifact@v7
        with:
          name: pi-gateway-${{ github.sha }}
          path: /tmp/pi-gateway
      - uses: actions/download-artifact@v7
        with:
          name: pi-web-${{ github.sha }}
          path: /tmp/pi-web
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish images
        run: |
          set -euo pipefail
          for archive in /tmp/pi-api/pi-api.tar /tmp/pi-gateway/pi-gateway.tar /tmp/pi-web/pi-web.tar; do
            [ -s "$archive" ] || { echo "::error::missing image archive $archive"; exit 1; }
            docker load --input "$archive"
          done
          for image in \
            "kortix/kortix-api:pr-${GITHUB_SHA}" \
            "kortix/kortix-gateway:pr-${GITHUB_SHA}" \
            "kortix/kortix-frontend:pr-${GITHUB_SHA}"; do
            docker push "$image"
          done
      - name: Hash the lockfile
        # Selects the warm sandbox template whose dependencies match this commit.
        run: echo "PREVIEW_LOCKFILE_SHA256=$(sha256sum pnpm-lock.yaml | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Deploy into the persistent sandbox
        env:
          # PREVIEW_BRANCH_ENV is what makes the deploy REUSE its sandbox
          # instead of replacing it — the whole reason the URL is stable.
          PREVIEW_BRANCH_ENV: ${{ env.BRANCH_ENV }}
          # Off by default: the suite is ~10 of the ~14 minutes a deploy takes
          # and proves nothing the stack health check does not. Run it from the
          # Actions tab with "Run the full suite" when you actually want it.
          PREVIEW_RUN_TESTS: ${{ inputs.run_tests && '1' || '0' }}
          # The stack is CONFIGURED with the stable name, not the sandbox's own
          # hostname — SITE_URL, API_EXTERNAL_URL, the Supabase redirect
          # allowlist, CORS and the frontend's public URLs all come from it, so
          # pointing them anywhere else makes every auth redirect leave the name.
          PREVIEW_PUBLIC_ORIGIN: ${{ env.PUBLIC_ORIGIN }}
          PREVIEW_PR_NUMBER: '6998'
          PREVIEW_REPOSITORY: ${{ github.repository }}
          PREVIEW_REF: ${{ github.ref }}
          PREVIEW_SHA: ${{ github.sha }}
          PREVIEW_IMAGE_TAG: pi-${{ github.sha }}
          PREVIEW_SANDBOX_PROVIDER: platinum
          PLATINUM_API_URL: https://api.platinum.dev
          PLATINUM_API_KEY: ${{ secrets.PLATINUM_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          # Stripe SANDBOX (test-mode) keys — the same pair dev runs on, so the
          # subscribe/entitlement path is exercised here exactly as it is there.
          KE2E_STRIPE_SECRET_KEY: ${{ secrets.KE2E_STRIPE_SECRET_KEY }}
          KE2E_STRIPE_WEBHOOK_SECRET: ${{ secrets.KE2E_STRIPE_WEBHOOK_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The PREVIEW_ prefix is the whole name — there are no unprefixed
          # copies of these, so dropping it silently yields empty strings and
          # applyPreviewEnvironment then refuses the deploy.
          KORTIX_GITHUB_APP_ID: ${{ secrets.PREVIEW_KORTIX_GITHUB_APP_ID }}
          KORTIX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.PREVIEW_KORTIX_GITHUB_APP_PRIVATE_KEY }}
          KORTIX_GITHUB_APP_SLUG: ${{ secrets.PREVIEW_KORTIX_GITHUB_APP_SLUG }}
          MANAGED_GIT_GITHUB_OWNER: ${{ secrets.PREVIEW_MANAGED_GIT_GITHUB_OWNER }}
          MANAGED_GIT_GITHUB_INSTALL_ID: ${{ secrets.PREVIEW_MANAGED_GIT_GITHUB_INSTALL_ID }}
        # `deploy` boots the environment AND runs the full suite inside it,
        # exiting non-zero for either. This is a development environment, so a
        # failing flow is a finding, not a broken deploy — the gate below is
        # what decides. Real infrastructure failures still land there, because
        # they leave nothing serving.
        run: bun tests/bin/sandbox-preview.ts deploy || echo "SUITE_FAILED=1" >> "$GITHUB_ENV"
      - name: Point pi.kortix.com at this sandbox
        # The sandbox id — and so its own hostname — changes whenever the box is
        # rebuilt. Re-publishing the Worker on every deploy means the stable name
        # follows it without anyone editing DNS.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APPS_EDGE_API_TOKEN }}
        run: |
          set -euo pipefail
          target="$(jq -r '.sandboxOrigin // empty' tests/test-results/preview/deployment.json)"
          [ -n "$target" ] || { echo "::error::the deploy reported no sandbox origin to point at"; exit 1; }
          echo "pointing ${PUBLIC_ORIGIN} -> ${target}"
          npx --yes wrangler@4 deploy --var "TARGET_ORIGIN:${target}"
        working-directory: infra/cloudflare/workers/pi-router
      - name: Prove the environment is serving this commit
        run: |
          set -euo pipefail
          # writeDeploymentResult writes tests/test-results/preview/deployment.json.
          result=tests/test-results/preview/deployment.json
          url="$(jq -r '.previewUrl // empty' "$result" 2>/dev/null || true)"
          [ -n "$url" ] || { echo "::error::the deploy produced no environment URL ($result)"; exit 1; }
          # Cloudflare needs a moment to roll a freshly published Worker out.
          for _ in $(seq 1 20); do
            curl -fsS --max-time 15 "${url}/v1/health" >/dev/null 2>&1 && break
            sleep 6
          done
          served="$(curl -fsS --max-time 30 "${url}/v1/health" | jq -r '.commit // empty')"
          [ "$served" = "$GITHUB_SHA" ] || {
            echo "::error::${url} serves commit ${served:-<none>}, expected ${GITHUB_SHA}"
            exit 1
          }
          {
            echo "## pi-worker environment"
            echo ""
            echo "- **URL:** ${url}"
            echo "- **Mail:** ${url}/_mailpit"
            echo "- **Tests:** ${url}/_tests/"
            echo "- **Commit:** \`${GITHUB_SHA}\` (confirmed by /v1/health)"
            echo ""
            echo "The name is stable: it survives a redeploy AND a rebuild of the sandbox."
            echo "Sandbox behind it: \`$(jq -r '.sandboxOrigin // "?"' "$result")\`"
            if [ -n "${SUITE_FAILED:-}" ]; then
              echo ""
              echo "> Some flows failed. The environment is up — see the test report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pi-worker environment: ${url}"
