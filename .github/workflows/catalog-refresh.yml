name: Catalog refresh

# Regenerates the two OFFLINE SEEDS the API boots with before its first live
# fetch — packages/llm-catalog/src/catalog.generated.json (models.dev) and
# apps/api/src/llm-gateway/models/codex-models.seed.json (the Codex CLI's
# models.json) — and merges them. Neither seed is the source of truth: the API
# refetches both every hour (runtime-catalog.ts). A seed only matters when a
# deployment cannot reach the internet, and it still sat 37 days stale
# (2026-08-25 → 2026-10-01) while this job failed every week on missing
# node_modules and, when green, left a PR nobody merged.

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate + merge
    runs-on: ${{ vars.CI_RUNNER_M || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile --filter "@kortix/llm-catalog..." --filter "kortix-api..." --filter "Kortix-Computer-Frontend..."
        env:
          npm_config_engine_strict: "false"

      - name: Regenerate the models.dev seed
        working-directory: apps/web
        run: bun scripts/enrich-llm-catalog-capabilities.ts

      - name: Regenerate the Codex lineup seed
        run: bun apps/api/src/llm-gateway/models/codex-models.ts

      - name: Diff summary
        id: diff
        run: |
          FILES=(packages/llm-catalog/src/catalog.generated.json packages/llm-catalog/src/provider-env.generated.json apps/api/src/llm-gateway/models/codex-models.seed.json)
          echo "files=${FILES[*]}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "${FILES[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Seeds unchanged."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "models.dev fetched_at: $(python3 -c 'import json;print(json.load(open("packages/llm-catalog/src/catalog.generated.json"))["fetched_at"])')"
            echo "models.dev models: $(git show HEAD:packages/llm-catalog/src/catalog.generated.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["model_count"])') → $(python3 -c 'import json;print(json.load(open("packages/llm-catalog/src/catalog.generated.json"))["model_count"])')"
            echo "codex lineup: $(python3 -c 'import json;print(", ".join(json.load(open("apps/api/src/llm-gateway/models/codex-models.seed.json"))))')"
          } | tee catalog-summary.txt

      - name: Run the seed-dependent unit tests
        if: steps.diff.outputs.changed == 'true'
        run: |
          (cd packages/llm-catalog && bun test)
          (cd apps/api && bun test --isolate --env-file=scripts/test.env src/llm-gateway/models)
          (cd apps/web && bun test src/features/session/reasoning-effort-selector.test.ts src/features/workspace/customize/sections/view/gateway)

      # Data-only change behind green tests: merge it, no human in the loop.
      - name: Open and merge the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="bot/catalog-refresh"
          git config user.name "kortix-bot"
          git config user.email "bot@kortix.ai"
          git checkout -B "$BR"
          git add ${{ steps.diff.outputs.files }}
          git commit -m "chore(catalog): refresh model seeds ($(date -u +%F))"
          git push --force origin "$BR"
          BODY="Automated daily refresh of the offline model seeds (models.dev + Codex lineup).

          $(cat catalog-summary.txt)

          The API refetches both live every hour; these seeds only cover a boot with no internet. Only generated JSON changes."
          PR="$(gh pr list --base main --head "$BR" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body "$BODY"
          else
            gh pr create --base main --head "$BR" --title "chore(catalog): refresh model seeds" --body "$BODY"
            PR="$(gh pr list --base main --head "$BR" --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$PR" --squash --delete-branch
