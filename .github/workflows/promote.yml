name: Promote to Production

# One dispatch takes a dev SHA all the way to a review-gated release PR:
#
#   dev SHA ─(job stage)─> promote/dev-<sha10> ─> PR into staging, merged here
#           (merge commit, no checks) ─> Build Staging Artifacts ─> Deploy
#           Staging ─> staging /health serves the merge SHA
#   ─(job open-release-pr)─> release/vX.Y.Z ─> PR into prod ─> `Tests - release`
#           (`full suite + quality gates`, the one required check) ─> a person
#           merges into prod.
#
# The pull request into `staging` runs no workflow: every tree check and the
# full suite run once, on the pull request into `prod` (2026-10-16, "one suite
# on promote to prod"). Dispatching this workflow is the owner's approval for
# the staging merge. Merging into prod stays a person's call.
#
# `ref: staging` (or a SHA on staging's first-parent chain) skips the dev leg:
# that is the hotfix path, staging -> prod only. `dry_run: true` prints every
# decision and changes nothing.
#
# This workflow never publishes anything. The merge into prod triggers
# deploy-prod.yml, which tags vX.Y.Z, cuts the Release, and deploys.
#
# Workflow-token rules this file depends on (the learnings ledger):
#   - A merge or push made with GITHUB_TOKEN starts no `push` workflow, and a
#     run it starts fires no `workflow_run`. So the stage job DISPATCHES
#     build-staging.yml (on ref `staging`, so its check-runs land on the merge
#     SHA), and build-staging's `dispatch-deploy` job dispatches Deploy Staging.
#   - A pull request opened with GITHUB_TOKEN holds its workflow runs in
#     `action_required`. The open-release-pr job approves them; only the PR's
#     own `Tests - release` run counts for the prod ruleset.
#
# The release branch does a `merge -s ours origin/prod` so `prod` is always an
# ancestor of the PR head → the promote PR merges cleanly every time (no VERSION
# / notes conflicts), while keeping the promoted content verbatim.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source to promote: a dev ref or SHA (default dev, runs the dev -> staging leg), or staging (hotfix: staging -> prod only)'
        required: false
        default: dev
        type: string
      dry_run:
        description: 'Print every decision (SHA, conflict, PRs, version) and change nothing'
        required: false
        default: false
        type: boolean
      title:
        description: 'Release title — one-liner for the public changelog (required unless dry_run)'
        required: false
        type: string
      notes:
        description: 'Release notes — what changed and why, markdown (required unless dry_run)'
        required: false
        type: string
      bump:
        description: 'Semver bump (ignored if an explicit version is given)'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      candidate_key:
        description: 'Optional immutable daily candidate identity (date-attempt); keeps retries from replacing another release branch'
        required: false
        type: string
      version:
        description: 'Explicit version override (e.g. 0.9.1) — optional'
        required: false
        type: string

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch build-staging; approve the release pull request's runs
  id-token: write # OIDC -> AWS Secrets Manager (Vercel bypass for the staging web /health)

jobs:
  stage:
    name: Promote dev to staging
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    # Build Staging Artifacts takes ~25 min, Deploy Staging ~20 min.
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.deploy.outputs.source_sha || steps.plan.outputs.source_sha }}
      dev_leg: ${{ steps.plan.outputs.dev_leg }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Plan the promotion
        id: plan
        env:
          INPUT_REF: ${{ inputs.ref }}
          IN_TITLE: ${{ inputs.title }}
          IN_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != true ] && { [ -z "$IN_TITLE" ] || [ -z "$IN_NOTES" ]; }; then
            echo "::error::title and notes are required unless dry_run is true."
            exit 1
          fi
          git fetch --no-tags origin dev staging prod
          REF="${INPUT_REF:-dev}"
          SHA="$(git rev-parse --verify --quiet "origin/$REF^{commit}" || git rev-parse --verify "$REF^{commit}")"
          STAGING="$(git rev-parse origin/staging)"
          echo "plan: ref=$REF sha=$SHA staging=$STAGING dry_run=$DRY_RUN"
          if [ "$REF" = staging ] || grep -qx "$SHA" < <(git rev-list --first-parent origin/staging); then
            echo "plan: $SHA is on staging -> staging-only path (hotfix): no dev leg; release source $SHA"
            { echo "dev_leg=false"; echo "source_sha=$SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$SHA" origin/staging; then
            echo "::error::$SHA is already merged into staging by an earlier promotion. Re-run with ref=staging to release the staging tip."
            exit 1
          fi
          SHA10="${SHA:0:10}"
          BRANCH="promote/dev-$SHA10"
          rc=0
          git merge-tree --write-tree origin/staging "$SHA" >/dev/null || rc=$?
          case "$rc" in
            0) CONFLICT=false ;;
            1) CONFLICT=true ;;
            *) echo "::error::git merge-tree failed (exit $rc)"; exit 1 ;;
          esac
          PR="$(gh pr list --base staging --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          PR_PLAN="new PR"; [ -z "$PR" ] || PR_PLAN="reuse open PR #$PR"
          echo "plan: dev leg: $SHA -> $BRANCH -> PR into staging ($PR_PLAN), merge commit, no checks"
          if [ "$CONFLICT" = true ]; then
            echo "plan: merge-tree reports a conflict with staging -> branch is a merge of staging and $SHA10 whose tree equals $SHA"
          else
            echo "plan: no conflict -> branch is $SHA unchanged"
          fi
          echo "plan: then dispatch build-staging.yml on staging for the merge SHA, wait for Deploy Staging, and require 8 consecutive /health reads (api, gateway, web) on the merge SHA"
          {
            echo "dev_leg=true"
            echo "sha=$SHA"
            echo "sha10=$SHA10"
            echo "branch=$BRANCH"
            echo "conflict=$CONFLICT"
            # Dry run: the release job computes the version from the current staging tip.
            echo "source_sha=$STAGING"
          } >> "$GITHUB_OUTPUT"

      - name: Push the promotion branch, open and merge the PR into staging
        id: merge
        if: steps.plan.outputs.dev_leg == 'true' && inputs.dry_run != true
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          SHA10: ${{ steps.plan.outputs.sha10 }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          CONFLICT: ${{ steps.plan.outputs.conflict }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A promotion branch is never force-pushed: a rerun reuses it.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Reusing existing $BRANCH."
          elif [ "$CONFLICT" = true ]; then
            git switch --detach origin/staging
            git merge --no-ff --no-commit "$SHA" || true
            git rev-parse -q --verify MERGE_HEAD >/dev/null || { echo "::error::git merge did not start a merge of $SHA."; exit 1; }
            git read-tree --reset -u "$SHA" # take the dev tree for every file
            git commit -m "Merge dev $SHA10 into staging"
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "$SHA:refs/heads/$BRANCH"
          fi
          git fetch --no-tags origin "$BRANCH"
          HEAD_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$CONFLICT" = true ] && [ "$(git rev-parse "$HEAD_SHA^{tree}")" != "$(git rev-parse "$SHA^{tree}")" ]; then
            echo "::error::$BRANCH ($HEAD_SHA) tree differs from $SHA."
            exit 1
          fi
          if [ "$CONFLICT" != true ] && [ "$HEAD_SHA" != "$SHA" ]; then
            echo "::error::$BRANCH points at $HEAD_SHA, expected $SHA."
            exit 1
          fi

          PR="$(gh pr list --base staging --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            gh pr create --base staging --head "$BRANCH" \
              --title "Promote dev $SHA10 to staging" \
              --body "Promotes dev \`$SHA\` to staging. Opened and merged by Promote to Production run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. This PR runs no checks: the one suite runs on the release PR into \`prod\`."
            PR="$(gh pr list --base staging --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi
          echo "Promotion PR #$PR ($BRANCH @ $HEAD_SHA)."
          # Merge commit, never squash: the release notes and the migration cost
          # pass are verified against these SHAs. GitHub computes mergeability
          # asynchronously, so retry for up to 2 min.
          merged=""
          for _ in $(seq 1 12); do
            if gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"; then merged=1; break; fi
            sleep 10
          done
          [ -n "$merged" ] || { echo "::error::Could not merge promotion PR #$PR."; exit 1; }
          MERGE_SHA="$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid')"
          git fetch --no-tags origin staging
          [ "$(git rev-parse origin/staging)" = "$MERGE_SHA" ] || {
            echo "::error::staging is not at the merge commit $MERGE_SHA."; exit 1;
          }
          echo "Merged PR #$PR into staging as $MERGE_SHA."
          { echo "merge_sha=$MERGE_SHA"; echo "pr=$PR"; } >> "$GITHUB_OUTPUT"

      - name: Check out the aws-env action
        if: steps.merge.outputs.merge_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read the Vercel bypass from AWS Secrets Manager
        if: steps.merge.outputs.merge_sha != ''
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            VERCEL_BYPASS=kortix-ci-env:VERCEL_AUTOMATION_BYPASS_SECRET

      - name: Build and deploy staging, wait until it serves the merge SHA
        id: deploy
        if: steps.merge.outputs.merge_sha != ''
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          wait_run() { # <run id> <label> <timeout min>
            local id="$1" label="$2" deadline=$(( $(date +%s) + $3 * 60 )) state
            while :; do
              state="$(gh run view "$id" --json status,conclusion --jq '.status + "/" + (.conclusion // "")')"
              case "$state" in
                completed/success) echo "$label run $id succeeded."; return 0 ;;
                completed/*) echo "::error::$label run $id finished $state."; exit 1 ;;
              esac
              [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::$label run $id still $state after $3 min."; exit 1; }
              sleep 30
            done
          }
          find_run() { # <workflow> <since> [head sha]; $3 is optional, so read it as ${3:-} under set -u
            local id=""
            for _ in $(seq 1 30); do
              id="$(gh run list --workflow "$1" --event workflow_dispatch --limit 20 \
                --json databaseId,headSha,createdAt \
                --jq "[.[] | select(.createdAt >= \"$2\" and (\"${3:-}\" == \"\" or .headSha == \"${3:-}\"))] | sort_by(.createdAt) | .[0].databaseId // empty")"
              [ -n "$id" ] && { echo "$id"; return 0; }
              sleep 10
            done
            echo "::error::No $1 run created since $2." >&2
            exit 1
          }

          # A merge made with GITHUB_TOKEN starts no push workflow, so dispatch
          # the build. Ref `staging` puts its check-runs on the merge SHA, which
          # the release preflight reads. Its dispatch-deploy job starts Deploy Staging.
          T0="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run build-staging.yml --ref staging -f sha="$MERGE_SHA"
          BUILD="$(find_run build-staging.yml "$T0" "$MERGE_SHA")"
          echo "Build Staging Artifacts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BUILD"
          wait_run "$BUILD" "Build Staging Artifacts" 60
          DEPLOY="$(find_run deploy-staging.yml "$T0")"
          echo "Deploy Staging: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$DEPLOY"
          wait_run "$DEPLOY" "Deploy Staging" 45

          # One health read during a rolling deploy proves nothing: require 8
          # consecutive reads where api, gateway, and web all serve the SHA.
          read_commit() { curl -fsS --max-time 15 "$@" 2>/dev/null | jq -r '.commit // "none"' 2>/dev/null || echo none; }
          ok=0
          deadline=$(( $(date +%s) + 20 * 60 ))
          while [ "$ok" -lt 8 ]; do
            api="$(read_commit https://staging-api.kortix.com/v1/health)"
            gw="$(read_commit https://gateway-staging.kortix.com/health/live)"
            web="$(read_commit -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" https://staging.kortix.com/api/health)"
            if [ "$api" = "$MERGE_SHA" ] && [ "$gw" = "$MERGE_SHA" ] && [ "$web" = "$MERGE_SHA" ]; then ok=$((ok + 1)); else ok=0; fi
            echo "health: api=${api:0:10} gateway=${gw:0:10} web=${web:0:10} consecutive=$ok/8"
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::staging did not serve $MERGE_SHA on all three surfaces within 20 min."; exit 1; }
            [ "$ok" -ge 8 ] || sleep 15
          done
          echo "Staging serves $MERGE_SHA."
          echo "source_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

  open-release-pr:
    name: Open review-gated release PR
    needs: stage
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      SOURCE_SHA: ${{ needs.stage.outputs.source_sha }}
    steps:
      - name: Checkout the release source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.stage.outputs.source_sha }}
          fetch-depth: 0

      - name: Compute next version (from what's live on prod)
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin prod >/dev/null 2>&1 || true
          # Source of truth for "what's released" = VERSION on prod. Falls back
          # to the ref's VERSION only if prod has none (first-ever release).
          BASE="$(git show origin/prod:VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          [ -n "$BASE" ] || BASE="$(tr -d '[:space:]' < VERSION)"
          echo "Currently live on prod: $BASE"

          EXPLICIT="$INPUT_VERSION"
          if [ -n "$EXPLICIT" ]; then
            NEW="${EXPLICIT#v}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            : "${MAJOR:=0}"; : "${MINOR:=0}"; : "${PATCH:=0}"
            case "$INPUT_BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "$NEW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Computed version '$NEW' is not X.Y.Z" >&2; exit 1; }

          {
            echo "base=$BASE"
            echo "new=$NEW"
            echo "tag=v$NEW"
          } >> "$GITHUB_OUTPUT"
          echo "Proposing v$NEW"

      - name: Pre-flight — refuse to promote unless the staging images exist
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_LEG: ${{ needs.stage.outputs.dev_leg }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE_SHA="$(git rev-parse HEAD)"
          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "Release image source @ $IMAGE_SHA"
          if [ "$DRY_RUN" = true ] && [ "$DEV_LEG" = true ]; then
            echo "plan: the merge into staging does not exist in a dry run; the real run requires the three staging manifest publishes on the merge SHA."
            exit 0
          fi
          # deploy-prod retags the `staging-<sha>` images and never rebuilds, so
          # the three manifest publishes must be `success` on this exact commit
          # (a skip does not count). Nothing else on staging is a gate: the one
          # suite and every tree check run on the release PR into prod.
          # FAIL CLOSED: a failed `gh api` call or a missing check is not green.
          # The latest run per name wins; this run's own checks are excluded.
          check_green() {
            local sha="$1" raw latest missing=""
            if ! raw="$(RID="$RUN_ID" gh api "repos/${REPOSITORY}/commits/${sha}/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select((.details_url // "") | contains("/runs/" + env.RID + "/") | not)')"; then
              echo "::error::Refusing to promote — cannot read the check-runs of ${sha} (gh api failed)."
              return 1
            fi
            latest="$(jq -s 'group_by(.name) | map(max_by(.started_at // ""))' <<<"$raw")"
            for name in "Publish API manifest (staging)" "Publish gateway manifest (staging)" "Publish frontend manifest (staging)"; do
              jq -e --arg n "$name" 'any(.[]; .name == $n and .conclusion == "success")' <<<"$latest" >/dev/null || missing="$missing '$name'"
            done
            if [ -n "$missing" ]; then
              echo "::error::Refusing to promote — required check(s)${missing} missing or not successful on ${sha}. Run build-staging.yml for it first."
              return 1
            fi
            echo "✓ The staging images exist for ${sha}."
          }
          if ! check_green "$IMAGE_SHA"; then
            [ "$DRY_RUN" = true ] || exit 1
            echo "dry run: the real run would stop here."
          fi

      - name: Freeze release branch + open PR into prod
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TITLE: ${{ inputs.title }}
          IN_NOTES: ${{ inputs.notes }}
          RELEASE_NEW: ${{ steps.ver.outputs.new }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ steps.preflight.outputs.image_sha }}
          CANDIDATE_KEY: ${{ inputs.candidate_key }}
        run: |
          set -euo pipefail
          NEW="$RELEASE_NEW"
          TAG="$RELEASE_TAG"
          RELBR="release/$TAG"
          if [ -n "$CANDIDATE_KEY" ]; then
            [[ "$CANDIDATE_KEY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[1-3]$ ]] || { echo 'Invalid daily candidate identity'; exit 1; }
            RELBR="$RELBR-daily-$CANDIDATE_KEY"
          fi
          # The image source is the staged source commit whose immutable images
          # passed the staging build.
          SRC_SHA="$RELEASE_SOURCE_SHA"

          if [ "$DRY_RUN" = true ]; then
            existing="$(gh pr list --base prod --head "$RELBR" --state open --json number --jq '.[0].number // empty' || true)"
            echo "plan: release branch $RELBR = release source + merge -s ours origin/prod; VERSION=$NEW; RELEASE_SOURCE_SHA = the staging merge SHA (dev leg) or ${SRC_SHA} (staging-only)"
            PR_PLAN="open a new PR"; [ -z "$existing" ] || PR_PLAN="refuse existing immutable $RELBR; inspect PR #$existing"
            echo "plan: PR into prod: $PR_PLAN; approve its held runs (Tests - release + tree checks)"
            echo "dry run: nothing changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Branch off the promoted ref, then record prod as a merged ancestor
          # WITHOUT taking its content (`-s ours`). This guarantees the PR into
          # prod is a clean fast-forward-able merge — no VERSION/notes conflicts,
          # ever — while the tree stays exactly the promoted ref's content.
          if git ls-remote --exit-code --heads origin "$RELBR" >/dev/null; then
            echo "::error::$RELBR already exists. Release candidates are immutable; inspect the existing PR or choose a new version."
            exit 1
          fi
          git checkout -b "$RELBR"
          git merge -s ours --no-edit origin/prod -m "chore(release): supersede prod with $TAG"

          # Stamp the clean version + carry the human release entry as a committed
          # file. deploy-prod.yml reads these AFTER the merge to publish — nothing
          # is published here.
          printf '%s\n' "$NEW" > VERSION
          printf '%s\n\n%s\n' "$IN_TITLE" "$IN_NOTES" > RELEASE_NOTES.md
          printf '%s\n' "$SRC_SHA" > RELEASE_SOURCE_SHA

          git add VERSION RELEASE_NOTES.md RELEASE_SOURCE_SHA
          git commit -m "release: $TAG"
          git push origin "HEAD:refs/heads/$RELBR"

          existing="$(gh pr list --base prod --head "$RELBR" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            echo "Release PR #$existing already open for $RELBR."
          else
            printf '%s\n\n%s\n\n---\n_Merging this PR **publishes %s**: tags it, cuts the GitHub Release, retags the tested images, and deploys ECS Fargate. Nothing is published until this merges._\n' \
              "$IN_TITLE" "$IN_NOTES" "$TAG" \
              | gh pr create --base prod --head "$RELBR" --title "Release $TAG — $IN_TITLE" --body-file -
          fi

          # Approve the release PR's runs here. This step opens the pull request
          # with the workflow token, so GitHub holds every pull_request run on it
          # (`action_required`) until someone approves it: tests-release.yml and
          # the tree checks (ci, codeql, db-migrations, …). Only the PR's own
          # `full suite + quality gates` check counts for the `prod` ruleset:
          # v0.13.57's dispatched gate passed on the same SHA and the pull request
          # stayed BLOCKED. Approval starts attempt 2.
          HEAD_SHA="$(git rev-parse HEAD)"
          held=""
          for _ in $(seq 1 30); do
            held="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests-release.yml/runs?event=pull_request&head_sha=$HEAD_SHA" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required")][0].id // empty')"
            [ -n "$held" ] && break
            sleep 5
          done
          if [ -n "$held" ] && gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$held/approve" >/dev/null; then
            echo "Approved release gate run $held on $RELBR ($HEAD_SHA)."
          else
            echo "::warning::Approve the release gate run yourself: gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/${held:-<run id>}/approve"
          fi
          sleep 15
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id'); do
            if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" >/dev/null; then
              echo "Approved run $run on $RELBR."
            else
              echo "::warning::Approve run $run yourself: gh api -X POST repos/$GITHUB_REPOSITORY/actions/runs/$run/approve"
            fi
          done

      - name: Summary
        if: inputs.dry_run != true
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_BASE: ${{ steps.ver.outputs.base }}
          RELEASE_NEW: ${{ steps.ver.outputs.new }}
        run: |
          {
            echo "### Release PR opened — \`$RELEASE_TAG\`"
            echo ""
            echo "- Live on prod: \`$RELEASE_BASE\`"
            echo "- Proposed version: \`$RELEASE_NEW\`"
            echo "- staging \`$SOURCE_SHA\` → \`release/$RELEASE_TAG\` → PR into \`prod\`"
            echo ""
            echo "_Nothing is published yet. A reviewer merges the PR once \`full suite + quality gates\` is green; the **merge** publishes the version (tag + GitHub Release + ECS roll + frontend)._"
          } >> "$GITHUB_STEP_SUMMARY"
