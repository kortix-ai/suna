name: Capture Build

# Kortix Capture installers: test, build, sign, VERIFY on a real OS runner, and
# collect. Reusable: capture.yml (dev) and deploy-prod.yml (release) call it.
# Nothing here publishes. The caller publishes the `capture-installers` artifact.
#
#   windows-msi  build the .msi, install it silently with a made-up enrollment
#                token, prove enrollment, recording, upload, kill recovery,
#                in-place upgrade and clean uninstall (unsigned: no Windows
#                signing certificate exists in kortix-ci-env)
#   macos-pkg    build the universal .pkg, sign and notarize it with the desktop
#                app's Apple secrets, install it as IT would, prove the same
#   linux-deb    build the .deb, install it into a real logind X11 session,
#                prove the same, purge
#   collect      stable + versioned names, CAPTURE-SHA256SUMS, capture-update.json
#
# The ephemeral enrollment issuer and S3 are local (scripts/ci_fake_issuer.py +
# versitygw). The runbook is .agents/skills/kortix-capture/references/release-runbook.md.

on:
  workflow_call:
    inputs:
      tag:
        description: "Version tag baked into the binaries and installers: vX.Y.Z (release) or vX.Y.Z-dev.N (dev)"
        required: true
        type: string
      channel:
        description: "stable or dev"
        required: true
        type: string
      issuer_url:
        description: "Kortix API base URL baked in as the default sign-in issuer"
        required: true
        type: string
      release_tag:
        description: "Git tag of the GitHub release that will hold the assets (vX.Y.Z or capture-dev-latest); used for the URLs in capture-update.json"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/capture
    env:
      # Never the runner's login Keychain or Secret Service.
      KORTIX_CAPTURE_KEY_STORE: file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/capture
          key: capture-test-${{ matrix.name }}
      - name: Linux system packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pkg-config libxi-dev libxtst-dev libx11-dev libxrandr-dev libxcb1-dev libxdo-dev libxss-dev \
            libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: UI tests (node)
        run: node --test ui/memory/*.test.mjs
      - name: Engine protocol, library and enrollment tests
        if: matrix.name != 'windows'
        run: |
          cargo test --release --features capture-engine --test capture_engine_protocol
          cargo test --release --features capture-engine --lib
          cargo test --release --features capture-engine --test enrollment
          cargo test --release --features capture-engine --test capture_format
      # Some library tests assert Unix paths (service::tests::the_packaged_app_*): on
      # Windows run the protocol, managed (enrollment, tray, machine service) and format suites.
      - name: Engine protocol, managed and enrollment tests (Windows)
        if: matrix.name == 'windows'
        run: |
          cargo test --release --features capture-engine --test capture_engine_protocol
          cargo test --release --features capture-engine --lib managed
          cargo test --release --features capture-engine --test enrollment
          cargo test --release --features capture-engine --test capture_format
      - name: Tray tests (Linux AppIndicator)
        if: matrix.name == 'linux'
        run: cargo test --release --features capture-engine,tray-linux --lib managed
      # versitygw: an S3 gateway that verifies SigV4 and checksums (Linux only).
      # KNOWN RED at kortix-ai/capture a9b879f: device_status_and_policy_files and
      # settings_window_sets_up_syncs_restores_and_forgets_like_the_cli fail (the app lane
      # owns them). Non-blocking until they pass; then delete continue-on-error.
      - name: Cloud sync against a real S3 gateway
        if: matrix.name == 'linux'
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/s3gw"; mkdir -p "$d"
          curl -sSfL https://github.com/versity/versitygw/releases/download/v1.8.0/versitygw_v1.8.0_Linux_x86_64.tar.gz | tar -xz -C "$d"
          export KORTIX_CAPTURE_TEST_VERSITYGW="$(find "$d" -name versitygw -type f | head -1)"
          test -x "$KORTIX_CAPTURE_TEST_VERSITYGW"
          cargo test --release --features capture-engine --test sync_s3 -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sync_s3.log"
          # Every sync test ran (none skipped for a missing gateway).
          n=$(grep -oE "test result: ok\. [0-9]+ passed; 0 failed" "$RUNNER_TEMP/sync_s3.log" | grep -oE "[0-9]+" | head -1)
          [ "${n:-0}" -ge 18 ] && ! grep -q "^skipped:" "$RUNNER_TEMP/sync_s3.log"

  windows-msi:
    name: Windows MSI (build and verify)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            # GitHub's runner has an interactive desktop (session 2); Blacksmith's has none.
            runner: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
        working-directory: apps/capture
    env:
      EV: ${{ github.workspace }}\evidence
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/capture
          key: capture-msi
      - name: Environment facts
        run: |
          New-Item -ItemType Directory -Force $env:EV | Out-Null
          @{
            os = [System.Environment]::OSVersion.VersionString
            runner_user = "$env:USERDOMAIN\$env:USERNAME"
            runner_session = (Get-Process -Id $PID).SessionId
            console_user = (Get-CimInstance Win32_ComputerSystem).UserName
            sessions = (query user 2>&1 | Out-String)
          } | ConvertTo-Json | Tee-Object "$env:EV\env.json"
          exit 0  # `query user` exits 1 by design
      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      # Authenticode via Microsoft Artifact Signing (Trusted Signing). Every key is optional:
      # without them the binaries and the MSI are unsigned and Windows SmartScreen warns
      # whoever runs a downloaded installer ("unrecognized app").
      - name: Read Windows signing credentials from AWS Secrets Manager
        continue-on-error: true
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            AZURE_SIGNING_TENANT_ID?
            AZURE_SIGNING_CLIENT_ID?
            AZURE_SIGNING_CLIENT_SECRET?
            AZURE_SIGNING_ENDPOINT?
            AZURE_SIGNING_ACCOUNT?
            AZURE_SIGNING_PROFILE?
      - name: Windows signing on or off
        id: winsign
        shell: bash
        run: |
          if [ -n "${AZURE_SIGNING_CLIENT_SECRET:-}" ] && [ -n "${AZURE_SIGNING_ENDPOINT:-}" ] && [ -n "${AZURE_SIGNING_PROFILE:-}" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"; echo "Windows signing: Artifact Signing ($AZURE_SIGNING_ACCOUNT/$AZURE_SIGNING_PROFILE)"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows installers are unsigned: no AZURE_SIGNING_* in kortix-ci-env. SmartScreen warns on a downloaded MSI."
          fi
      - name: Build the binaries
        env:
          KORTIX_RELEASE_TAG: ${{ inputs.tag }}
          KORTIX_DEFAULT_ISSUER_URL: ${{ inputs.issuer_url }}
        run: |
          # The update public key (apps/capture/update-public-key.txt, public) is compiled in; without it the app never updates.
          if (Test-Path update-public-key.txt) { $env:KORTIX_CAPTURE_UPDATE_PUBLIC_KEY = (Get-Content update-public-key.txt -Raw).Trim() }
          cargo build --release --features native-recorders --bin kortix-capture --bin kortix-capture-engine --bin kortix-backend
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          python scripts/install_privacy_runtime.py --platform windows-x86_64 --destination target/release
          if ($LASTEXITCODE -ne 0) { throw "install_privacy_runtime failed" }
      - name: Sign the binaries (Authenticode)
        if: steps.winsign.outputs.on == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ env.AZURE_SIGNING_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\apps\capture\target\release
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build the release MSI and the next-version MSI (for the upgrade)
        run: |
          ./installer/windows/build-msi.ps1 -Stage target/release -Version $env:TAG -Out "$env:RUNNER_TEMP\msi\KortixCapture-$($env:TAG)-x64.msi"
          # The upgrade check installs the next patch version over the release one.
          $v = ($env:TAG -replace '^v', '' -replace '[-+].*$', '').Split('.')
          $next = "$($v[0]).$($v[1]).$([int]$v[2] + 1)"
          "NEXT_VERSION=$next" | Add-Content $env:GITHUB_ENV
          ./installer/windows/build-msi.ps1 -Stage target/release -Version "v$next" -Out "$env:RUNNER_TEMP\msi\KortixCapture-next.msi"
      - name: Sign the MSIs (Authenticode)
        if: steps.winsign.outputs.on == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ env.AZURE_SIGNING_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}\msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: The signatures are valid
        if: steps.winsign.outputs.on == 'true'
        run: |
          foreach ($f in (Get-ChildItem target/release/*.exe) + (Get-ChildItem "$env:RUNNER_TEMP\msi\*.msi")) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)" | Tee-Object -Append "$env:EV\authenticode.txt"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($sig.Status)" }
          }
      - name: The release binaries carry no update test hook
        run: |
          $hit = Select-String -Path target/release/kortix-capture.exe -Pattern "127.0.0.1:8899" -SimpleMatch -Quiet
          "test manifest URL in the release binary: $([bool]$hit)" | Tee-Object "$env:EV\no_test_hook.txt"
          if ($hit) { throw "the release binary contains the updater's test manifest URL" }
      - name: The exes need no Visual C++ Redistributable
        shell: python
        run: |
          # A Windows computer without it has no vcruntime140.dll: an exe that imports it does not
          # start, and the MSI's service start failed with error 1920 (the C runtime is linked
          # statically, apps/capture/.cargo/config.toml).
          import subprocess, sys
          subprocess.run([sys.executable, "-m", "pip", "install", "--quiet", "pefile"], check=True)
          import pefile
          bad = {}
          for exe in ["kortix-capture.exe", "kortix-capture-engine.exe", "kortix-backend.exe"]:
              pe = pefile.PE(f"target/release/{exe}")
              dlls = sorted(e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT)
              print(exe, dlls)
              hit = [d for d in dlls if d.startswith(("vcruntime", "msvcp", "api-ms-win-crt", "ucrtbase"))]
              if hit:
                  bad[exe] = hit
          assert not bad, f"these exes need the Visual C++ runtime: {bad}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-installer-windows
          path: ${{ runner.temp }}\msi\KortixCapture-${{ inputs.tag }}-x64.msi
          if-no-files-found: error
      - name: S3 (versitygw) and the CI stand-in for Kortix
        run: |
          # versitygw: the S3 gateway the Linux sync tests use (verifies SigV4 and checksums).
          # Windows has no xattrs: versitygw keeps object metadata (checksums, ETags) in a sidecar directory.
          $d = "$env:RUNNER_TEMP\s3"; New-Item -ItemType Directory -Force "$d\data", "$d\meta" | Out-Null
          gh release download v1.8.0 --repo versity/versitygw -p "versitygw_v1.8.0_Windows_x86_64.zip" -D $d
          Expand-Archive "$d\versitygw_v1.8.0_Windows_x86_64.zip" -DestinationPath "$d\bin"
          $gw = (Get-ChildItem "$d\bin" -Recurse -Filter versitygw.exe | Select-Object -First 1).FullName
          # The runner ends every process a step started when the step ends: the
          # gateway and the CI issuer run as scheduled tasks (SYSTEM) to outlive it.
          function Start-Detached($name, $cmdline) {
            $cmd = "$env:RUNNER_TEMP\$name.cmd"
            "@echo off`r`n$cmdline" | Set-Content $cmd -Encoding ascii
            schtasks /Create /TN $name /TR "`"$cmd`"" /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F | Out-Null
            schtasks /Run /TN $name | Out-Null
          }
          Start-Detached "kcap-s3" "`"$gw`" --port 127.0.0.1:9000 --access cikortix --secret cikortix-secret-123 posix --sidecar `"$d\meta`" `"$d\data`" > `"$env:EV\versitygw.out.log`" 2> `"$env:EV\versitygw.err.log`""
          Start-Sleep 3
          $token = "kortix_enr_ci" + [guid]::NewGuid().ToString("N")
          "::add-mask::$token"
          "KORTIX_URL_FOR_MSI=http://127.0.0.1:8787" | Add-Content $env:GITHUB_ENV
          "TOKEN_FOR_MSI=$token" | Add-Content $env:GITHUB_ENV
          # The stand-in creates the bucket, then serves enroll + credentials.
          $py = (Get-Command python).Source
          $script = (Resolve-Path scripts/ci_fake_issuer.py).Path
          Start-Detached "kcap-issuer" "`"$py`" `"$script`" --port 8787 --token $token --log `"$env:EV\issuer.jsonl`" --s3-endpoint http://127.0.0.1:9000 --bucket capture --access-key cikortix --secret-key cikortix-secret-123 2> `"$env:EV\issuer.err.log`""
          $t0 = Get-Date; $up = $false
          while (-not $up -and ((Get-Date) - $t0).TotalSeconds -lt 30) {
            Start-Sleep 2
            try { Invoke-WebRequest -Method Post http://127.0.0.1:8787/v1/nothing -SkipHttpErrorCheck | Out-Null; $up = $true } catch {}
          }
          if (-not $up) { Get-Content "$env:EV\issuer.err.log", "$env:EV\versitygw.err.log" -ErrorAction SilentlyContinue; throw "the CI issuer did not start" }
          # The organization's notice: the app shows one only when the policy has one.
          $acct = "00000000-0000-4000-8000-00000000c1c1"
          New-Item -ItemType Directory -Force "$d\data\capture\orgs\$acct" | Out-Null
          Set-Content "$d\data\capture\orgs\$acct\policy.json" '{"schema": 2, "notice": "Recorded for the CI verification."}'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: A manual install (no properties) never rolls back, and the service runs
        run: |
          # Double-clicked or `msiexec /i … /qn` without KORTIX_URL and ENROLLMENT_TOKEN.
          $msi = "$env:RUNNER_TEMP\msi\KortixCapture-$($env:TAG)-x64.msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/l*v", "`"$env:EV\msi-manual.log`"" -Wait -PassThru
          $t0 = Get-Date
          while ((Get-Service KortixCapture -ErrorAction SilentlyContinue).Status -ne 'Running' -and ((Get-Date) - $t0).TotalSeconds -lt 30) { Start-Sleep 1 }
          $svc = Get-CimInstance Win32_Service -Filter "Name='KortixCapture'"
          $state = @{ exit = $p.ExitCode; state = $svc.State; start_mode = $svc.StartMode; exe = Test-Path "${env:ProgramFiles}\Kortix\Capture\kortix-capture.exe" }
          $u = Start-Process msiexec.exe -ArgumentList "/x", "`"$msi`"", "/qn" -Wait -PassThru
          $state.uninstall_exit = $u.ExitCode
          $state | ConvertTo-Json | Tee-Object "$env:EV\manual_install.json"
      - name: Install silently as IT would
        run: |
          # The screen changes every second: the recorder saves a frame only when it changed.
          # (A scheduled task in the person's session: it outlives this step.)
          $clock = "$env:RUNNER_TEMP\clock.ps1"
          "`$host.UI.RawUI.WindowTitle = 'KORTIX CAPTURE MSI VERIFY'; while (`$true) { Clear-Host; 'KORTIX CAPTURE MSI VERIFY'; Get-Date -Format 'HH:mm:ss.fff'; Start-Sleep 1 }" | Set-Content $clock
          schtasks /Create /TN kcap-clock /TR "powershell.exe -NoExit -ExecutionPolicy Bypass -File `"$clock`"" /SC ONCE /ST 23:59 /RU "$env:USERDOMAIN\$env:USERNAME" /IT /F | Out-Null
          schtasks /Run /TN kcap-clock | Out-Null
          $msi = "$env:RUNNER_TEMP\msi\KortixCapture-$($env:TAG)-x64.msi"
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/l*v", "`"$env:EV\msi-install.log`"", "KORTIX_URL=$env:KORTIX_URL_FOR_MSI", "ENROLLMENT_TOKEN=$env:TOKEN_FOR_MSI" -Wait -PassThru
          "msiexec exit: $($p.ExitCode)" | Tee-Object "$env:EV\install.txt"
          if ($p.ExitCode -ne 0) { throw "msiexec failed: $($p.ExitCode)" }
          # The token never reaches the MSI log (Hidden property).
          "token in msi log: $([bool](Select-String -Path "$env:EV\msi-install.log" -Pattern $env:TOKEN_FOR_MSI -SimpleMatch -Quiet))" | Tee-Object -Append "$env:EV\install.txt"
          $svc = Get-CimInstance Win32_Service -Filter "Name='KortixCapture'"
          @{ state = $svc.State; start_mode = $svc.StartMode; account = $svc.StartName; path = $svc.PathName } | ConvertTo-Json | Tee-Object "$env:EV\service.json"
          sc.exe qfailure KortixCapture | Out-File "$env:EV\service_failure.txt"
          $key = "HKLM:\SOFTWARE\Policies\Kortix\Capture"
          $acl = Get-Acl $key
          @{
            protected = $acl.AreAccessRulesProtected
            identities = @($acl.Access | ForEach-Object { "$($_.IdentityReference)" } | Sort-Object -Unique)
            url = (Get-ItemProperty $key).Url
          } | ConvertTo-Json | Tee-Object "$env:EV\policy_key.json"
          # A standard user cannot read the key: log on as one and try.
          # 14 characters: `net user` asks for confirmation above that, and fails without a console.
          $pw = "Kc1-" + [guid]::NewGuid().ToString("N").Substring(0, 10)
          net user kcapstd $pw /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "net user /add failed" }
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class KcLogon { [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)] public static extern bool LogonUser(string user, string domain, string password, int type, int provider, out IntPtr token); }'
          $tok = [IntPtr]::Zero
          if (-not [KcLogon]::LogonUser("kcapstd", $env:COMPUTERNAME, $pw, 2, 0, [ref]$tok)) { throw "LogonUser failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
          $h = New-Object Microsoft.Win32.SafeHandles.SafeAccessTokenHandle $tok
          $read = [System.Security.Principal.WindowsIdentity]::RunImpersonated($h, [Func[string]] {
            try {
              $k = [Microsoft.Win32.RegistryKey]::OpenBaseKey("LocalMachine", "Registry64").OpenSubKey("SOFTWARE\Policies\Kortix\Capture")
              if ($k) { "read: token=" + [bool]$k.GetValue("EnrollmentToken") } else { "read: no key" }
            } catch { $b = $_.Exception.GetBaseException(); "error: " + $b.GetType().Name + ": " + $b.Message }
          })
          "standard user: $read" | Tee-Object -Append "$env:EV\install.txt"
          net user kcapstd /delete | Out-Null
      - name: The signed-in person is enrolled and recorded
        run: |
          $k = "${env:ProgramFiles}\Kortix\Capture\kortix-capture.exe"
          $t0 = Get-Date; $state = $null
          while (((Get-Date) - $t0).TotalSeconds -lt 240) {
            $state = Get-Content "$env:ProgramData\Kortix\Capture\machine.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            if ($state.sessions | Where-Object { $_.state -eq "recording" }) { break }
            Start-Sleep 5
          }
          $state | ConvertTo-Json -Depth 6 | Tee-Object "$env:EV\machine_recording.json"
          # Frames in the signed-in person's own library (this step runs as that person).
          $t0 = Get-Date
          while (((& $k --json status | ConvertFrom-Json).counts.frames -lt 10) -and ((Get-Date) - $t0).TotalSeconds -lt 240) { Start-Sleep 5 }
          & $k --json status | Set-Content "$env:EV\user_status.json"
          & $k --json sync status | Set-Content "$env:EV\user_sync.json"
          & $k --json machine status | Set-Content "$env:EV\machine_status.json"
          & $k --json start | Set-Content "$env:EV\start_when_managed.json"
          & $k stop 2>&1 | Out-File "$env:EV\stop_when_managed.txt"
          "stop exit: $LASTEXITCODE" | Add-Content "$env:EV\stop_when_managed.txt"
          Get-CimInstance Win32_Process -Filter "Name='kortix-capture.exe' OR Name='kortix-capture-engine.exe' OR Name='kortix-backend.exe'" | ForEach-Object {
            $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
            [pscustomobject]@{ pid = $_.ProcessId; name = $_.Name; session = $_.SessionId; owner = "$($o.Domain)\$($o.User)"; cmd = $_.CommandLine }
          } | ConvertTo-Json | Tee-Object "$env:EV\processes.json"
          Start-Sleep 5
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:EV\desktop_with_tray.png")
          exit 0  # `stop` exits 1 on a managed computer by design; the Assert step checks it
      - name: The Start menu entry opens the window for a person without admin rights
        run: |
          # The MSI's shortcut, run exactly as it is (target and arguments).
          $lnk = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Kortix Capture.lnk" | Select-Object -First 1
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName)
          # The runner's user is an administrator with UAC off. People on a managed computer are not:
          # a basic-user token (Administrators deny-only) cannot write to Program Files.
          $before = @(Get-Process kortix-capture -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          # `start /min`: the shortcut's own show state (minimized, it hides the console a click opens).
          runas /trustlevel:0x20000 "cmd.exe /c start `"`" /min `"$($sc.TargetPath)`" $($sc.Arguments)"
          function Window { Get-Process kortix-capture -ErrorAction SilentlyContinue | Where-Object { $_.Id -notin $before -and $_.MainWindowTitle } | Select-Object -First 1 }
          $t0 = Get-Date; $w = $null
          while (-not $w -and ((Get-Date) - $t0).TotalSeconds -lt 60) { Start-Sleep 1; $w = Window }
          Start-Sleep 10
          $w2 = Window
          $webview = if ($w2) { @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe' AND ParentProcessId=$($w2.Id)").Count } else { 0 }
          $cmd = if ($w2) { (Get-CimInstance Win32_Process -Filter "ProcessId=$($w2.Id)").CommandLine } else { $null }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:EV\start_menu_window.png")
          Copy-Item "$env:APPDATA\ai.kortix.capture\logs\ui.log" "$env:EV\ui.log" -ErrorAction SilentlyContinue
          # A second click while the window is open: the same window comes forward, no second one.
          runas /trustlevel:0x20000 "cmd.exe /c start `"`" /min `"$($sc.TargetPath)`" $($sc.Arguments)"
          Start-Sleep 10
          $windows = @(Get-Process kortix-capture -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -eq "Kortix Capture" }).Count
          @{
            shortcut = "$($sc.TargetPath) $($sc.Arguments)"
            title = if ($w2) { $w2.MainWindowTitle } else { $null }
            same_process_after_10s = [bool]($w -and $w2 -and $w.Id -eq $w2.Id)
            cmd = $cmd
            webview_processes = $webview
            profile_in_program_files = Test-Path "$env:ProgramFiles\Kortix\Capture\kortix-capture.exe.WebView2"
            profile_in_local_app_data = Test-Path "$env:LOCALAPPDATA\Kortix\WebView2\EBWebView"
            ui_log = Test-Path "$env:EV\ui.log"
            windows_after_second_click = $windows
            still_open_after_second_click = [bool]($w2 -and -not $w2.HasExited)
          } | ConvertTo-Json | Tee-Object "$env:EV\start_menu_window.json"
          if ($w2) { $null = $w2.CloseMainWindow() }
      - name: Uploads reach the bucket under the device's folder
        run: |
          $prefix = "orgs/00000000-0000-4000-8000-00000000c1c1/0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b/"
          $s3 = @("scripts/ci_fake_issuer.py", "--s3-endpoint", "http://127.0.0.1:9000", "--bucket", "capture", "--access-key", "cikortix", "--secret-key", "cikortix-secret-123", "--list", $prefix)
          $t0 = Get-Date
          do {
            Start-Sleep 10
            $keys = python @s3 2>&1 | Out-String
          } while (-not (($keys -match "manifest\.json") -and ($keys -match "status\.json")) -and ((Get-Date) - $t0).TotalSeconds -lt 300)
          $keys | Tee-Object "$env:EV\bucket.txt"
      - name: Killed recorders come back; stopping the service stops them all
        run: |
          $mine = { Get-CimInstance Win32_Process -Filter "Name='kortix-capture.exe' OR Name='kortix-capture-engine.exe' OR Name='kortix-backend.exe'" | Where-Object { $_.SessionId -ne 0 } }
          $before = @(& $mine | ForEach-Object { $_.ProcessId })
          $before | ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
          $t0 = Get-Date; $back = $null
          while (-not $back -and ((Get-Date) - $t0).TotalSeconds -lt 60) {
            Start-Sleep 2
            $back = & $mine | Where-Object { $_.CommandLine -match "service run --managed" -and $_.ProcessId -notin $before }
          }
          $s = [int]((Get-Date) - $t0).TotalSeconds
          @{ killed = $before.Count; back_after_s = $s; back = [bool]$back } | ConvertTo-Json | Tee-Object "$env:EV\kill.json"
          # The device before the upgrade: an upgrade must never sign the computer out.
          $k = "${env:ProgramFiles}\Kortix\Capture\kortix-capture.exe"
          function DeviceOf { try { $kk = (& $k --json sync status | ConvertFrom-Json).kortix; if ($kk.signed_in -and -not $kk.sign_in_required) { $kk.device_id } else { "none" } } catch { "none" } }
          $devBefore = DeviceOf
          $n0 = @(Get-Content "$env:EV\issuer.jsonl").Count
          # Upgrade in place with no properties: the configuration stays, the service comes back.
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$env:RUNNER_TEMP\msi\KortixCapture-next.msi`"", "/qn", "/l*v", "`"$env:EV\msi-upgrade.log`"" -Wait -PassThru
          $key = Get-ItemProperty "HKLM:\SOFTWARE\Policies\Kortix\Capture" -ErrorAction SilentlyContinue
          $t0 = Get-Date
          while (-not (& $mine | Where-Object { $_.CommandLine -match "service run --managed" }) -and ((Get-Date) - $t0).TotalSeconds -lt 120) { Start-Sleep 3 }
          # Still connected: the new version fetches credentials with the token it kept (3 min at most).
          function CredsAfter { @(Get-Content "$env:EV\issuer.jsonl" | Select-Object -Skip $n0 | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.path -like "*/credentials" -and $_.status -eq 200 }).Count }
          $t0 = Get-Date
          while ((CredsAfter) -lt 1 -and ((Get-Date) - $t0).TotalSeconds -lt 180) { Start-Sleep 5 }
          @{
            device_before = $devBefore
            device_after = DeviceOf
            credentials_after = CredsAfter
            exit = $p.ExitCode
            url_kept = ($key.Url -eq $env:KORTIX_URL_FOR_MSI)
            token_kept = ($key.EnrollmentToken -eq $env:TOKEN_FOR_MSI)
            service = (Get-Service KortixCapture).Status.ToString()
            version = (Get-CimInstance Win32_Product -Filter "Name='Kortix Capture'").Version
            recorder_back = [bool](& $mine | Where-Object { $_.CommandLine -match "service run --managed" })
            token_in_log = [bool](Select-String -Path "$env:EV\msi-upgrade.log" -Pattern $env:TOKEN_FOR_MSI -SimpleMatch -Quiet)
          } | ConvertTo-Json | Tee-Object "$env:EV\upgrade.json"
          sc.exe stop KortixCapture | Out-Null
          Start-Sleep 15
          "after service stop: $(@(& $mine).Count)" | Tee-Object "$env:EV\stop.txt"
      - name: Sign-in reaches the real Kortix through Cloudflare (dev-api.kortix.com)
        run: |
          # The CI stand-in issuer is local; Cloudflare in front of Kortix refused requests
          # without a User-Agent (403) and only a real host shows it. Nothing is approved.
          $cli = "${env:ProgramFiles}\Kortix\Capture\kortix-capture.exe"
          $lib = Join-Path $env:RUNNER_TEMP "cf-signin"
          New-Item -ItemType Directory -Force $lib | Out-Null
          $env:KORTIX_CAPTURE_DIR = $lib
          $ok = $false
          foreach ($i in 1..3) {
            $p = Start-Process $cli -ArgumentList "sync", "setup", "--provider", "kortix", "--issuer", "https://dev-api.kortix.com", "--no-browser" -RedirectStandardOutput "$lib\out.txt" -RedirectStandardError "$lib\err.txt" -PassThru -NoNewWindow
            $deadline = (Get-Date).AddSeconds(30)
            # The code goes to stderr.
            while ((Get-Date) -lt $deadline -and -not $ok) { Start-Sleep 1; $ok = [bool](Select-String -Path "$lib\out.txt", "$lib\err.txt" -Pattern "user_code=" -SimpleMatch -Quiet -ErrorAction SilentlyContinue) }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if ($ok) { break }
            Start-Sleep 10
          }
          if (-not $ok) { Get-Content "$lib\out.txt", "$lib\err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 20; throw "sign-in did not start at dev-api.kortix.com" }
          "sign-in started at dev-api.kortix.com (device code issued)" | Tee-Object "$env:EV\cloudflare-signin.txt"
      - name: Uninstall
        run: |
          $p = Start-Process msiexec.exe -ArgumentList "/x", "`"$env:RUNNER_TEMP\msi\KortixCapture-next.msi`"", "/qn", "/l*v", "`"$env:EV\msi-uninstall.log`"" -Wait -PassThru
          @{
            exit = $p.ExitCode
            service_gone = -not (Get-Service KortixCapture -ErrorAction SilentlyContinue)
            files_gone = -not (Test-Path "${env:ProgramFiles}\Kortix\Capture")
            policy_values_gone = -not ((Get-ItemProperty "HKLM:\SOFTWARE\Policies\Kortix\Capture" -ErrorAction SilentlyContinue).EnrollmentToken)
            machine_data_gone = -not (Test-Path "$env:ProgramData\Kortix\Capture")
            user_library_kept = (Test-Path "$env:APPDATA\ai.kortix.capture\memory.db")
            processes_left = @(Get-Process kortix-capture, kortix-capture-engine, kortix-backend -ErrorAction SilentlyContinue).Count
          } | ConvertTo-Json | Tee-Object "$env:EV\uninstall.json"
          Copy-Item "$env:ProgramData\Kortix\Capture\logs\machine.log" "$env:EV\" -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\ai.kortix.capture\logs" "$env:EV\user-logs" -Recurse -ErrorAction SilentlyContinue
      - name: Assert
        shell: python
        run: |
          import json, os, pathlib, re
          ev = pathlib.Path(os.environ["EV"]); real = False
          load = lambda n: json.loads((ev / n).read_text(encoding="utf-8-sig"))
          text = lambda n: (ev / n).read_text(encoding="utf-8-sig", errors="replace")
          env = load("env.json"); print("env", env)
          inst = text("install.txt"); print(inst)
          assert "msiexec exit: 0" in inst
          assert "token in msi log: False" in inst, "the enrollment token reached the MSI log"
          assert re.search(r"standard user: error: (SecurityException|UnauthorizedAccessException)", inst), "a standard user could read the policy key"
          man = load("manual_install.json"); print("manual install", man)
          assert man["exit"] == 0 and man["exe"] and man["state"] == "Running" and man["start_mode"] == "Auto" and man["uninstall_exit"] == 0, man
          svc = load("service.json"); print("service", svc)
          assert svc["state"] == "Running" and svc["start_mode"] == "Auto" and svc["account"] == "LocalSystem", svc
          assert "machine run" in svc["path"], svc
          assert "RESTART" in text("service_failure.txt"), "no restart-on-failure"
          key = load("policy_key.json"); print("policy key", key)
          ids = {i.lower() for i in key["identities"]}
          assert key["protected"] and ids == {"nt authority\\system", "builtin\\administrators"}, key
          m = load("machine_recording.json"); print("machine", m)
          rec = [s for s in m["sessions"] if s["state"] == "recording"]
          assert rec, f"no session recording: {m}"
          me = env["runner_user"].lower()
          assert rec[0]["user"]["account_name"].lower().endswith(me.split("\\")[-1]), (rec[0]["user"], me)
          st = load("user_status.json"); print("user library", st["counts"])
          assert st["counts"]["frames"] >= 10, "the signed-in person's library did not record"
          assert st["managed"] is True and st["enrollment"]["state"] == "enrolled", st.get("enrollment")
          assert st["enrollment"]["account_name"] == ("Example Org" if not real else st["enrollment"]["account_name"]), st["enrollment"]
          sync = load("user_sync.json")
          assert sync["provider"] == "kortix" and sync["enabled"] and sync["kortix"]["managed"], sync["kortix"]
          procs = load("processes.json"); procs = procs if isinstance(procs, list) else [procs]
          print("processes", [(p["name"], p["session"], p["owner"], p["cmd"]) for p in procs])
          user_side = [p for p in procs if p["session"] != 0]
          assert any("service run --managed" in (p["cmd"] or "") for p in user_side), "no managed service run in the person's session"
          assert any((p["cmd"] or "").rstrip().endswith(" tray") for p in user_side), "the tray is not running"
          assert all(p["owner"].lower().endswith(me.split("\\")[-1]) for p in user_side), "a user-side process is not the person's"
          assert any(p["session"] == 0 and "machine run" in (p["cmd"] or "") for p in procs), "the machine service process is missing"
          tray_log = text("user-logs/tray.log"); print(tray_log[-600:])
          assert "[notify] notice: Example Org" in tray_log and "delivered by powershell.exe" in tray_log, "the organization notice was not shown"
          assert load("start_when_managed.json")["managed"] is True, "start must report the managed recording"
          assert "stop exit: 1" in text("stop_when_managed.txt") and "manages Kortix Capture" in text("stop_when_managed.txt")
          win = load("start_menu_window.json"); print("start menu", win)
          assert win["shortcut"].endswith("kortix-capture.exe app"), win
          assert win["title"] == "Kortix Capture" and win["same_process_after_10s"] and "app --detached" in (win["cmd"] or ""), ("the Start menu entry opened no window", win, text("ui.log") if win["ui_log"] else "")
          assert win["webview_processes"] >= 1 and not win["ui_log"], ("the window has no WebView", win)
          assert win["profile_in_local_app_data"] and not win["profile_in_program_files"], ("the WebView2 profile is not in %LOCALAPPDATA%", win)
          assert win["windows_after_second_click"] == 1 and win["still_open_after_second_click"], ("a second click opened another window or closed this one", win)
          if not real:
              log = [json.loads(l) for l in text("issuer.jsonl").splitlines() if l.strip()]
              enrolls = [l for l in log if l["path"].endswith("/enroll")]
              print("enroll answers", [e["status"] for e in enrolls])
              assert enrolls[0]["status"] == 202 and 200 in [e["status"] for e in enrolls], "pending, then enrolled"
              body = enrolls[0]["body"]
              assert body["enrollment_token"] == "<redacted>" and len(body["machine_key_sha256"]) == 64
              assert body["user"]["account_name"].lower().endswith(me.split("\\")[-1]), body["user"]
              assert body["device"]["os"] == "windows", body["device"]
              assert any(l["path"].endswith("/credentials") and l["status"] == 200 for l in log), "no credentials fetched"
              keys = text("bucket.txt"); print(keys)
              assert "manifest.json" in keys and "status.json" in keys, "nothing uploaded under the device folder"
          kill = load("kill.json"); print("kill", kill)
          assert kill["killed"] >= 3 and kill["back"] and kill["back_after_s"] <= 30, kill
          up = load("upgrade.json"); print("upgrade", up)
          assert up["exit"] == 0 and up["url_kept"] and up["token_kept"] and up["service"] == "Running" and up["recorder_back"], up
          assert up["version"] == os.environ["NEXT_VERSION"], up
          assert up["token_in_log"] is False, "the upgrade logged the enrollment token"
          assert up["device_before"] != "none" and up["device_after"] == up["device_before"], ("the upgrade changed or lost the device", up)
          assert up["credentials_after"] >= 1, ("no credentials fetched after the upgrade", up)
          assert text("stop.txt").strip() == "after service stop: 0", text("stop.txt")
          un = load("uninstall.json"); print("uninstall", un)
          assert un["exit"] == 0 and un["service_gone"] and un["files_gone"] and un["policy_values_gone"], un
          assert un["machine_data_gone"] and un["user_library_kept"] and un["processes_left"] == 0, un
          print("ALL WINDOWS MSI ASSERTIONS PASSED")
      - name: Updater - build the test versions N and N+1
        run: |
          # TEST builds, never released: the update public key is made here, the manifest is a local
          # server, a check runs every 15 s. They differ only in the version (dev.7000001, dev.7000002).
          $base = ($env:TAG -replace '^v', '' -replace '[-+].*$', '')
          $u = "$env:RUNNER_TEMP\upd"
          $env:KORTIX_CAPTURE_UPDATE_PUBLIC_KEY = (node scripts/ci_update_tool.mjs keygen $u).Trim()
          if ($LASTEXITCODE -ne 0) { throw "keygen failed" }
          $env:KORTIX_CAPTURE_UPDATE_TEST_MANIFEST_URL = "http://127.0.0.1:8899/capture-update.json"
          $env:KORTIX_CAPTURE_UPDATE_TEST_INTERVAL_SECS = "15"
          $env:KORTIX_CAPTURE_UPDATE_TEST_HEALTH_SECS = "120"
          foreach ($i in 1, 2) {
            $tag = "v$base-dev.700000$i"
            $env:KORTIX_RELEASE_TAG = $tag
            cargo build --release --features native-recorders --bin kortix-capture --bin kortix-capture-engine --bin kortix-backend
            if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
            $stage = "$u\stage$i"; New-Item -ItemType Directory -Force $stage | Out-Null
            foreach ($f in 'kortix-capture.exe', 'kortix-capture-engine.exe', 'kortix-backend.exe', 'onnxruntime.dll', 'privacy-runtime-notices.txt') { Copy-Item "target\release\$f" $stage }
            ./installer/windows/build-msi.ps1 -Stage $stage -Version $tag -Out "$u\KortixCapture-$tag-x64.msi"
            if ($LASTEXITCODE -ne 0) { throw "build-msi failed" }
          }
          "UPD_BASE=$base" | Add-Content $env:GITHUB_ENV
      - name: Updater - N updates to N+1 (signed manifest, rollback, refusals)
        run: |
          $u = "$env:RUNNER_TEMP\upd"; New-Item -ItemType Directory -Force "$u\work" | Out-Null
          python scripts/ci_update_test.py --os windows --work "$u\work" --key "$u\update-key.pem" `
            --n-installer "$u\KortixCapture-v$($env:UPD_BASE)-dev.7000001-x64.msi" --n1-installer "$u\KortixCapture-v$($env:UPD_BASE)-dev.7000002-x64.msi" `
            --n-version "v$($env:UPD_BASE)-dev.7000001" --n1-version "v$($env:UPD_BASE)-dev.7000002" `
            --token $env:TOKEN_FOR_MSI --issuer $env:KORTIX_URL_FOR_MSI --evidence "$env:EV\updater"
          if ($LASTEXITCODE -ne 0) { throw "the updater test failed" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capture-evidence-windows
          path: evidence
          retention-days: 14
          if-no-files-found: ignore

  macos-pkg:
    name: macOS pkg (build, sign, notarize and verify)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macos
            runner: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)
    env:
      EV: ${{ github.workspace }}/evidence
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/capture
          key: capture-pkg
      - name: Environment facts
        run: |
          mkdir -p "$EV"
          {
            echo "uname: $(uname -a)"; sw_vers; echo "user: $(id)"
            echo "console owner uid: $(stat -f %u /dev/console)"
            echo "managername: $(launchctl managername 2>&1)"
            echo "gui domain:"; launchctl print "gui/$(id -u)" 2>&1 | head -5
            echo "who:"; who
          } 2>&1 | tee "$EV/env.txt"
      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      # Same signing material as the desktop app (kortix-ci-env). Every key is
      # optional: without a certificate the app inside the pkg is signed ad hoc.
      - name: Read signing credentials from AWS Secrets Manager
        continue-on-error: true
        uses: ./.aws-env/.github/actions/aws-env
        with:
          keys: |
            APPLE_CERTIFICATE?
            APPLE_CERTIFICATE_PASSWORD?
            APPLE_ID?
            APPLE_APP_SPECIFIC_PASSWORD?
            APPLE_TEAM_ID?
            APPLE_API_KEY_P8?
            APPLE_API_KEY_ID=kortix-ci-env:APPLE_API_KEY?
            APPLE_API_ISSUER?
            APPLE_INSTALLER_CERTIFICATE?
            APPLE_INSTALLER_CERTIFICATE_PASSWORD?
      - name: Import the Developer ID certificates and choose the notary credentials
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ env.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ env.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p "$EV"
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            [ "$CHANNEL" != stable ] || { echo "::error::A stable release needs the Apple certificate in kortix-ci-env."; exit 1; }
            echo "::warning::No Apple certificate in kortix-ci-env: the app is signed ad hoc and the pkg is unsigned."
            echo "APPLE_CODESIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"; echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12" 2>/dev/null || printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$p12"
          kc="$RUNNER_TEMP/kortix-capture-signing.keychain-db"
          kcpw="$(uuidgen)"; echo "::add-mask::$kcpw"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          # The Developer ID Installer identity signs the .pkg. It is its own .p12, so the desktop app's certificate stays as it is.
          if [ -n "${APPLE_INSTALLER_CERTIFICATE:-}" ] && [ -n "${APPLE_INSTALLER_CERTIFICATE_PASSWORD:-}" ]; then
            printf '%s' "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$p12" 2>/dev/null || printf '%s' "$APPLE_INSTALLER_CERTIFICATE" | base64 -D > "$p12"
            security import "$p12" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$kc"
          rm -f "$p12"
          app_id="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          inst_id="$(security find-identity -v -p basic "$kc" | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -n 1)"
          [ -n "$app_id" ] || { echo "::error::The Apple certificate holds no Developer ID Application identity."; exit 1; }
          echo "application identity: $app_id"
          echo "installer identity: ${inst_id:-none (the pkg stays unsigned)}"
          # macOS refuses to open a downloaded pkg that is not signed and notarized. A stable release never ships one.
          [ -n "$inst_id" ] || [ "$CHANNEL" != stable ] || { echo "::error::A stable release needs the Developer ID Installer identity (APPLE_INSTALLER_CERTIFICATE)."; exit 1; }
          echo "APPLE_CODESIGN_IDENTITY=$app_id" >> "$GITHUB_ENV"
          [ -z "$inst_id" ] || echo "APPLE_INSTALLER_IDENTITY=$inst_id" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          # Notarization: an App Store Connect API key first, else the Apple ID.
          if [ -n "${APPLE_API_KEY_P8:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            p8="$(printf '%s' "$APPLE_API_KEY_P8" | base64 | tr -d '\n')"; echo "::add-mask::$p8"
            { echo "APPLE_NOTARY_KEY_P8_BASE64=$p8"; echo "APPLE_NOTARY_KEY_ID=$APPLE_API_KEY_ID"; echo "APPLE_NOTARY_ISSUER_ID=$APPLE_API_ISSUER"; echo "MACOS_NOTARIZE=1"; } >> "$GITHUB_ENV"
            echo "notary credentials: App Store Connect API key"; echo "notarized=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "MACOS_NOTARIZE=1" >> "$GITHUB_ENV"
            echo "notary credentials: Apple ID"; echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            [ "$CHANNEL" != stable ] || { echo "::error::A stable release needs notary credentials in kortix-ci-env."; exit 1; }
            echo "::warning::No notary credentials in kortix-ci-env: the app is signed but not notarized."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the universal pkg (signed and notarized when the secrets exist)
        working-directory: apps/capture
        env:
          KORTIX_RELEASE_TAG: ${{ inputs.tag }}
          KORTIX_DEFAULT_ISSUER_URL: ${{ inputs.issuer_url }}
        run: |
          set -euo pipefail
          # The update public key (apps/capture/update-public-key.txt, public) is compiled in; without it the app never updates.
          if [ -s update-public-key.txt ]; then export KORTIX_CAPTURE_UPDATE_PUBLIC_KEY="$(tr -d '[:space:]' < update-public-key.txt)"; fi
          installer/macos/build-pkg.sh "$TAG" "$RUNNER_TEMP/pkg/KortixCapture-$TAG-universal.pkg" 2>&1 | tee "$EV/build.txt"
          if grep -q "127.0.0.1:8899" target/aarch64-apple-darwin/release/kortix-capture target/x86_64-apple-darwin/release/kortix-capture; then
            echo "::error::the release binary contains the updater's test manifest URL"; exit 1
          fi
          echo "test manifest URL in the release binaries: no" | tee "$EV/no_test_hook.txt"
          pkgutil --payload-files "$RUNNER_TEMP/pkg/KortixCapture-$TAG-universal.pkg" | grep -v "/skill/" | head -60 | tee "$EV/pkg-files.txt"
          pkgutil --check-signature "$RUNNER_TEMP/pkg/KortixCapture-$TAG-universal.pkg" 2>&1 | tee "$EV/pkg-signature.txt" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-installer-macos
          path: ${{ runner.temp }}/pkg/KortixCapture-${{ inputs.tag }}-universal.pkg
          if-no-files-found: error
      - name: S3 (versitygw) and the CI stand-in for Kortix
        run: |
          d="$RUNNER_TEMP/s3"; mkdir -p "$d/data" "$d/bin"
          gh release download v1.8.0 --repo versity/versitygw -p "versitygw_v1.8.0_Darwin_arm64.tar.gz" -D "$d"
          tar -xzf "$d/versitygw_v1.8.0_Darwin_arm64.tar.gz" -C "$d/bin"
          gw="$(find "$d/bin" -name versitygw -type f | head -1)"
          nohup "$gw" --port 127.0.0.1:9000 --access cikortix --secret cikortix-secret-123 posix "$d/data" > "$EV/versitygw.out.log" 2> "$EV/versitygw.err.log" &
          sleep 4
          token="kortix_enr_ci$(uuidgen | tr -d - | tr A-Z a-z)"
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          nohup python3 apps/capture/scripts/ci_fake_issuer.py --port 8787 --token "$token" --log "$EV/issuer.jsonl" \
            --s3-endpoint http://127.0.0.1:9000 --bucket capture --access-key cikortix --secret-key cikortix-secret-123 \
            > "$EV/issuer.out.log" 2> "$EV/issuer.err.log" &
          for i in $(seq 1 15); do
            curl -s -o /dev/null -X POST http://127.0.0.1:8787/v1/nothing && break; sleep 2
          done
          curl -s -o /dev/null -w "issuer up: %{http_code}\n" -X POST http://127.0.0.1:8787/v1/nothing
          # The organization's notice: the app shows one only when the policy has one.
          mkdir -p "$d/data/capture/orgs/00000000-0000-4000-8000-00000000c1c1"
          printf '{"schema": 2, "notice": "Recorded for the CI verification."}' > "$d/data/capture/orgs/00000000-0000-4000-8000-00000000c1c1/policy.json"

        env:
          GH_TOKEN: ${{ github.token }}
      - name: A screen that changes every second
        run: |
          # The recorder saves a frame only when the screen changed. Terminal runs the clock.
          printf '#!/bin/bash\nwhile true; do clear; echo KORTIX CAPTURE PKG VERIFY; date +%%T; sleep 1; done\n' > "$RUNNER_TEMP/clock.command"
          chmod +x "$RUNNER_TEMP/clock.command"
          open "$RUNNER_TEMP/clock.command" || true
      - name: Install as IT would
        run: |
          sudo install -d -m 755 -o root -g wheel "/Library/Application Support/Kortix" "/Library/Application Support/Kortix/Capture"
          printf '{"url": "http://127.0.0.1:8787", "enrollment_token": "%s"}' "$TOKEN" | sudo tee "/Library/Application Support/Kortix/Capture/config.json" > /dev/null
          sudo chown root:wheel "/Library/Application Support/Kortix/Capture/config.json"
          sudo chmod 600 "/Library/Application Support/Kortix/Capture/config.json"
          sudo installer -pkg "$RUNNER_TEMP/pkg/KortixCapture-$TAG-universal.pkg" -target / -verboseR 2>&1 | tee "$EV/installer.txt"
          echo "installer exit: ${PIPESTATUS[0]}" | tee "$EV/install.txt"
          ls -ln "/Library/Application Support/Kortix/Capture" | tee -a "$EV/install.txt"
          ls -l /usr/local/bin/kortix-capture /Library/LaunchDaemons/ai.kortix.capture.machine.plist /Library/LaunchAgents/ai.kortix.capture.agent.plist | tee -a "$EV/install.txt"
          codesign -dvv "/Applications/Kortix Capture.app" 2>&1 | tee "$EV/codesign.txt" || true
          plutil -p "/Applications/Kortix Capture.app/Contents/Info.plist" | tee "$EV/info-plist.txt"
          lipo -archs "/Applications/Kortix Capture.app/Contents/MacOS/Kortix Capture" | tee "$EV/archs.txt"
      - name: Grant what the runner lets a script grant
        run: |
          # The runner's TCC database may refuse or ignore this (Full Disk Access, SIP, macOS 15+
          # screen-recording approvals); the outcome is evidence, and the agent's own heartbeat
          # (`granted`) says what macOS gives the app.
          codesign -d -r- "/Applications/Kortix Capture.app" 2>&1 | grep 'designated =>' | sed 's/.*designated => //' > "$RUNNER_TEMP/req.txt"
          cat "$RUNNER_TEMP/req.txt" >> "$EV/tcc.txt"
          csreq -r "=$(cat "$RUNNER_TEMP/req.txt")" -b "$RUNNER_TEMP/req.bin" 2>&1 | tee -a "$EV/tcc.txt"
          hex="$(xxd -p "$RUNNER_TEMP/req.bin" | tr -d '\n')"
          echo "csreq: $hex" >> "$EV/tcc.txt"
          db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          for svc in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServiceListenEvent kTCCServiceMicrophone; do
            sqlite3 "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,flags,last_modified) VALUES ('$svc','ai.kortix.capture',0,2,4,1,X'$hex',0,strftime('%s','now'));" 2>&1 \
              | sed "s/^/$svc: /" | tee -a "$EV/tcc.txt"
          done
          # Screen Recording, Accessibility and Input Monitoring live in the system database (root, SIP).
          echo "csrutil: $(csrutil status 2>&1)" | tee -a "$EV/tcc.txt"
          sdb="/Library/Application Support/com.apple.TCC/TCC.db"
          for svc in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServiceListenEvent; do
            sudo sqlite3 "$sdb" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,flags,last_modified) VALUES ('$svc','ai.kortix.capture',0,2,4,1,X'$hex',0,strftime('%s','now'));" 2>&1 \
              | sed "s/^/system $svc: /" | tee -a "$EV/tcc.txt"
          done
          sudo sqlite3 "$sdb" "select service, client, auth_value, length(csreq) from access where client='ai.kortix.capture'" 2>&1 | sed 's/^/system: /' | tee -a "$EV/tcc.txt" || true
          sqlite3 "$db" "select service, client, auth_value, length(csreq) from access where client='ai.kortix.capture'" 2>&1 | tee -a "$EV/tcc.txt" || true
          killall tccd 2>&1 | tee -a "$EV/tcc.txt" || true
          sudo killall tccd 2>&1 | tee -a "$EV/tcc.txt" || true
          exit 0
      - name: The daemon, the agent and the enrollment
        run: |
          uid="$(id -u)"
          sleep 5
          sudo launchctl print system/ai.kortix.capture.machine > "$EV/daemon.txt" 2>&1 || true
          launchctl print "gui/$uid/ai.kortix.capture.agent" > "$EV/agent.txt" 2>&1 || true
          # The machine service enrolls the console user: pending first (the stand-in asks an admin), then enrolled.
          t0=$SECONDS; state=""
          until [ "$state" = "enrolled" ] || [ $((SECONDS - t0)) -ge 300 ]; do
            sleep 5
            state="$(python3 -c "import json;d=json.load(open('/Library/Application Support/Kortix/Capture/machine.json'));print((d['sessions'] or [{}])[0].get('state',''))" 2>/dev/null || true)"
          done
          cp "/Library/Application Support/Kortix/Capture/machine.json" "$EV/machine.json" || true
          sudo cp "/Library/Application Support/Kortix/Capture/logs/machine.log" "$EV/machine.log" || true
          k=/usr/local/bin/kortix-capture
          $k --json status > "$EV/user_status.json" 2>&1 || true
          $k --json sync status > "$EV/user_sync.json" 2>&1 || true
          $k --json machine status > "$EV/machine_status_user.json" 2>&1 || true
          sudo $k --json machine status > "$EV/machine_status_root.json" 2>&1 || true
          $k --json start > "$EV/start_when_managed.json" 2>&1 || true
          rc=0; $k stop > "$EV/stop_when_managed.txt" 2>&1 || rc=$?; echo "stop exit: $rc" >> "$EV/stop_when_managed.txt"
          # A standard user cannot read the token.
          if cat "/Library/Application Support/Kortix/Capture/config.json" > /dev/null 2>&1; then echo "config readable: yes" > "$EV/config_read.txt"; else echo "config readable: no" > "$EV/config_read.txt"; fi
          ls -ln "/Library/Application Support/Kortix/Capture/config.json" >> "$EV/config_read.txt"
          # The recording side: the agent's heartbeat and the permissions macOS reports for the app.
          t0=$SECONDS; frames=0
          until [ "$frames" -ge 10 ] || [ $((SECONDS - t0)) -ge 240 ]; do
            sleep 8
            frames="$($k --json status 2>/dev/null | python3 -c "import json,sys;print((json.load(sys.stdin).get('counts') or {}).get('frames',0))" 2>/dev/null || echo 0)"
          done
          $k --json status > "$EV/user_status.json" 2>&1 || true
          $k --json service status > "$EV/service_status.json" 2>&1 || true
          ps -axo pid,uid,ppid,command | grep -E "Kortix Capture|kortix-" | grep -v grep > "$EV/processes.txt" || true
          cat "$EV/processes.txt"
          for f in "$HOME/Library/Application Support/ai.kortix.capture/logs/"*.log; do echo "== $f"; tail -n 40 "$f"; done > "$EV/user-logs.txt" 2>&1 || true
          screencapture -x "$EV/desktop.png" || true
          # The token is not in anything the person can read.
          if grep -rIl --exclude-dir=.git "$TOKEN" "$HOME/Library/Application Support/ai.kortix.capture" > "$EV/token_in_library.txt" 2>/dev/null; then :; fi
          echo "files with the token in the person's library: $(wc -l < "$EV/token_in_library.txt" | tr -d ' ')" | tee -a "$EV/config_read.txt"
      - name: Uploads reach the bucket under the device's folder
        run: |
          prefix="orgs/00000000-0000-4000-8000-00000000c1c1/0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b/"
          t0=$SECONDS
          while :; do
            sleep 10
            keys="$(python3 apps/capture/scripts/ci_fake_issuer.py --s3-endpoint http://127.0.0.1:9000 --bucket capture --access-key cikortix --secret-key cikortix-secret-123 --list "$prefix" 2>&1 || true)"
            if { echo "$keys" | grep -q "manifest.json" && echo "$keys" | grep -q "status.json"; } || [ $((SECONDS - t0)) -ge 240 ]; then break; fi
            # Without Screen Recording there is no chunk; the device's own files still go up.
            if echo "$keys" | grep -q "status.json" && echo "$keys" | grep -q "device.json" && [ $((SECONDS - t0)) -ge 90 ]; then break; fi
          done
          echo "$keys" | tee "$EV/bucket.txt"
      - name: The notice, the kill and the reinstall
        run: |
          k=/usr/local/bin/kortix-capture
          # The tray shows the logon notice once, after the policy had time to arrive (45 s at most).
          t0=$SECONDS
          until grep -q "\[notify\] notice" "$HOME/Library/Application Support/ai.kortix.capture/logs/tray.log" 2>/dev/null || [ $((SECONDS - t0)) -ge 150 ]; do sleep 5; done
          grep -h "notify\|tray" "$HOME/Library/Application Support/ai.kortix.capture/logs/tray.log" 2>/dev/null | tail -5 | tee "$EV/notice.txt"
          ps -axo pid,command | grep -E "Kortix Capture tray" | grep -v grep | tee "$EV/tray.txt" || true
          # The tray ends (macOS quits it, exit 0, when a person changes a privacy permission in
          # System Settings; or it is killed). The service starts it again after every exit:
          # there is no Quit. An Apple Event cannot reach the accessory tray on a runner, so stop it.
          tq_old="$(pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture tray' | head -1)"
          kill -TERM "$tq_old" 2>&1 | tee "$EV/tray-quit.txt" || true
          t0=$SECONDS; tq_new=""
          until [ -n "$tq_new" ] && [ "$tq_new" != "$tq_old" ] || [ $((SECONDS - t0)) -ge 60 ]; do sleep 2; tq_new="$(pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture tray' | head -1)"; done
          printf '{"old": "%s", "new": "%s", "back_after_s": %d}\n' "$tq_old" "$tq_new" $((SECONDS - t0)) | tee "$EV/tray-quit.json"
          # Kill the agent; launchd brings it back (KeepAlive).
          old="$(pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture agent' | head -1)"
          sudo pkill -9 -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture agent' || true
          t0=$SECONDS; new=""
          until [ -n "$new" ] && [ "$new" != "$old" ] || [ $((SECONDS - t0)) -ge 90 ]; do sleep 2; new="$(pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture agent' | head -1)"; done
          printf '{"old": "%s", "new": "%s", "back_after_s": %d}\n' "$old" "$new" $((SECONDS - t0)) | tee "$EV/kill.json"
          # The profile path: managed preferences win over config.json.
          sudo mkdir -p "/Library/Managed Preferences"
          # (cfprefsd owns Managed Preferences for `defaults`; the MDM writes the file, so does plutil here.)
          prof="/Library/Managed Preferences/ai.kortix.capture.plist"
          { sudo plutil -create xml1 "$prof" && sudo plutil -insert Url -string "http://127.0.0.1:9999" "$prof" \
            && sudo plutil -insert EnrollmentToken -string "profile-token" "$prof" && sudo chmod 644 "$prof"; ls -l "$prof"; sudo plutil -p "$prof"; } > "$EV/profile.txt" 2>&1 || true
          sudo $k --json machine status > "$EV/machine_status_profile.json" 2>&1 || true
          sudo rm -f "$prof"
          # `machine configure` (as root) writes the same root-only config file.
          cfg="/Library/Application Support/Kortix/Capture/config.json"
          sudo rm -f "$cfg"
          rc=0; echo "$TOKEN" | sudo $k machine configure --url http://127.0.0.1:8787 > "$EV/configure.txt" 2>&1 || rc=$?
          {
            echo "configure exit: $rc"
            ls -ln "$cfg"
            sudo env TOKEN="$TOKEN" python3 -c "import json,os;d=json.load(open('$cfg'));print('configure wrote url', d['url'], 'token ok', d['enrollment_token']==os.environ['TOKEN'])"
          } 2>&1 | tee -a "$EV/configure.txt"
          # The device before the reinstall (an update installs the same way).
          dev_of() { $k --json sync status 2>/dev/null | python3 -c 'import json,sys; k=json.load(sys.stdin)["kortix"]; print(k["device_id"] if k["signed_in"] and not k["sign_in_required"] else "none")' 2>/dev/null || echo none; }
          dev_before="$(dev_of)"; n0=$(wc -l < "$EV/issuer.jsonl")
          # Reinstall over the installed pkg: the configuration stays and the services come back.
          sudo installer -pkg "$RUNNER_TEMP/pkg/KortixCapture-$TAG-universal.pkg" -target / 2>&1 | tail -3 | tee "$EV/reinstall.txt"
          # The daemon starts the agent again after the reinstall: wait for it (up to 2 min).
          t0=$SECONDS; until pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture agent' > /dev/null || [ $((SECONDS - t0)) -ge 120 ]; do sleep 3; done
          sleep 5
          # Still connected: the new process fetches credentials with the token it kept (3 min at most).
          creds_after() { tail -n +$((n0 + 1)) "$EV/issuer.jsonl" | python3 -c 'import json,sys; print(sum(1 for l in sys.stdin if l.strip() and json.loads(l).get("path","").endswith("/credentials") and json.loads(l).get("status")==200))'; }
          t0=$SECONDS; until [ "$(creds_after)" -ge 1 ] || [ $((SECONDS - t0)) -ge 180 ]; do sleep 5; done
          {
            echo "config kept: $(sudo test -f '/Library/Application Support/Kortix/Capture/config.json' && echo yes || echo no)"
            echo "daemon: $(sudo launchctl print system/ai.kortix.capture.machine 2>&1 | grep -c 'state = running')"
            echo "agent: $(pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture agent' | wc -l | tr -d ' ')"
            echo "device before: $dev_before"
            echo "device after: $(dev_of)"
            echo "credentials after reinstall: $(creds_after)"
          } | tee -a "$EV/reinstall.txt"
          launchctl print "gui/$(id -u)/ai.kortix.capture.agent" > "$EV/agent_after_reinstall.txt" 2>&1 || true
      - name: Sign-in reaches the real Kortix through Cloudflare (dev-api.kortix.com)
        run: |
          # The CI stand-in issuer is local; Cloudflare in front of Kortix refused requests
          # without a User-Agent (403) and only a real host shows it. No secret needed: the
          # device grant starts unauthenticated, and nothing is approved.
          lib="$(mktemp -d)"; log="$lib/out.txt"; ok=""
          for i in 1 2 3; do
            # The code goes to stderr; macOS has no `timeout`: run it in the background and poll.
            KORTIX_CAPTURE_DIR="$lib" /usr/local/bin/kortix-capture sync setup --provider kortix --issuer https://dev-api.kortix.com --no-browser > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do grep -q "user_code=" "$log" && ok=1 && break; sleep 1; done
            kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
            [ -n "$ok" ] && break
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::sign-in did not start at dev-api.kortix.com"; tail -20 "$log"; rm -rf "$lib"; exit 1; }
          rm -rf "$lib"
          echo "sign-in started at dev-api.kortix.com (device code issued)" | tee "$EV/cloudflare-signin.txt"
      - name: Uninstall
        run: |
          sudo "/Applications/Kortix Capture.app/Contents/Resources/uninstall.sh" 2>&1 | tee "$EV/uninstall.txt"
          {
            echo "daemon loaded: $(sudo launchctl print system/ai.kortix.capture.machine >/dev/null 2>&1 && echo yes || echo no)"
            echo "agent loaded: $(launchctl print gui/$(id -u)/ai.kortix.capture.agent >/dev/null 2>&1 && echo yes || echo no)"
            echo "app: $([ -e '/Applications/Kortix Capture.app' ] && echo present || echo gone)"
            echo "plists: $(ls /Library/LaunchDaemons/ai.kortix.capture.* /Library/LaunchAgents/ai.kortix.capture.* 2>/dev/null | wc -l | tr -d ' ')"
            echo "symlink: $([ -e /usr/local/bin/kortix-capture ] || [ -L /usr/local/bin/kortix-capture ] && echo present || echo gone)"
            echo "support dir: $([ -e '/Library/Application Support/Kortix' ] && echo present || echo gone)"
            echo "receipt: $(pkgutil --pkgs | grep -c '^ai.kortix.capture.pkg$')"
            echo "processes: $(pgrep -f 'Kortix Capture.app|kortix-capture-engine|kortix-backend' | wc -l | tr -d ' ')"
            echo "user library kept: $([ -f "$HOME/Library/Application Support/ai.kortix.capture/memory.db" ] && echo yes || echo no)"
          } | tee "$EV/uninstalled.txt"
      - name: Assert
        shell: python3 {0}
        run: |
          import json, os, pathlib, re
          ev = pathlib.Path(os.environ["EV"])
          text = lambda n: (ev / n).read_text(errors="replace")
          load = lambda n: json.loads(text(n))
          print(text("env.txt"))
          inst = text("install.txt"); print(inst)
          assert "installer exit: 0" in inst
          archs = text("archs.txt").split(); print("archs", archs)
          assert set(archs) == {"x86_64", "arm64"}, archs
          assert "ai.kortix.capture" in text("info-plist.txt") and "LSUIElement" in text("info-plist.txt"), "the app must be an accessory app: no Dock icon while it records in the background"
          assert "state = running" in text("daemon.txt"), text("daemon.txt")[:600]
          assert "ai.kortix.capture.agent" in text("agent.txt"), text("agent.txt")[:600]
          m = load("machine.json"); print("machine", m)
          s = m["sessions"][0]
          assert s["state"] == "enrolled" and s["device_id"], s
          assert s["user"]["account_name"] and s["user"]["principal_name"] is None, s["user"]
          st = load("user_status.json"); sync = load("user_sync.json"); print("user library", st.get("counts"), st.get("enrollment"))
          assert st["managed"] is True and st["enrollment"]["state"] == "enrolled" and st["enrollment"]["account_name"] == "Example Org", st.get("enrollment")
          assert sync["provider"] == "kortix" and sync["enabled"] and sync["kortix"]["managed"], sync["kortix"]
          root = load("machine_status_root.json"); user = load("machine_status_user.json"); prof = load("machine_status_profile.json")
          assert root["service"] in ("running", "loaded") and root["config"]["url"] == "http://127.0.0.1:8787" and root["config"]["enrollment_token"] is True, root
          assert user["config"]["enrollment_token"] is False, "a standard user read the enrollment token"
          assert prof["config"]["url"] == "http://127.0.0.1:9999", ("the MDM profile did not win", prof["config"])
          cfg = text("config_read.txt"); print(cfg)
          assert "config readable: no" in cfg and re.search(r"-rw-------\s+1\s+0\s+0", cfg) and "files with the token in the person's library: 0" in cfg, cfg
          assert load("start_when_managed.json")["managed"] is True
          assert "stop exit: 1" in text("stop_when_managed.txt") and "manages Kortix Capture" in text("stop_when_managed.txt")
          log = [json.loads(l) for l in text("issuer.jsonl").splitlines() if l.strip()]
          enrolls = [l for l in log if l["path"].endswith("/enroll")]
          print("enroll answers", [e["status"] for e in enrolls])
          assert enrolls[0]["status"] == 202 and 200 in [e["status"] for e in enrolls], "pending, then enrolled"
          body = enrolls[0]["body"]
          assert body["enrollment_token"] == "<redacted>" and len(body["machine_key_sha256"]) == 64
          assert body["device"]["os"] == "macos" and body["user"]["account_name"] == s["user"]["account_name"], body
          assert any(l["path"].endswith("/credentials") and l["status"] == 200 for l in log), "no credentials fetched"
          svc = load("service_status.json"); hb = svc.get("heartbeat", {}); print("heartbeat", {k: hb.get(k) for k in ("managed", "running")}, "recorder", hb.get("recorder"), "tray", hb.get("tray"))
          assert hb.get("managed") is True and hb.get("running") is True, "the agent is not the managed service"
          assert hb["tray"]["running"] is True, "the tray is not running"
          assert re.search(r"Kortix Capture tray", text("tray.txt")), "no tray process"
          notice = text("notice.txt"); print(notice)
          assert "[notify] notice: Example Org" in notice, "the tray did not show the organization notice"
          keys = text("bucket.txt"); print(keys)
          assert "status.json" in keys and "device.json" in keys, "nothing uploaded under the device folder"
          frames = st["counts"]["frames"]
          granted = hb.get("granted") or []
          print("frames", frames, "permissions macOS gives the app (the agent's heartbeat)", granted)
          if frames >= 10:
              assert "manifest.json" in keys, "frames recorded but no chunk uploaded"
          else:
              # The runner's Screen Recording grant is the blocker: everything up to the recorder is asserted above.
              print("BLOCKER: no frames; macOS has not granted Screen Recording to the app. granted =", granted, "| tcc:", text("tcc.txt")[:900])
              assert "screen" not in granted, ("no frames although Screen Recording is granted", granted, text("user-logs.txt")[-1500:])
          kill = load("kill.json"); print("kill", kill)
          assert kill["new"] and kill["new"] != kill["old"] and kill["back_after_s"] <= 60, kill
          tq = load("tray-quit.json"); print("tray quit", tq, text("tray-quit.txt"))
          assert tq["old"] and tq["new"] and tq["new"] != tq["old"], ("the tray did not come back after macOS quit it", tq)
          conf = text("configure.txt"); print(conf)
          assert "configure exit: 0" in conf and re.search(r"-rw-------\s+1\s+0\s+0", conf) and "configure wrote url http://127.0.0.1:8787 token ok True" in conf, conf
          re_ = text("reinstall.txt"); print(re_)
          assert "config kept: yes" in re_ and "daemon: 1" in re_ and re.search(r"agent: [1-9]", re_), re_
          # An update must never sign a computer out: same device, signed in, credentials fetched again.
          before = re.search(r"device before: (\S+)", re_).group(1); after = re.search(r"device after: (\S+)", re_).group(1)
          assert before != "none" and after == before, ("the reinstall changed or lost the device", before, after)
          assert int(re.search(r"credentials after reinstall: (\d+)", re_).group(1)) >= 1, ("no credentials fetched after the reinstall", re_)
          un = text("uninstalled.txt"); print(un)
          for line in ("daemon loaded: no", "agent loaded: no", "app: gone", "plists: 0", "symlink: gone", "support dir: gone", "receipt: 0", "processes: 0"):
              assert line in un, (line, un)
          print("ALL MACOS PKG ASSERTIONS PASSED")
      - name: Updater - build the test versions N and N+1
        working-directory: apps/capture
        env:
          # TEST builds, never released: ad hoc signed, unsigned pkg (the updater warns and goes on).
          APPLE_CODESIGN_IDENTITY: "-"
          APPLE_INSTALLER_IDENTITY: ""
          MACOS_NOTARIZE: "0"
          ARCHS: arm64
        run: |
          set -euo pipefail
          base="$(printf '%s' "$TAG" | sed -E 's/^v//; s/[-+].*$//')"
          u="$RUNNER_TEMP/upd"
          export KORTIX_CAPTURE_UPDATE_PUBLIC_KEY="$(node scripts/ci_update_tool.mjs keygen "$u")"
          export KORTIX_CAPTURE_UPDATE_TEST_MANIFEST_URL=http://127.0.0.1:8899/capture-update.json
          export KORTIX_CAPTURE_UPDATE_TEST_INTERVAL_SECS=15 KORTIX_CAPTURE_UPDATE_TEST_HEALTH_SECS=120
          for i in 1 2; do
            tag="v$base-dev.700000$i"
            KORTIX_RELEASE_TAG="$tag" installer/macos/build-pkg.sh "$tag" "$u/KortixCapture-$tag-universal.pkg" 2>&1 | tail -4
          done
          echo "UPD_BASE=$base" >> "$GITHUB_ENV"
      - name: Updater - N updates to N+1 (signed manifest, rollback, refusals)
        run: |
          u="$RUNNER_TEMP/upd"; mkdir -p "$u/work"
          python3 apps/capture/scripts/ci_update_test.py --os macos --work "$u/work" --key "$u/update-key.pem" \
            --n-installer "$u/KortixCapture-v$UPD_BASE-dev.7000001-universal.pkg" --n1-installer "$u/KortixCapture-v$UPD_BASE-dev.7000002-universal.pkg" \
            --n-version "v$UPD_BASE-dev.7000001" --n1-version "v$UPD_BASE-dev.7000002" \
            --token "$TOKEN" --evidence "$EV/updater"
      - name: Gatekeeper accepts the installed app
        if: steps.sign.outputs.notarized == 'true'
        run: |
          app="/Applications/Kortix Capture.app"
          # The Uninstall step removes the app: assert on a fresh install of the same pkg.
          sudo installer -pkg "$RUNNER_TEMP/pkg/KortixCapture-$TAG-universal.pkg" -target / 2>&1 | tail -3
          {
            echo "== codesign"; codesign -dvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags|Timestamp"
            echo "== spctl app"; spctl --assess --type execute -vv "$app" 2>&1
            echo "== stapler app"; xcrun stapler validate "$app" 2>&1
            echo "== pkg signature"; pkgutil --check-signature "$RUNNER_TEMP/pkg/KortixCapture-$TAG-universal.pkg" 2>&1 || true
          } 2>&1 | tee "$EV/gatekeeper.txt"
          grep -q "accepted" "$EV/gatekeeper.txt" && grep -q "source=Notarized Developer ID" "$EV/gatekeeper.txt"
          grep -q "The validate action worked" "$EV/gatekeeper.txt"
          # The pkg is the file people download: Gatekeeper must accept it too, or macOS says "Apple could not verify".
          if [ -n "${APPLE_INSTALLER_IDENTITY:-}" ]; then
            pkg="$RUNNER_TEMP/pkg/KortixCapture-$TAG-universal.pkg"
            { echo "== spctl pkg"; spctl --assess --type install -vv "$pkg" 2>&1; echo "== stapler pkg"; xcrun stapler validate "$pkg" 2>&1; } | tee "$EV/gatekeeper-pkg.txt"
            grep -q "accepted" "$EV/gatekeeper-pkg.txt" && grep -q "source=Notarized Developer ID" "$EV/gatekeeper-pkg.txt"
            grep -q "The validate action worked" "$EV/gatekeeper-pkg.txt"
          fi
          sudo "$app/Contents/Resources/uninstall.sh" > /dev/null 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capture-evidence-macos
          path: evidence
          retention-days: 14
          if-no-files-found: ignore

  linux-deb:
    name: Linux deb (build and verify)
    # A real VM: the job installs systemd units and a login session. Sandbox runners
    # (CI_RUNNER_M_2204) have no systemd ("not booted with systemd as init system").
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      EV: ${{ github.workspace }}/evidence
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/capture
          key: capture-deb
      - name: System packages
        run: |
          mkdir -p "$EV"
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb openbox xterm x11-utils imagemagick dunst dbus-user-session dbus-x11 libglib2.0-bin \
            build-essential pkg-config libxi-dev libxtst-dev libx11-dev libxrandr-dev libxcb1-dev libxdo-dev libxss-dev \
            libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
          {
            echo "user: $(id)"; lsb_release -ds; systemctl --version | head -1
            echo "sessions:"; loginctl list-sessions --no-pager
            echo "pid1: $(ps -p 1 -o comm=)"
          } 2>&1 | tee "$EV/env.txt"
      - name: Build the deb
        working-directory: apps/capture
        env:
          KORTIX_RELEASE_TAG: ${{ inputs.tag }}
          KORTIX_DEFAULT_ISSUER_URL: ${{ inputs.issuer_url }}
        run: |
          set -euo pipefail
          # The update public key (apps/capture/update-public-key.txt, public) is compiled in; without it the app never updates.
          if [ -s update-public-key.txt ]; then export KORTIX_CAPTURE_UPDATE_PUBLIC_KEY="$(tr -d '[:space:]' < update-public-key.txt)"; fi
          cargo build --release --features native-recorders,memory-ui,tray-linux --bin kortix-capture --bin kortix-capture-engine --bin kortix-backend
          python3 scripts/install_privacy_runtime.py --platform linux-x86_64 --destination target/release
          if grep -q "127.0.0.1:8899" target/release/kortix-capture; then echo "::error::the release binary contains the updater's test manifest URL"; exit 1; fi
          echo "test manifest URL in the release binary: no" | tee "$EV/no_test_hook.txt"
          installer/linux/build-deb.sh "$TAG" target/release "$RUNNER_TEMP/kortix-capture_${TAG}_amd64.deb" 2>&1 | tee "$EV/build.txt"
          dpkg-deb --contents "$RUNNER_TEMP/kortix-capture_${TAG}_amd64.deb" | grep -v "/skill" | tee "$EV/deb-files.txt"
          readelf -d target/release/kortix-capture | grep NEEDED | tee "$EV/needed.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-installer-linux
          path: ${{ runner.temp }}/kortix-capture_${{ inputs.tag }}_amd64.deb
          if-no-files-found: error
      - name: S3 (versitygw) and the CI stand-in for Kortix
        run: |
          d="$RUNNER_TEMP/s3"; mkdir -p "$d/data" "$d/bin"
          curl -sSfL https://github.com/versity/versitygw/releases/download/v1.8.0/versitygw_v1.8.0_Linux_x86_64.tar.gz | tar -xz -C "$d/bin"
          nohup "$(find "$d/bin" -name versitygw -type f | head -1)" --port 127.0.0.1:9000 --access cikortix --secret cikortix-secret-123 posix "$d/data" > "$EV/versitygw.out.log" 2> "$EV/versitygw.err.log" &
          sleep 4
          token="kortix_enr_ci$(uuidgen | tr -d - | tr A-Z a-z)"
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          nohup python3 apps/capture/scripts/ci_fake_issuer.py --port 8787 --token "$token" --log "$EV/issuer.jsonl" \
            --s3-endpoint http://127.0.0.1:9000 --bucket capture --access-key cikortix --secret-key cikortix-secret-123 \
            > "$EV/issuer.out.log" 2> "$EV/issuer.err.log" &
          for i in $(seq 1 15); do curl -s -o /dev/null -X POST http://127.0.0.1:8787/v1/nothing && break; sleep 2; done
          # The organization's notice: the app shows one only when the policy has one.
          mkdir -p "$d/data/capture/orgs/00000000-0000-4000-8000-00000000c1c1"
          printf '{"schema": 2, "notice": "Recorded for the CI verification."}' > "$d/data/capture/orgs/00000000-0000-4000-8000-00000000c1c1/policy.json"

      - name: A graphical session for the runner user (logind, X11)
        run: |
          me="$(id -un)"; uid="$(id -u)"
          # The screen changes every second: the recorder saves a frame only when it changed.
          sudo tee /usr/local/bin/kcap-ci-session.sh > /dev/null <<'SH'
          #!/bin/bash
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          openbox &
          dunst &
          xterm -fa Monospace -fs 16 -geometry 90x20+50+50 -e bash -c 'echo KORTIX CAPTURE DEB VERIFY; while sleep 1; do printf "\r%s   " "$(date +%T)"; done' &
          wait
          SH
          sudo chmod +x /usr/local/bin/kcap-ci-session.sh
          sudo tee /etc/systemd/system/kcap-ci-session.service > /dev/null <<UNIT
          [Unit]
          Description=CI graphical session
          [Service]
          User=$me
          PAMName=login
          Environment=XDG_SESSION_TYPE=x11
          Environment=XDG_SESSION_CLASS=user
          Environment=DISPLAY=:99
          Environment=NO_AT_BRIDGE=1
          StandardInput=null
          ExecStart=/usr/local/bin/kcap-ci-session.sh
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl start kcap-ci-session.service
          sleep 8
          {
            loginctl list-sessions --no-pager
            for s in $(loginctl list-sessions --no-legend | awk '{print $1}'); do echo "-- session $s"; loginctl show-session "$s" -p User -p Name -p Type -p Class -p State -p Remote -p Display; done
            echo "user manager: $(systemctl is-active user@$uid.service)"
            echo "x11 sockets: $(ls /tmp/.X11-unix)"
          } 2>&1 | tee "$EV/session.txt"
          # The notice goes to the session bus: record every Notify call.
          nohup sudo -u "$me" env DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" dbus-monitor "interface='org.freedesktop.Notifications',member='Notify'" > "$EV/notify.dbus" 2> "$EV/notify.dbus.err" &
          sleep 2
      - name: Install as IT would
        run: |
          deb="$RUNNER_TEMP/kortix-capture_${TAG}_amd64.deb"
          sudo install -d -m 755 /etc/kortix
          printf '{"url": "http://127.0.0.1:8787", "enrollment_token": "%s"}' "$TOKEN" | sudo tee /etc/kortix/capture.json > /dev/null
          sudo chmod 600 /etc/kortix/capture.json
          sudo apt-get install -y -q "$deb" 2>&1 | tail -15 | tee "$EV/apt-install.txt"
          {
            echo "installed: $(dpkg-query -W -f='${Version}' kortix-capture)"
            echo "machine service: $(systemctl is-active kortix-capture-machine.service) / $(systemctl is-enabled kortix-capture-machine.service)"
            echo "user unit enabled globally: $(systemctl --global is-enabled kortix-capture.service)"
            ls -l /usr/bin/kortix-capture /usr/bin/kortix-capture-engine /usr/bin/kortix-backend /usr/lib/systemd/system/kortix-capture-machine.service /usr/lib/systemd/user/kortix-capture.service /etc/xdg/autostart/kortix-capture-tray.desktop
            ls -ln /etc/kortix/capture.json
          } 2>&1 | tee "$EV/install.txt"
          cat /usr/lib/systemd/system/kortix-capture-machine.service /usr/lib/systemd/user/kortix-capture.service > "$EV/units.txt"
      - name: Sign-in reaches the real Kortix through Cloudflare (dev-api.kortix.com)
        run: |
          # The CI stand-in issuer is local; Cloudflare in front of Kortix refused requests
          # without a User-Agent (403) and only a real host shows it. No secret needed: the
          # device grant starts unauthenticated, and nothing is approved.
          lib="$(mktemp -d)"; log="$lib/out.txt"; ok=""
          for i in 1 2 3; do
            # The code goes to stderr; macOS has no `timeout`: run it in the background and poll.
            KORTIX_CAPTURE_DIR="$lib" /usr/bin/kortix-capture sync setup --provider kortix --issuer https://dev-api.kortix.com --no-browser > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do grep -q "user_code=" "$log" && ok=1 && break; sleep 1; done
            kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
            [ -n "$ok" ] && break
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::sign-in did not start at dev-api.kortix.com"; tail -20 "$log"; rm -rf "$lib"; exit 1; }
          rm -rf "$lib"
          echo "sign-in started at dev-api.kortix.com (device code issued)" | tee "$EV/cloudflare-signin.txt"
      - name: The signed-in person is enrolled and recorded
        run: |
          me="$(id -un)"; uid="$(id -u)"; k=/usr/bin/kortix-capture
          t0=$SECONDS; state=""
          until [ "$state" = "enrolled" ] || [ $((SECONDS - t0)) -ge 300 ]; do
            sleep 5
            state="$(python3 -c "import json;d=json.load(open('/var/lib/kortix/capture/machine.json'));print((d['sessions'] or [{}])[0].get('state',''))" 2>/dev/null || true)"
          done
          cp /var/lib/kortix/capture/machine.json "$EV/machine.json" || true
          sudo cp /var/lib/kortix/capture/logs/machine.log "$EV/machine.log" || true
          $k --json status > "$EV/user_status.json" 2>&1 || true
          $k --json sync status > "$EV/user_sync.json" 2>&1 || true
          $k --json machine status > "$EV/machine_status_user.json" 2>&1 || true
          sudo $k --json machine status > "$EV/machine_status_root.json" 2>&1 || true
          $k --json start > "$EV/start_when_managed.json" 2>&1 || true
          rc=0; $k stop > "$EV/stop_when_managed.txt" 2>&1 || rc=$?; echo "stop exit: $rc" >> "$EV/stop_when_managed.txt"
          # Another standard user cannot read the token.
          if sudo -u nobody cat /etc/kortix/capture.json > /dev/null 2>&1; then echo "config readable by nobody: yes" > "$EV/config_read.txt"; else echo "config readable by nobody: no" > "$EV/config_read.txt"; fi
          # The user unit (started by the machine service once enrolled) runs the agent.
          t0=$SECONDS
          until systemctl --machine="$me@.host" --user is-active kortix-capture.service > /dev/null 2>&1 || [ $((SECONDS - t0)) -ge 120 ]; do sleep 3; done
          systemctl --machine="$me@.host" --user status kortix-capture.service --no-pager > "$EV/user_unit.txt" 2>&1 || true
          t0=$SECONDS; frames=0
          until [ "$frames" -ge 10 ] || [ $((SECONDS - t0)) -ge 240 ]; do
            sleep 8
            frames="$($k --json status 2>/dev/null | python3 -c "import json,sys;print((json.load(sys.stdin).get('counts') or {}).get('frames',0))" 2>/dev/null || echo 0)"
          done
          $k --json status > "$EV/user_status.json" 2>&1 || true
          $k --json service status > "$EV/service_status.json" 2>&1 || true
          ps -eo pid,user,ppid,args | grep -E "kortix-capture|kortix-backend" | grep -v grep > "$EV/processes.txt" || true
          cat "$EV/processes.txt"
          for f in "$HOME"/.local/share/ai.kortix.capture/logs/*.log; do echo "== $f"; tail -n 30 "$f"; done > "$EV/user-logs.txt" 2>&1 || true
          DISPLAY=:99 import -window root "$EV/desktop.png" || true
          grep -rIl "$TOKEN" "$HOME/.local/share/ai.kortix.capture" > "$EV/token_in_library.txt" 2>/dev/null || true
          echo "files with the token in the person's library: $(wc -l < "$EV/token_in_library.txt" | tr -d ' ')" | tee -a "$EV/config_read.txt"
      - name: Uploads reach the bucket under the device's folder
        run: |
          prefix="orgs/00000000-0000-4000-8000-00000000c1c1/0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b/"
          t0=$SECONDS
          while :; do
            sleep 10
            keys="$(python3 apps/capture/scripts/ci_fake_issuer.py --s3-endpoint http://127.0.0.1:9000 --bucket capture --access-key cikortix --secret-key cikortix-secret-123 --list "$prefix" 2>&1 || true)"
            if { echo "$keys" | grep -q "manifest.json" && echo "$keys" | grep -q "status.json"; } || [ $((SECONDS - t0)) -ge 300 ]; then break; fi
          done
          echo "$keys" | tee "$EV/bucket.txt"
      - name: The notice, the kill and the reinstall
        run: |
          me="$(id -un)"; uid="$(id -u)"
          # The tray shows the logon notice once, after the policy had time to arrive (45 s at most).
          t0=$SECONDS
          until grep -q "member=Notify" "$EV/notify.dbus" 2>/dev/null || [ $((SECONDS - t0)) -ge 150 ]; do sleep 5; done
          grep -A12 "member=Notify" "$EV/notify.dbus" | head -30 | tee "$EV/notice.txt"
          grep -h "notify\|tray" "$HOME/.local/share/ai.kortix.capture/logs/tray.log" 2>/dev/null | tail -5 | tee -a "$EV/notice.txt"
          ps -eo pid,args | grep -E "kortix-capture tray" | grep -v grep | tee "$EV/tray.txt" || true
          # Kill the agent and the recorders: systemd restarts the unit (Restart=always).
          old="$(systemctl --machine="$me@.host" --user show kortix-capture.service -p MainPID --value)"
          sudo pkill -9 -u "$me" -f "kortix-capture agent" || true
          t0=$SECONDS; new=""
          until [ -n "$new" ] && [ "$new" != "0" ] && [ "$new" != "$old" ] || [ $((SECONDS - t0)) -ge 90 ]; do sleep 2; new="$(systemctl --machine="$me@.host" --user show kortix-capture.service -p MainPID --value)"; done
          printf '{"old": "%s", "new": "%s", "back_after_s": %d}\n' "$old" "$new" $((SECONDS - t0)) | tee "$EV/kill.json"
          # Reinstall the same package: the configuration stays and the services come back.
          sudo dpkg -i "$RUNNER_TEMP/kortix-capture_${TAG}_amd64.deb" 2>&1 | tail -3 | tee "$EV/reinstall.txt"
          sleep 15
          {
            echo "config kept: $(sudo test -f /etc/kortix/capture.json && echo yes || echo no)"
            echo "machine service: $(systemctl is-active kortix-capture-machine.service)"
            echo "agent: $(pgrep -fc 'kortix-capture agent')"
          } | tee -a "$EV/reinstall.txt"
      - name: Purge
        run: |
          me="$(id -un)"
          sudo apt-get purge -y -q kortix-capture 2>&1 | tail -8 | tee "$EV/purge.txt"
          sleep 3
          {
            echo "package: $(dpkg-query -W -f='${db:Status-Abbrev}' kortix-capture 2>/dev/null || echo none)"
            echo "binaries: $(ls /usr/bin/kortix-* 2>/dev/null | wc -l | tr -d ' ')"
            echo "units: $(ls /usr/lib/systemd/system/kortix-capture* /usr/lib/systemd/user/kortix-capture* /etc/systemd/user/default.target.wants/kortix-capture* /etc/systemd/system/multi-user.target.wants/kortix-capture* 2>/dev/null | wc -l | tr -d ' ')"
            echo "config: $([ -e /etc/kortix/capture.json ] && echo present || echo gone)"
            echo "machine data: $([ -e /var/lib/kortix ] && echo present || echo gone)"
            echo "autostart: $([ -e /etc/xdg/autostart/kortix-capture-tray.desktop ] && echo present || echo gone)"
            echo "processes: $(pgrep -fc 'kortix-capture|kortix-backend')"
            echo "user library kept: $([ -f "$HOME/.local/share/ai.kortix.capture/memory.db" ] && echo yes || echo no)"
          } | tee "$EV/purged.txt"
      - name: Assert
        shell: python3 {0}
        run: |
          import json, os, pathlib, re
          ev = pathlib.Path(os.environ["EV"])
          text = lambda n: (ev / n).read_text(errors="replace")
          load = lambda n: json.loads(text(n))
          print(text("env.txt")); print(text("session.txt"))
          sess = text("session.txt")
          assert re.search(r"Type=x11", sess) and "Class=user" in sess and "Remote=no" in sess, "the CI desktop is not a graphical logind session"
          inst = text("install.txt"); print(inst)
          assert "machine service: active / enabled" in inst and "user unit enabled globally: enabled" in inst, inst
          assert "-rw------- 1 0 0" in inst or re.search(r"-rw-------\s+1\s+0\s+0", inst), "config.json is not 0600 root"
          units = text("units.txt")
          assert "ExecStart=/usr/bin/kortix-capture machine run" in units and "ExecStart=/usr/bin/kortix-capture agent" in units, units
          m = load("machine.json"); print("machine", m)
          s = m["sessions"][0]
          assert s["state"] == "enrolled" and s["device_id"], s
          assert s["user"]["account_name"] and s["user"]["principal_name"] is None, s["user"]
          st = load("user_status.json"); sync = load("user_sync.json"); print("user library", st.get("counts"), st.get("enrollment"))
          assert st["managed"] is True and st["enrollment"]["state"] == "enrolled" and st["enrollment"]["account_name"] == "Example Org", st.get("enrollment")
          assert sync["provider"] == "kortix" and sync["enabled"] and sync["kortix"]["managed"], sync["kortix"]
          root = load("machine_status_root.json"); user = load("machine_status_user.json")
          assert root["service"] == "active" and root["config"]["url"] == "http://127.0.0.1:8787" and root["config"]["enrollment_token"] is True, root
          assert user["config"]["enrollment_token"] is False, "a standard user read the enrollment token"
          cfg = text("config_read.txt"); print(cfg)
          assert "config readable by nobody: no" in cfg and "files with the token in the person's library: 0" in cfg, cfg
          assert load("start_when_managed.json")["managed"] is True
          assert "stop exit: 1" in text("stop_when_managed.txt") and "manages Kortix Capture" in text("stop_when_managed.txt")
          log = [json.loads(l) for l in text("issuer.jsonl").splitlines() if l.strip()]
          enrolls = [l for l in log if l["path"].endswith("/enroll")]
          print("enroll answers", [e["status"] for e in enrolls])
          assert enrolls[0]["status"] == 202 and 200 in [e["status"] for e in enrolls], "pending, then enrolled"
          body = enrolls[0]["body"]
          assert body["enrollment_token"] == "<redacted>" and len(body["machine_key_sha256"]) == 64
          assert body["device"]["os"] == "linux" and body["user"]["account_name"] == s["user"]["account_name"], body
          assert any(l["path"].endswith("/credentials") and l["status"] == 200 for l in log), "no credentials fetched"
          assert "active" in text("user_unit.txt"), text("user_unit.txt")
          svc = load("service_status.json"); hb = svc.get("heartbeat", {}); print("heartbeat", {k: hb.get(k) for k in ("managed", "running")}, hb.get("recorder"), hb.get("tray"))
          assert hb.get("managed") is True and hb.get("running") is True, "the user unit is not the managed service"
          assert hb["recorder"]["running"] is True and hb["tray"]["running"] is True, hb
          assert st["counts"]["frames"] >= 10, ("the person's library did not record", text("user-logs.txt")[-2000:])
          keys = text("bucket.txt"); print(keys)
          assert "manifest.json" in keys and "status.json" in keys and ".mp4" in keys, "nothing uploaded under the device folder"
          notice = text("notice.txt"); print(notice)
          assert "member=Notify" in notice and "Example Org" in notice and "Recorded for the CI verification." in notice, "the organization notice did not reach the session bus"
          kill = load("kill.json"); print("kill", kill)
          assert kill["new"] not in ("", "0", kill["old"]) and kill["back_after_s"] <= 60, kill
          re_ = text("reinstall.txt"); print(re_)
          assert "config kept: yes" in re_ and "machine service: active" in re_ and re.search(r"agent: [1-9]", re_), re_
          un = text("purged.txt"); print(un)
          assert re.search(r"package: (none|un)", un), un
          for line in ("binaries: 0", "units: 0", "config: gone", "machine data: gone", "autostart: gone", "processes: 0", "user library kept: yes"):
              assert line in un, (line, un)
          print("ALL LINUX DEB ASSERTIONS PASSED")
      - name: Updater - build the test versions N and N+1
        working-directory: apps/capture
        run: |
          set -euo pipefail
          # TEST builds, never released: the update public key is made here, the manifest is a local
          # server, a check runs every 15 s. They differ only in the version (dev.7000001, dev.7000002).
          base="$(printf '%s' "$TAG" | sed -E 's/^v//; s/[-+].*$//')"
          u="$RUNNER_TEMP/upd"
          export KORTIX_CAPTURE_UPDATE_PUBLIC_KEY="$(node scripts/ci_update_tool.mjs keygen "$u")"
          export KORTIX_CAPTURE_UPDATE_TEST_MANIFEST_URL=http://127.0.0.1:8899/capture-update.json
          export KORTIX_CAPTURE_UPDATE_TEST_INTERVAL_SECS=15 KORTIX_CAPTURE_UPDATE_TEST_HEALTH_SECS=120
          for i in 1 2; do
            tag="v$base-dev.700000$i"
            KORTIX_RELEASE_TAG="$tag" cargo build --release --features native-recorders,memory-ui,tray-linux --bin kortix-capture --bin kortix-capture-engine --bin kortix-backend
            installer/linux/build-deb.sh "$tag" target/release "$u/kortix-capture_${tag}_amd64.deb" 2>&1 | tail -3
          done
          echo "UPD_BASE=$base" >> "$GITHUB_ENV"
      - name: Updater - N updates to N+1 (signed manifest, rollback, refusals)
        run: |
          u="$RUNNER_TEMP/upd"; mkdir -p "$u/work"
          python3 apps/capture/scripts/ci_update_test.py --os linux --work "$u/work" --key "$u/update-key.pem" \
            --n-installer "$u/kortix-capture_v$UPD_BASE-dev.7000001_amd64.deb" --n1-installer "$u/kortix-capture_v$UPD_BASE-dev.7000002_amd64.deb" \
            --n-version "v$UPD_BASE-dev.7000001" --n1-version "v$UPD_BASE-dev.7000002" \
            --token "$TOKEN" --evidence "$EV/updater"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capture-evidence-linux
          path: evidence
          retention-days: 14
          if-no-files-found: ignore

  macos-personal:
    name: macOS pkg, personal install (onboarding, background-always, no Dock)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: macos-latest
    env:
      EV: ${{ github.workspace }}/evidence
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/capture
          key: capture-pkg-personal
      - name: Window script tests
        working-directory: apps/capture
        run: |
          mkdir -p "$EV"
          node ui/memory/settings.test.mjs
          node ui/memory/timeline.test.mjs
      - name: Build the arm64 pkg and expand it
        working-directory: apps/capture
        env:
          ARCHS: arm64
          APPLE_CODESIGN_IDENTITY: "-"
        run: |
          installer/macos/build-pkg.sh "$TAG" "$RUNNER_TEMP/pkg/KortixCapture-$TAG-arm64.pkg" 2>&1 | tee "$EV/build.txt"
          pkgutil --expand-full "$RUNNER_TEMP/pkg/KortixCapture-$TAG-arm64.pkg" "$RUNNER_TEMP/expanded"
          app="$(find "$RUNNER_TEMP/expanded" -name 'Kortix Capture.app' -maxdepth 4 | head -1)"
          echo "APP=$app" >> "$GITHUB_ENV"
          plutil -p "$app/Contents/Info.plist" > "$EV/info-plist.txt"
          # The icon: an .icns with every size, and the largest is the 1024 master.
          iconutil -c iconset "$app/Contents/Resources/kortix-capture.icns" -o "$RUNNER_TEMP/icon.iconset"
          ls "$RUNNER_TEMP/icon.iconset" | tee "$EV/iconset.txt"
          sips -g pixelWidth "$RUNNER_TEMP/icon.iconset/icon_512x512@2x.png" | tee -a "$EV/iconset.txt"
      - name: S3 (versitygw) and the CI stand-in for Kortix
        run: |
          d="$RUNNER_TEMP/s3"; mkdir -p "$d/data" "$d/bin"
          gh release download v1.8.0 --repo versity/versitygw -p "versitygw_v1.8.0_Darwin_arm64.tar.gz" -D "$d"
          tar -xzf "$d/versitygw_v1.8.0_Darwin_arm64.tar.gz" -C "$d/bin"
          gw="$(find "$d/bin" -name versitygw -type f | head -1)"
          nohup "$gw" --port 127.0.0.1:9000 --access cikortix --secret cikortix-secret-123 posix "$d/data" > "$EV/versitygw.out.log" 2> "$EV/versitygw.err.log" &
          sleep 4
          token="kortix_enr_ci$(uuidgen | tr -d - | tr A-Z a-z)"
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          echo "S3DATA=$d/data" >> "$GITHUB_ENV"
          nohup python3 apps/capture/scripts/ci_fake_issuer.py --port 8787 --token "$token" --log "$EV/issuer.jsonl" --approve-after 10 \
            --s3-endpoint http://127.0.0.1:9000 --bucket capture --access-key cikortix --secret-key cikortix-secret-123 \
            > "$EV/issuer.out.log" 2> "$EV/issuer.err.log" &
          for i in $(seq 1 15); do curl -s -o /dev/null -X POST http://127.0.0.1:8787/v1/nothing && break; sleep 2; done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: A screen that changes every second
        run: |
          # The recorder saves a frame only when the screen changed. Terminal runs the clock.
          printf '#!/bin/bash\nwhile true; do clear; echo KORTIX CAPTURE APP VERIFY; date +%%T; sleep 1; done\n' > "$RUNNER_TEMP/clock.command"
          chmod +x "$RUNNER_TEMP/clock.command"
          open "$RUNNER_TEMP/clock.command" || true
          # The clock sits in the bottom-right corner: it must not cover the app's window in the screenshots.
          sleep 4
          osascript >/dev/null 2>&1 <<'APPLESCRIPT' || true
          tell application "System Events"
            tell process "Terminal"
              set position of window 1 to {640, 600}
              set size of window 1 to {360, 110}
            end tell
          end tell
          APPLESCRIPT
      - name: Plant a legacy install (old tray and service agents, a copy in ~/Applications)
        run: |
          uid="$(id -u)"
          old="$HOME/Applications/Kortix Capture.app/Contents/MacOS"
          mkdir -p "$old" "$HOME/Library/LaunchAgents" "$HOME/Library/Application Support/ai.kortix.capture"
          printf '#!/bin/sh\nexec sleep 3000\n' > "$old/kortix-tray"; chmod +x "$old/kortix-tray"
          printf '#!/bin/sh\nexec sleep 3001\n' > "$old/Kortix Capture"; chmod +x "$old/Kortix Capture"
          echo "personal library file" > "$HOME/Library/Application Support/ai.kortix.capture/keep.txt"
          for spec in "ai.kortix.capture.tray|$old/kortix-tray" "ai.kortix.capture.service.deadbeef|$old/Kortix Capture"; do
            label="${spec%%|*}"; prog="${spec#*|}"
            cat > "$HOME/Library/LaunchAgents/$label.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>Label</key><string>$label</string>
          <key>ProgramArguments</key><array><string>$prog</string></array>
          <key>RunAtLoad</key><true/><key>KeepAlive</key><true/></dict></plist>
          PLIST
            launchctl bootstrap "gui/$uid" "$HOME/Library/LaunchAgents/$label.plist" || true
          done
          sleep 3
          { ls "$HOME/Library/LaunchAgents"; pgrep -fl "$HOME/Applications/Kortix Capture.app" || true; } | tee "$EV/legacy-planted.txt"
          grep -q kortix-tray "$EV/legacy-planted.txt" || echo "warning: the planted tray is not running"
      - name: Install the pkg on a personal computer (no configuration); onboarding opens
        run: |
          shot() { killall UserNotificationCenter 2>/dev/null || true; sleep 1; screencapture -x "$EV/$1.png"; }
          sudo installer -pkg "$RUNNER_TEMP/pkg/KortixCapture-$TAG-arm64.pkg" -target / 2>&1 | tee "$EV/installer.txt"
          exe="/Applications/Kortix Capture.app/Contents/MacOS/Kortix Capture"
          echo "EXE=$exe" >> "$GITHUB_ENV"
          lib="$HOME/Library/Application Support/ai.kortix.capture"
          echo "LIB=$lib" >> "$GITHUB_ENV"
          # The installer opens the window once, on onboarding. The recorder already runs in the background.
          t0=$SECONDS
          until [ -f "$lib/ui.lock" ] || [ $((SECONDS - t0)) -ge 90 ]; do sleep 1; done
          echo "ui.lock after $((SECONDS - t0)) s: $([ -f "$lib/ui.lock" ] && echo yes || echo no)" | tee "$EV/window.txt"
          sleep 4
          killall UserNotificationCenter 2>/dev/null || true; sleep 2
          # The front-most normal window (CGWindowList is ordered front to back) belongs to Kortix Capture.
          osascript -l JavaScript > "$EV/frontmost.txt" 2>&1 <<'JXA' || true
          ObjC.import('CoreGraphics');
          var l = ObjC.deepUnwrap(ObjC.castRefToObject($.CGWindowListCopyWindowInfo($.kCGWindowListOptionOnScreenOnly | $.kCGWindowListExcludeDesktopElements, 0)));
          var w = l.filter(function (x) { return x.kCGWindowLayer == 0 && ['Window Server', 'universalAccessAuthWarn', 'UserNotificationCenter', 'SecurityAgent', 'Dock'].indexOf(x.kCGWindowOwnerName) < 0; });
          w[0].kCGWindowOwnerName;
          JXA
          t0=$SECONDS; state=""
          until [ -n "$state" ] && [ "$state" != "not_recording" ] || [ $((SECONDS - t0)) -ge 90 ]; do
            sleep 3; state="$("$exe" --json status 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin).get("state",""))' 2>/dev/null || true)"
          done
          echo "state before the permission: $state" | tee "$EV/state-before-permission.txt"
          "$exe" --json onboard --status > "$EV/onboarding-status-install.json" 2>&1 || true
          sleep 6
          shot onboarding-permission
          # Allow Screen Recording (the runner image may refuse the TCC write: the shot above then stays the last step).
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for svc in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServiceListenEvent; do
              sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('$svc','ai.kortix.capture',0,2,4,1,0,strftime('%s','now'));" >> "$EV/tcc.txt" 2>&1 && echo "tcc write ok: $svc $db" >> "$EV/tcc.txt" || echo "tcc write refused: $svc $db" >> "$EV/tcc.txt"
            done
          done
          cat "$EV/tcc.txt"
          t0=$SECONDS; state=""
          until [ "$state" = "recording" ] || [ $((SECONDS - t0)) -ge 150 ]; do
            sleep 3; state="$("$exe" --json status 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin).get("state",""))' 2>/dev/null || true)"
          done
          echo "state after install: $state (after $((SECONDS - t0)) s)" | tee "$EV/state-after-install.txt"
          sleep 8
          # The window the installer opened is the one in front (an accessory app still takes focus).
          shot onboarding-connect
          { echo "tray lock: $([ -f "$lib/tray.lock" ] && echo yes || echo no)"; echo "notify lines:"; grep -rh "\[notify\]" "$lib/logs" 2>/dev/null | head -5 || true; echo "recorder: $(pgrep -f 'kortix-capture record|Kortix Capture record' | wc -l | tr -d ' ')"; } 2>&1 | tee "$EV/silent-install.txt"
          { echo "legacy plists left: $(ls "$HOME/Library/LaunchAgents" | grep -Ec 'ai\.kortix\.capture\.(tray|service)' || true)"; echo "legacy processes left: $(pgrep -f "$HOME/Applications/Kortix Capture.app" | wc -l | tr -d ' ')"; echo "library kept: $(cat "$HOME/Library/Application Support/ai.kortix.capture/keep.txt" 2>/dev/null || echo MISSING)"; } | tee "$EV/legacy-after.txt"
          lsappinfo list > "$EV/lsappinfo-installed.txt" 2>&1 || true
          "$exe" --json sync status > "$EV/sync-off.json" 2>&1 || true
          "$exe" --json status > "$EV/status-installed.json" 2>&1 || true
      - name: Sign in from onboarding (the sign-in is approved after 10 s), sync turns on by itself
        run: |
          shot() { killall UserNotificationCenter 2>/dev/null || true; sleep 1; screencapture -x "$EV/$1.png"; }
          "$EXE" login --no-browser --issuer http://127.0.0.1:8787 > "$EV/onboarding-signin.txt" 2>&1 &
          pid=$!
          t0=$SECONDS
          until grep -q user_code "$LIB/connect.json" 2>/dev/null || [ $((SECONDS - t0)) -ge 40 ]; do sleep 1; done
          sleep 3
          cp "$LIB/connect.json" "$EV/connect-waiting.json" 2>/dev/null || true
          shot onboarding-waiting
          wait $pid || true
          sleep 6
          shot onboarding-done
          "$EXE" --json sync status > "$EV/sync-after.json" 2>&1 || true
          "$EXE" --json onboard --status > "$EV/onboarding-status-signedin.json" 2>&1 || true
          # No click after the sign-in: recordings upload.
          t0=$SECONDS; up=0
          until [ "$up" -ge 1 ] || [ $((SECONDS - t0)) -ge 180 ]; do
            sleep 5; up="$("$EXE" --json sync status 2>/dev/null | python3 -c 'import json,sys;print((json.load(sys.stdin).get("state") or {}).get("uploaded",0))' 2>/dev/null || echo 0)"
          done
          echo "uploaded chunks after the sign-in: $up (after $((SECONDS - t0)) s)" | tee "$EV/uploads.txt"
          "$EXE" --json sync status > "$EV/sync-uploaded.json" 2>&1 || true
      - name: The window is a guest, the agent always comes back
        run: |
          shot() { killall UserNotificationCenter 2>/dev/null || true; sleep 1; screencapture -x "$EV/$1.png"; }
          frames() { "$EXE" --json status 2>/dev/null | python3 -c 'import json,sys;print((json.load(sys.stdin).get("counts") or {}).get("frames",0))' 2>/dev/null || echo 0; }
          recpid() { pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture record' | head -1; }
          agentpid() { pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture agent' | head -1; }
          # The window is open (onboarding). No Kortix process is a Dock app.
          lsappinfo list > "$EV/lsappinfo-window-open.txt" 2>&1 || true
          # No Dock app while the window is open: System Events lists the foreground (Dock) apps.
          osascript -e 'tell application "System Events" to get name of every application process whose background only is false' > "$EV/foreground-apps.txt" 2>&1 || true
          # The Dock keeps a "recent applications" tile for an app that ran once: evidence, not a running app.
          defaults read com.apple.dock recent-apps > "$EV/dock-recent-apps.txt" 2>&1 || true
          defaults read com.apple.dock persistent-apps > "$EV/dock-persistent-apps.txt" 2>&1 || true
          shot dock-window-open
          pid0="$(recpid)"; agent0="$(agentpid)"; f0="$(frames)"
          echo "before: recorder $pid0 agent $agent0 frames $f0" | tee "$EV/guest.txt"
          # Closing the window (the window process ends) changes nothing for the recorder.
          pkill -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture ui' || true
          sleep 30
          pid1="$(recpid)"; f1="$(frames)"
          echo "after closing the window: recorder $pid1 frames $f1" | tee -a "$EV/guest.txt"
          # A Quit sent to the app (osascript) and a kill -9 of the agent: it is back within 15 s and records.
          osascript -e 'quit app "Kortix Capture"' >/dev/null 2>&1 || true
          sleep 3
          kill -9 "$(agentpid)" 2>/dev/null || true
          t0=$SECONDS; back=""
          until [ -n "$back" ] || [ $((SECONDS - t0)) -ge 30 ]; do sleep 1; back="$(agentpid)"; done
          echo "agent back after $((SECONDS - t0)) s: ${back:-none}" | tee -a "$EV/guest.txt"
          sleep 25
          state="$("$EXE" --json status 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin).get("state",""))' 2>/dev/null || true)"
          f2="$(frames)"
          echo "after the kill: state $state frames $f2" | tee -a "$EV/guest.txt"
      - name: Restart and Quit (the menu-bar items), then open the app again
        run: |
          agentpid() { pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture agent' | head -1; }
          recpid() { pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture record' | head -1; }
          traypid() { pgrep -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture tray' | head -1; }
          waitfor() { local t0=$SECONDS; until eval "$1" || [ $((SECONDS - t0)) -ge "$2" ]; do sleep 1; done; eval "$1"; }
          a0="$(agentpid)"; r0="$(recpid)"
          echo "before: agent $a0 recorder $r0 tray $(traypid)" | tee "$EV/quit-restart.txt"
          "$EXE" --json restart | tee -a "$EV/quit-restart.txt"
          waitfor '[ -n "$(agentpid)" ] && [ "$(agentpid)" != "$a0" ] && [ -n "$(recpid)" ] && [ "$(recpid)" != "$r0" ]' 60 \
            || { echo "::error::restart: the agent and recorder did not come back as new processes"; exit 1; }
          echo "after restart: agent $(agentpid) recorder $(recpid) tray $(traypid)" | tee -a "$EV/quit-restart.txt"
          "$EXE" --json quit | tee -a "$EV/quit-restart.txt"
          waitfor '[ -z "$(agentpid)$(recpid)$(traypid)" ]' 30 || { echo "::error::quit: something still runs"; ps aux | grep -i 'kortix capture' | grep -v grep; exit 1; }
          sleep 25  # KeepAlive would have brought it back by now
          [ -z "$(agentpid)$(recpid)$(traypid)" ] || { echo "::error::quit did not hold: the agent came back by itself"; exit 1; }
          echo "after quit (+25 s): nothing runs" | tee -a "$EV/quit-restart.txt"
          open -g -a "Kortix Capture"
          waitfor '[ -n "$(agentpid)" ] && [ -n "$(recpid)" ]' 60 || { echo "::error::opening the app did not start recording again"; exit 1; }
          echo "after opening the app: agent $(agentpid) recorder $(recpid)" | tee -a "$EV/quit-restart.txt"
          pkill -f 'Kortix Capture.app/Contents/MacOS/Kortix Capture ui' || true
      - name: Keyboard and mouse are recorded and uploaded
        run: |
          # The action recorder needs Accessibility and Input Monitoring (the personal install asks for them in the
          # permission step). Type into the clock's Terminal for 70 s, then wait for the action segments to upload.
          "$EXE" --json service status > "$EV/service-status.json" 2>&1 || true
          python3 - "$EV/service-status.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          hb = d.get("heartbeat") or d
          print("granted:", hb.get("granted"), "actions:", (hb.get("actions") or {}))
          PY
          for i in $(seq 1 35); do
            osascript -e 'tell application "System Events" to keystroke "kortix capture input check "' >/dev/null 2>&1 || true
            sleep 2
          done
          t0=$SECONDS; n=0
          until [ "$n" -ge 1 ] || [ $((SECONDS - t0)) -ge 150 ]; do
            sleep 5
            n="$("$EXE" --json sync status 2>/dev/null | python3 -c 'import json,sys;s=(json.load(sys.stdin).get("state") or {});print(s.get("actions_uploaded",0)+s.get("actions_pending",0))' 2>/dev/null || echo 0)"
          done
          echo "action segments (uploaded or pending): $n (after $((SECONDS - t0)) s)" | tee "$EV/actions.txt"
          "$EXE" --json sync status > "$EV/sync-actions.json" 2>&1 || true
          "$EXE" --json service status > "$EV/service-status-after.json" 2>&1 || true
      - name: The status tells the truth while frames rise
        run: |
          # Sample the three readers of the one state (status --json = status.json's source, /api/app and the tray
          # use the same function) against what the recorder really does: frames, and its own status file.
          : > "$EV/state-samples.txt"
          for i in $(seq 1 25); do
            python3 - "$LIB" "$EXE" >> "$EV/state-samples.txt" <<'PY'
          import json, subprocess, sys, time, os
          lib, exe = sys.argv[1], sys.argv[2]
          st = json.loads(subprocess.run([exe, "--json", "status"], capture_output=True, text=True).stdout or "{}")
          try:
              rec = json.load(open(os.path.join(lib, "recorder.json")))
          except Exception:
              rec = {}
          age = int(time.time() * 1000) - rec.get("updated_at_ms", 0)
          print(json.dumps({"t": int(time.time()), "frames": (st.get("counts") or {}).get("frames", 0), "state": st.get("state"),
                            "rec_state": rec.get("state"), "rec_reason": rec.get("inactive_reason"), "rec_age_ms": age,
                            "running": st.get("recorder_running"), "inactive_reason": st.get("inactive_reason"),
                            "missing": st.get("missing_permissions")}))
          PY
            sleep 2
          done
          cp "$LIB/recorder.json" "$EV/recorder-final.json" 2>/dev/null || true
          tail -3 "$EV/state-samples.txt"
      - name: Sign out, skip onboarding, open the app again
        run: |
          shot() { killall UserNotificationCenter 2>/dev/null || true; sleep 1; screencapture -x "$EV/$1.png"; }
          "$EXE" --json status > "$EV/status-before-signout1.json" 2>&1 || true
          "$EXE" --json sync sign-out > "$EV/signout.json" 2>&1 || true
          "$EXE" --json status > "$EV/status-after-signout.json" 2>&1 || true
          "$EXE" --json onboard --status > "$EV/onboarding-status-signedout.json" 2>&1 || true
          "$EXE" --json onboard --skip > "$EV/onboarding-status-skipped.json" 2>&1 || true
          pkill -f "Kortix Capture.app/Contents/MacOS/Kortix Capture ui" || true
          sleep 3
          open -a "Kortix Capture"
          t0=$SECONDS
          until [ -f "$LIB/ui.lock" ] || [ $((SECONDS - t0)) -ge 90 ]; do sleep 1; done
          sleep 8
          lsappinfo list > "$EV/lsappinfo-open.txt" 2>&1 || true
          shot launch-timeline
          # A second launch hands over to the running window and exits.
          rc=0; "$EXE" > "$EV/second.log" 2>&1 || rc=$?; echo "second launch exit: $rc" | tee "$EV/second.txt"
      - name: The status tells the truth after a sign-out and a skip
        run: |
          # Sample the three readers of the one state (status --json = status.json's source, /api/app and the tray
          # use the same function) against what the recorder really does: frames, and its own status file.
          : > "$EV/state-samples-after-signout.txt"
          for i in $(seq 1 12); do
            python3 - "$LIB" "$EXE" >> "$EV/state-samples-after-signout.txt" <<'PY'
          import json, subprocess, sys, time, os
          lib, exe = sys.argv[1], sys.argv[2]
          st = json.loads(subprocess.run([exe, "--json", "status"], capture_output=True, text=True).stdout or "{}")
          try:
              rec = json.load(open(os.path.join(lib, "recorder.json")))
          except Exception:
              rec = {}
          age = int(time.time() * 1000) - rec.get("updated_at_ms", 0)
          print(json.dumps({"t": int(time.time()), "frames": (st.get("counts") or {}).get("frames", 0), "state": st.get("state"),
                            "rec_state": rec.get("state"), "rec_reason": rec.get("inactive_reason"), "rec_age_ms": age,
                            "running": st.get("recorder_running"), "inactive_reason": st.get("inactive_reason"),
                            "missing": st.get("missing_permissions")}))
          PY
            sleep 2
          done
          cp "$LIB/recorder.json" "$EV/recorder-final2.json" 2>/dev/null || true
          tail -3 "$EV/state-samples-after-signout.txt"
      - name: The menu-bar menu (best effort, needs GUI scripting)
        run: |
          # The agent's process owns the status item; the window process has none.
          osascript > "$EV/tray-menu.txt" 2>&1 <<'APPLESCRIPT' || true
          set ev to system attribute "EV"
          tell application "System Events"
            repeat with p in (every process whose name is "Kortix Capture")
              repeat with idx in {2, 1}
                try
                  click menu bar item 1 of menu bar idx of p
                  delay 1
                  set names to name of every menu item of menu 1 of menu bar item 1 of menu bar idx of p
                  do shell script "screencapture -x " & quoted form of (ev & "/tray-menu.png")
                  click menu bar item 1 of menu bar idx of p
                  return names
                end try
              end repeat
            end repeat
            return "no status item found"
          end tell
          APPLESCRIPT
          cat "$EV/tray-menu.txt"
      - name: Settings with Sync off, the S3 form, Apps and websites
        run: |
          shot() { killall UserNotificationCenter 2>/dev/null || true; sleep 1; screencapture -x "$EV/$1.png"; }
          "$EXE" open kortix-capture://settings >/dev/null 2>&1 & sleep 6; shot settings-sync-off
          "$EXE" open "kortix-capture://settings?sync=s3" >/dev/null 2>&1 & sleep 6; shot settings-sync-s3
          # Privacy controls are off by default: the page goes from Sync to Storage.
          "$EXE" open "kortix-capture://settings?section=storage" >/dev/null 2>&1 & sleep 6; shot settings-privacy-off
          "$EXE" --json settings experimental.privacy_controls true > "$EV/flag-on.json" 2>&1 || true
          "$EXE" --json settings excluded_domains '["mine.example"]' > "$EV/own-entry.json" 2>&1 || true
          "$EXE" open "kortix-capture://settings?section=never" >/dev/null 2>&1 & sleep 6; shot settings-privacy-on
          "$EXE" --json settings experimental.privacy_controls false > /dev/null 2>&1 || true
      - name: Sign in to Kortix while recording; the organization's policy decides the privacy controls
        run: |
          shot() { killall UserNotificationCenter 2>/dev/null || true; sleep 1; screencapture -x "$EV/$1.png"; }
          acct="00000000-0000-4000-8000-00000000c1c1"
          mkdir -p "$S3DATA/capture/orgs/$acct"
          policy() { printf '{"schema":2,"privacy":{"excluded_bundle_ids":["com.example.Required"],"exclusion_groups":["banking"],"exclude_private_browsing":true},"experimental":{"privacy_controls":%s}}' "$1" > "$S3DATA/capture/orgs/$acct/policy.json"; }
          policy true
          "$EXE" login --no-browser --issuer http://127.0.0.1:8787 > "$EV/signin.txt" 2>&1 || true
          "$EXE" --json sync status > "$EV/sync-after2.json" 2>&1 || true
          # The policy arrives within a minute.
          t0=$SECONDS
          until "$EXE" --json sync status 2>/dev/null | python3 -c 'import json,sys;sys.exit(0 if json.load(sys.stdin).get("policy") else 1)'; do [ $((SECONDS - t0)) -ge 150 ] && break; sleep 5; done
          echo "policy after $((SECONDS - t0)) s" | tee "$EV/policy-wait.txt"
          "$EXE" open "kortix-capture://settings?sync=kortix" >/dev/null 2>&1 & sleep 6; shot settings-sync-kortix
          "$EXE" open "kortix-capture://settings?section=never" >/dev/null 2>&1 & sleep 6; shot settings-privacy-org
          "$EXE" --json sync status > "$EV/sync-synced.json" 2>&1 || true
          # The organization turns the controls off: they hide, and what it required keeps applying.
          policy false
          t0=$SECONDS
          until "$EXE" --json sync status 2>/dev/null | python3 -c 'import json,sys;d=json.load(sys.stdin);sys.exit(0 if d.get("policy",{}).get("policy",{}).get("experimental",{}).get("privacy_controls") is False else 1)'; do [ $((SECONDS - t0)) -ge 150 ] && break; sleep 5; done
          echo "policy flag off after $((SECONDS - t0)) s" | tee -a "$EV/policy-wait.txt"
          "$EXE" open "kortix-capture://settings?section=storage" >/dev/null 2>&1 & sleep 6; shot settings-privacy-org-off
          "$EXE" --json exclusions > "$EV/exclusions-org-off.json" 2>&1 || true
      - name: A managed computer (enrolled by the organization)
        run: |
          m="$RUNNER_TEMP/managed-library"; mkdir -p "$m"
          export KORTIX_CAPTURE_DIR="$m"
          # The stand-in answers the first enrollment "pending" and the next one "enrolled".
          for i in 1 2; do printf '%s' "$TOKEN" | "$EXE" --json sync enroll --issuer http://127.0.0.1:8787 --account-name ci-person >> "$EV/enroll.txt" 2>&1 || true; echo >> "$EV/enroll.txt"; done
          "$EXE" --json sync status > "$EV/sync-managed.json" 2>&1 || true
          "$EXE" --json onboard --status > "$EV/onboarding-status-managed.json" 2>&1 || true
          "$EXE" open kortix-capture://settings > /dev/null 2>&1 &
          sleep 14
          killall UserNotificationCenter 2>/dev/null || true; sleep 1; screencapture -x "$EV/settings-managed.png"
      - name: Assert
        shell: python3 {0}
        run: |
          import json, os, pathlib
          ev = pathlib.Path(os.environ["EV"])
          text = lambda n: (ev / n).read_text(errors="replace")
          import re
          # The recorder ran from the install: recording, or waiting for the macOS permission.
          st = json.loads(text("status-installed.json"))
          assert st["state"] in ("recording", "permission_missing", "paused"), "the status line must not stick: " + st["state"]
          print(text("state-before-permission.txt").strip(), "|", text("state-after-install.txt").strip())
          # No Dock icon while it records in the background: no Kortix process is a foreground app.
          menu = text("tray-menu.txt"); print("tray menu:", menu.strip())
          if "Open Kortix Capture" in menu:
              assert "Settings" in menu and menu.index("Open Kortix Capture") < menu.index("Settings"), menu
              assert "Quit Kortix Capture" in menu and "Restart Kortix Capture" in menu, "the tray offers Restart and Quit: " + menu
              assert "Pause" in menu, menu
          legacy = text("legacy-after.txt"); print(legacy)
          assert "legacy plists left: 0" in legacy and "legacy processes left: 0" in legacy and "library kept: personal library file" in legacy, legacy
          silent = text("silent-install.txt"); print(silent)
          assert "[notify]" not in silent, silent
          # Personal install: the installer opened the window, and onboarding is needed.
          assert "ui.lock after" in text("window.txt") and text("window.txt").strip().endswith("yes"), text("window.txt")
          assert json.loads(text("onboarding-status-install.json"))["needed"] is True, text("onboarding-status-install.json")
          assert "icon_512x512@2x.png" in text("iconset.txt") and "pixelWidth: 1024" in text("iconset.txt"), text("iconset.txt")
          assert "LSUIElement" in text("info-plist.txt"), "no Dock icon, ever"
          assert "second launch exit: 0" in text("second.txt")
          # No Kortix process is a foreground (Dock) app, window open or not.
          for f in ("lsappinfo-installed.txt", "lsappinfo-window-open.txt", "lsappinfo-open.txt"):
              for entry in re.split(r"\n(?=\d+\) )", text(f)):
                  if 'bundleID="ai.kortix.capture"' in entry:
                      assert 'type="Foreground"' not in entry, (f, entry)
          fg = text("foreground-apps.txt")
          print("foreground apps:", fg.strip()[:300])
          if "Finder" in fg:
              assert "Kortix" not in fg, "a Kortix process is a foreground (Dock) app: " + fg
          assert "Kortix Capture" not in text("dock-persistent-apps.txt"), "the Dock must not keep a Kortix tile"
          front = text("frontmost.txt").strip(); print("frontmost after the install:", front)
          assert front == "Kortix Capture", "the onboarding window opened behind another app: " + front
          # Keyboard and mouse: with Accessibility and Input Monitoring granted, the action recorder runs and
          # its segments exist (uploaded or queued).
          act = text("actions.txt"); print(act.strip())
          sv = json.loads(text("service-status-after.json")); hb = sv.get("heartbeat") or sv
          granted = hb.get("granted") or []
          if "accessibility" in granted and "input_monitoring" in granted:
              assert (hb.get("actions") or {}).get("running") is True, "the action recorder is not running: " + json.dumps(hb.get("actions"))
              n = int(re.search(r"\(uploaded or pending\): (\d+)", act).group(1))
              assert n >= 1, "no action segment was recorded while keys were typed: " + act
          else:
              print("warning: the runner did not grant Accessibility and Input Monitoring:", granted)
          # The status never lies: whenever frames rose between two samples, the state read recording
          # (status.json, /api/app and the tray read this one state), before and after a sign-out.
          for f in ("state-samples.txt", "state-samples-after-signout.txt"):
              rows = [json.loads(l) for l in text(f).splitlines() if l.strip()]
              assert len(rows) >= 8, (f, len(rows))
              rose = [(a, b) for a, b in zip(rows, rows[1:]) if b["frames"] > a["frames"]]
              assert rose, "no frames rose in " + f
              for a, b in rose:
                  assert b["state"] == "recording", (f, "frames rose but the state read " + str(b["state"]), b)
              # "needs permission" only when capture really failed: frames did not rise in that sample.
              for a, b in zip(rows, rows[1:]):
                  if b["state"] == "permission_missing":
                      assert b["frames"] <= a["frames"], (f, b)
          menu0 = text("tray-menu.txt").strip()
          if menu0 and "Open Kortix Capture" in menu0:
              rows = [json.loads(l) for l in text("state-samples-after-signout.txt").splitlines() if l.strip()]
              assert menu0.startswith("Recording"), "the tray reads " + menu0.split(",")[0] + " while frames rise"
          # Closing the window changes nothing for the recorder; a killed agent comes back within 15 s and records.
          g = text("guest.txt"); print(g)
          m = re.search(r"before: recorder (\d*) agent (\d*) frames (\d+)", g)
          m2 = re.search(r"after closing the window: recorder (\d*) frames (\d+)", g)
          assert m and m2 and m.group(1) and m.group(1) == m2.group(1), "the recorder pid changed when the window closed: " + g
          assert int(m2.group(2)) > int(m.group(3)), "frames stopped rising while the window was closed: " + g
          back = re.search(r"agent back after (\d+) s: (\d+)", g)
          assert back and int(back.group(1)) <= 15, "the agent did not come back within 15 s: " + g
          after = re.search(r"after the kill: state (\w*) frames (\d+)", g)
          assert after and after.group(1) in ("recording", "permission_missing") and int(after.group(2)) >= int(m2.group(2)), g
          off = json.loads(text("sync-off.json"))
          assert off["enabled"] is False and off["kortix"]["signed_in"] is False, off["kortix"]
          # Sign-in from onboarding: sync is on with no other click, and recordings upload.
          after = json.loads(text("sync-after.json"))
          assert after["enabled"] is True and after["provider"] == "kortix", after
          assert after["kortix"]["signed_in"] is True and after["kortix"]["member_email"] == "person@example.com", after["kortix"]
          assert after["kortix"]["account_name"] == "Example Org", after["kortix"]
          assert json.loads(text("connect-waiting.json"))["progress"]["user_code"] == "CI12-3456", text("connect-waiting.json")
          assert json.loads(text("onboarding-status-signedin.json"))["needed"] is False
          up = int(re.search(r"uploaded chunks after the sign-in: (\d+)", text("uploads.txt")).group(1))
          assert up >= 1, text("uploads.txt")
          # Sign out keeps the recording; onboarding comes back on the next open; skip is remembered.
          out = json.loads(text("signout.json"))
          assert out["signed_out"] is True and out["enabled"] is False, out
          st_before = json.loads(text("status-before-signout1.json")); st_out = json.loads(text("status-after-signout.json"))
          assert st_out["state"] == st_before["state"], (st_before["state"], st_out["state"])
          assert json.loads(text("onboarding-status-signedout.json"))["needed"] is True
          assert json.loads(text("onboarding-status-skipped.json"))["needed"] is False
          ex = text("exclusions-org-off.json"); print(ex[:600])
          assert "com.example.Required" in ex or "banking" in ex, "the organization's exclusions keep applying with the controls hidden"
          managed = json.loads(text("sync-managed.json"))
          assert managed["managed"] is True, managed
          assert json.loads(text("onboarding-status-managed.json"))["needed"] is False, "a managed computer has no onboarding"
          for png in ("dock-window-open.png", "onboarding-permission.png", "onboarding-connect.png", "onboarding-waiting.png", "onboarding-done.png", "launch-timeline.png", "settings-sync-off.png", "settings-sync-s3.png", "settings-privacy-off.png", "settings-privacy-on.png", "settings-sync-kortix.png", "settings-privacy-org.png", "settings-privacy-org-off.png", "settings-managed.png"):
              assert (ev / png).stat().st_size > 10_000, png
          print("ALL MACOS APP ASSERTIONS PASSED")
      - name: Stop the app
        if: always()
        run: |
          pkill -f 'Kortix Capture.app' || true
          sudo launchctl bootout system /Library/LaunchDaemons/ai.kortix.capture.machine.plist 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capture-macos-personal
          path: evidence
          if-no-files-found: ignore

  windows-personal:
    name: Windows, personal install (onboarding, background-always, no taskbar button)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/capture
    env:
      EV: ${{ github.workspace }}\evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/capture
          key: capture-windows-personal
      - name: Window script tests
        run: |
          New-Item -ItemType Directory -Force $env:EV | Out-Null
          node ui/memory/settings.test.mjs
          if ($LASTEXITCODE) { exit 1 }
          node ui/memory/timeline.test.mjs
          if ($LASTEXITCODE) { exit 1 }
      - name: Build
        run: cargo build --release --features native-recorders --bin kortix-capture --bin kortix-capture-engine --bin kortix-backend
      - name: S3 (versitygw) and the CI stand-in for Kortix
        run: |
          $d = "$env:RUNNER_TEMP\s3"; New-Item -ItemType Directory -Force "$d\data", "$d\meta" | Out-Null
          gh release download v1.8.0 --repo versity/versitygw -p "versitygw_v1.8.0_Windows_x86_64.zip" -D $d
          Expand-Archive "$d\versitygw_v1.8.0_Windows_x86_64.zip" -DestinationPath "$d\bin"
          $gw = (Get-ChildItem "$d\bin" -Recurse -Filter versitygw.exe | Select-Object -First 1).FullName
          function Start-Detached($name, $cmdline) {
            $cmd = "$env:RUNNER_TEMP\$name.cmd"
            "@echo off`r`n$cmdline" | Set-Content $cmd -Encoding ascii
            schtasks /Create /TN $name /TR "`"$cmd`"" /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F | Out-Null
            schtasks /Run /TN $name | Out-Null
          }
          Start-Detached "kcap-s3" "`"$gw`" --port 127.0.0.1:9000 --access cikortix --secret cikortix-secret-123 posix --sidecar `"$d\meta`" `"$d\data`" > `"$env:EV\versitygw.out.log`" 2> `"$env:EV\versitygw.err.log`""
          Start-Sleep 3
          $token = "kortix_enr_ci" + [guid]::NewGuid().ToString("N")
          "::add-mask::$token"
          $py = (Get-Command python).Source
          $script = (Resolve-Path scripts/ci_fake_issuer.py).Path
          Start-Detached "kcap-issuer" "`"$py`" `"$script`" --port 8787 --token $token --approve-after 10 --log `"$env:EV\issuer.jsonl`" --s3-endpoint http://127.0.0.1:9000 --bucket capture --access-key cikortix --secret-key cikortix-secret-123 2> `"$env:EV\issuer.err.log`""
          $t0 = Get-Date; $up = $false
          while (-not $up -and ((Get-Date) - $t0).TotalSeconds -lt 30) {
            Start-Sleep 2
            try { Invoke-WebRequest -Method Post http://127.0.0.1:8787/v1/nothing -SkipHttpErrorCheck | Out-Null; $up = $true } catch {}
          }
          if (-not $up) { throw "the CI issuer did not start" }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Open the app on a personal computer (onboarding, tray, background recorder)
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:EV\$name.png")
          }
          $lib = Join-Path $env:RUNNER_TEMP "library"; New-Item -ItemType Directory -Force $lib | Out-Null
          $env:KORTIX_CAPTURE_DIR = $lib
          $exe = (Resolve-Path "target\release\kortix-capture.exe").Path
          # Plant a legacy install (an old Run key and an old scheduled task): the app removes them.
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "Kortix Capture tray" /d "C:\Old\Kortix\kortix-tray.exe" /f | Out-Null
          schtasks /Create /TN "Kortix Capture tray" /TR "C:\Old\Kortix\kortix-tray.exe" /SC ONLOGON /F | Out-Null
          Start-Process $exe -ArgumentList "app" -RedirectStandardError "$env:EV\app.log" -WindowStyle Hidden
          $t0 = Get-Date
          while (-not (Test-Path "$lib\ui.lock") -and ((Get-Date) - $t0).TotalSeconds -lt 90) { Start-Sleep 1 }
          "ui.lock: $(Test-Path "$lib\ui.lock")" | Tee-Object "$env:EV\window.txt"
          $t0 = Get-Date
          while (-not (Test-Path "$lib\tray.lock") -and ((Get-Date) - $t0).TotalSeconds -lt 90) { Start-Sleep 1 }
          "tray.lock: $(Test-Path "$lib\tray.lock")" | Tee-Object "$env:EV\tray-log.txt"
          "run key left: $(reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' | Select-String -SimpleMatch 'Kortix Capture tray' -Quiet)" | Tee-Object "$env:EV\legacy-after.txt"
          schtasks /Query /TN "Kortix Capture tray" 2>$null | Out-Null
          "task left: $($LASTEXITCODE -eq 0)" | Tee-Object -Append "$env:EV\legacy-after.txt"
          & $exe --json onboard --status | Set-Content "$env:EV\onboarding-status-install.json"
          Start-Sleep 8
          Shot "onboarding-connect"
          # Sign in from onboarding: approved 10 s after the code appears. Sync turns on by itself.
          $login = Start-Process $exe -ArgumentList "login --no-browser --issuer http://127.0.0.1:8787" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:EV\signin.txt" -RedirectStandardError "$env:EV\signin.err.txt"
          $t0 = Get-Date
          while (-not ((Test-Path "$lib\connect.json") -and (Select-String -Path "$lib\connect.json" -Pattern "user_code" -Quiet)) -and ((Get-Date) - $t0).TotalSeconds -lt 40) { Start-Sleep 1 }
          Start-Sleep 3
          Copy-Item "$lib\connect.json" "$env:EV\connect-waiting.json" -ErrorAction SilentlyContinue
          Shot "onboarding-waiting"
          $null = $login.WaitForExit(90000)
          Start-Sleep 6
          Shot "onboarding-done"
          & $exe --json sync status | Set-Content "$env:EV\sync-after.json"
          & $exe --json onboard --status | Set-Content "$env:EV\onboarding-status-signedin.json"
          # The window is a guest: closing it leaves the recorder and the service alone.
          function Procs($pattern) { Get-CimInstance Win32_Process -Filter "Name='kortix-capture.exe'" | Where-Object { $_.CommandLine -match $pattern } }
          $rec0 = @(Procs "record").ProcessId
          "recorder before: $($rec0 -join ',')" | Tee-Object "$env:EV\guest.txt"
          Procs " ui(\s|$)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep 20
          $rec1 = @(Procs "record").ProcessId
          "recorder after closing the window: $($rec1 -join ',')" | Tee-Object -Append "$env:EV\guest.txt"
          "window processes left: $(@(Procs ' ui(\s|$)').Count)" | Tee-Object -Append "$env:EV\guest.txt"
          # The taskbar shows no Kortix button while no window is open.
          "windows with a title: $(@(Get-Process kortix-capture -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle }).Count)" | Tee-Object -Append "$env:EV\guest.txt"
          # Sign out, skip onboarding, open the app again: the timeline, no onboarding.
          & $exe --json sync sign-out | Set-Content "$env:EV\signout.json"
          & $exe --json onboard --status | Set-Content "$env:EV\onboarding-status-signedout.json"
          & $exe --json onboard --skip | Set-Content "$env:EV\onboarding-status-skipped.json"
          Start-Process $exe -ArgumentList "open","kortix-capture://timeline" -WindowStyle Hidden; Start-Sleep 10
          Shot "launch-timeline"
          Start-Process $exe -ArgumentList "open","kortix-capture://settings" -WindowStyle Hidden; Start-Sleep 5
          Shot "settings"
          Start-Process $exe -ArgumentList "open","kortix-capture://settings?sync=s3" -WindowStyle Hidden; Start-Sleep 5
          Shot "settings-sync-s3"
          Get-Process kortix-capture -ErrorAction SilentlyContinue | Select-Object Id, MainWindowTitle | Format-Table | Out-String | Tee-Object "$env:EV\processes.txt"
      - name: Restart and Quit (the tray items), then open the app again
        run: |
          $env:KORTIX_CAPTURE_DIR = Join-Path $env:RUNNER_TEMP "library"
          $exe = (Resolve-Path "target\release\kortix-capture.exe").Path
          function Procs($pattern) { @(Get-CimInstance Win32_Process -Filter "Name='kortix-capture.exe'" | Where-Object { $_.CommandLine -match $pattern }) }
          function WaitFor([scriptblock]$ok, [int]$seconds) { $t = (Get-Date).AddSeconds($seconds); while ((Get-Date) -lt $t -and -not (& $ok)) { Start-Sleep 1 }; & $ok }
          $svc0 = (Procs "service run").ProcessId; $rec0 = (Procs " record").ProcessId
          "before: service $($svc0 -join ',') recorder $($rec0 -join ',')" | Tee-Object "$env:EV\quit-restart.txt"
          & $exe --json restart | Tee-Object -Append "$env:EV\quit-restart.txt"
          if (-not (WaitFor { $s = (Procs "service run").ProcessId; $r = (Procs " record").ProcessId; $s -and $r -and -not ($s | Where-Object { $svc0 -contains $_ }) } 60)) { throw "restart: the service and recorder did not come back as new processes" }
          "after restart: service $((Procs 'service run').ProcessId -join ',') recorder $((Procs ' record').ProcessId -join ',')" | Tee-Object -Append "$env:EV\quit-restart.txt"
          & $exe --json quit | Tee-Object -Append "$env:EV\quit-restart.txt"
          if (-not (WaitFor { (Procs "service run|record| tray").Count -eq 0 } 30)) { Procs "." | Format-List ProcessId, CommandLine; throw "quit: something still runs" }
          Start-Sleep 25
          if ((Procs "service run|record| tray").Count -ne 0) { throw "quit did not hold: the service came back by itself" }
          "after quit (+25 s): nothing runs" | Tee-Object -Append "$env:EV\quit-restart.txt"
          Start-Process $exe -ArgumentList "app" -WindowStyle Hidden
          if (-not (WaitFor { (Procs "service run").Count -gt 0 -and (Procs " record").Count -gt 0 } 60)) { throw "opening the app did not start recording again" }
          "after opening the app: service $((Procs 'service run').ProcessId -join ',')" | Tee-Object -Append "$env:EV\quit-restart.txt"
      - name: Assert
        run: |
          $w = Get-Content "$env:EV\window.txt"; if ($w -notmatch "True") { throw "no window: $w" }
          $t = Get-Content "$env:EV\tray-log.txt" -Raw; if ($t -notmatch "True") { throw "no tray: $t" }
          $j = { param($n) Get-Content "$env:EV\$n" -Raw | ConvertFrom-Json }
          $l = Get-Content "$env:EV\legacy-after.txt" -Raw; if ($l -match "True") { throw "a legacy agent is still there: $l" }
          if (-not (& $j "onboarding-status-install.json").needed) { throw "onboarding not needed on a fresh personal install" }
          $a = & $j "sync-after.json"
          if (-not $a.enabled -or $a.provider -ne "kortix") { throw "sync is not on after the sign-in: $($a | ConvertTo-Json -Depth 3)" }
          if ($a.kortix.account_name -ne "Example Org") { throw "no account name" }
          if ((& $j "connect-waiting.json").progress.user_code -ne "CI12-3456") { throw "no code in the waiting step" }
          if ((& $j "onboarding-status-signedin.json").needed) { throw "onboarding still needed after the sign-in" }
          $g = Get-Content "$env:EV\guest.txt" -Raw; Write-Output $g
          $before = [regex]::Match($g, "recorder before: ([\d,]*)").Groups[1].Value
          $after = [regex]::Match($g, "after closing the window: ([\d,]*)").Groups[1].Value
          if (-not $before -or $before -ne $after) { throw "the recorder changed when the window closed: $g" }
          if ($g -notmatch "window processes left: 0") { throw "the window process is still running: $g" }
          if ($g -notmatch "windows with a title: 0") { throw "a window is still open: $g" }
          if (-not (& $j "onboarding-status-signedout.json").needed) { throw "onboarding must return after a sign-out" }
          if ((& $j "onboarding-status-skipped.json").needed) { throw "skip must be remembered" }
          foreach ($f in "onboarding-connect.png", "onboarding-waiting.png", "onboarding-done.png", "launch-timeline.png", "settings.png", "settings-sync-s3.png") { if ((Get-Item "$env:EV\$f").Length -lt 10000) { throw "$f is empty" } }
          "ALL WINDOWS APP ASSERTIONS PASSED"
      - name: Stop the app
        if: always()
        run: Get-Process kortix-capture -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capture-windows-personal
          path: evidence
          if-no-files-found: ignore

  collect:
    name: Collect the installers
    needs: [test, windows-msi, macos-pkg, linux-deb, macos-personal, windows-personal]
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC -> AWS Secrets Manager (.github/actions/aws-env)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            apps/capture/scripts
          persist-credentials: false
      # Optional: the Ed25519 private key (PEM) that signs capture-update.json.
      # Without it the manifest ships unsigned and the step says so.
      - name: Read the update signing key from AWS Secrets Manager
        continue-on-error: true
        uses: ./.github/actions/aws-env
        with:
          keys: |
            CAPTURE_UPDATE_SIGNING_KEY?
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          pattern: capture-installer-*
          merge-multiple: true
      - name: Name, checksum and describe the installers
        env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CAPTURE_UPDATE_SIGNING_KEY: ${{ env.CAPTURE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd installers
          msi="KortixCapture-$TAG-x64.msi"; pkg="KortixCapture-$TAG-universal.pkg"; deb="kortix-capture_${TAG}_amd64.deb"
          for f in "$msi" "$pkg" "$deb"; do [ -s "$f" ] || { echo "::error::missing installer $f"; exit 1; }; done
          # Stable names for the copy-paste install commands (docs, Devices, Roll out).
          cp "$msi" KortixCapture-x64.msi
          cp "$pkg" KortixCapture-universal.pkg
          cp "$deb" kortix-capture_amd64.deb
          tool=../apps/capture/scripts/ci_update_tool.mjs
          key=""
          if [ -n "${CAPTURE_UPDATE_SIGNING_KEY:-}" ]; then
            key="$RUNNER_TEMP/capture-update-key.pem"; printf '%s\n' "$CAPTURE_UPDATE_SIGNING_KEY" > "$key"; chmod 600 "$key"
          fi
          prev=()
          if [ -n "$key" ] && [ "$CHANNEL" = stable ]; then prev=(--previous-from-releases "$REPO" --key "$key"); fi
          node "$tool" manifest --out capture-update.json --version "$TAG" --channel "$CHANNEL" --repo "$REPO" --release-tag "$RELEASE_TAG" \
            --asset "windows=$msi" --asset "macos=$pkg" --asset "linux=$deb" "${prev[@]}"
          if [ -n "$key" ]; then
            node "$tool" sign --key "$key" capture-update.json
            rm -f "$key"
            echo "capture-update.json signed (Ed25519)."
          else
            echo "::warning::CAPTURE_UPDATE_SIGNING_KEY is not in kortix-ci-env: capture-update.json is UNSIGNED and no installed app will update from it. Create the key (see the release runbook)."
          fi
          sha256sum -- * | grep -v ' capture-update.json' > CAPTURE-SHA256SUMS
          ls -l; cat capture-update.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capture-installers
          path: installers/*
          if-no-files-found: error
