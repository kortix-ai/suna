name: CodeQL

# Static application security testing (SAST). Supports SOC 2 CC7.1 / CC8.1.
# Findings appear under the repo's Security > Code scanning tab.

on:
  # `push` on all three refs is what publishes the alert BASELINE each branch is
  # diffed against — see the `promote-pr-scanner-baselines` learning; never
  # narrow it. The PR scan only needs to run where humans propose code: `main`.
  # On a `main -> staging` or a release PR the same tree was already analysed on
  # the PR into main AND on main's push, so two of the three analyses were pure
  # duplicate cost (measured 4m14s / 5m51s / 6m49s on PR #7340).
  push:
    branches: [main, staging, prod]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ${{ vars.CI_RUNNER_L || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:javascript-typescript"
