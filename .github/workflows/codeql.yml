name: CodeQL

# Static application security testing (SAST). Supports SOC 2 CC7.1 / CC8.1.
# Findings appear under the repo's Security > Code scanning tab.

on:
  # One scan per release tree: the release pull request into `prod`. Not on a
  # push, and not on the pull request into `staging`, which runs nothing
  # (2026-10-16). `dev` is scanned weekly.
  pull_request:
    branches: [prod]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC
  # Measure a change to this workflow without opening a release PR.
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ${{ vars.CI_RUNNER_L || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript-typescript
          # security-extended: every security query of security-and-quality.
          # The dropped half is maintainability ("quality") queries: no SOC 2
          # control rests on them, and they roughly doubled the analysis (2026-10-16).
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:javascript-typescript"
