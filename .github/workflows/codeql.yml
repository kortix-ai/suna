name: CodeQL

# Static application security testing (SAST). Supports SOC 2 CC7.1 / CC8.1.
# Findings appear under the repo's Security > Code scanning tab.

on:
  # One scan per release tree: the pull request into `staging`. Not on a push to
  # `staging` or `prod`, and not on the `prod` pull request: those trees are the
  # same tree plus VERSION (testing reset, 2026-10-16). `dev` is scanned weekly.
  pull_request:
    branches: [staging]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ${{ vars.CI_RUNNER_L || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:javascript-typescript"
