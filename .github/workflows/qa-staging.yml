name: QA - staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: qa-staging
  cancel-in-progress: false

jobs:
  full:
    name: full local suite
    uses: ./.github/workflows/test.yml
    with:
      mode: full
      artifact-name: qa-staging-results
      retention-days: 30
    secrets: inherit
