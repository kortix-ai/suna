# yaml-language-server: $schema=https://kortix.com/schema/kortix.v3.schema.json
#
# Kortix project manifest. This file is the source of truth for project-wide
# configuration stored with the repository.
#
# Version 3 supports ACP runtime profiles. The selected runtime profile becomes
# immutable when a session starts. An in-place restart keeps the same harness.
# Start a new session to use another harness.
kortix_version: 3

# The logical agent used when a session or trigger does not name one.
default_agent: opencode

project:
  name: "{{projectName}}"
  description: A Kortix project.

# Environment names used by this project. `required` is advisory. Missing
# values appear in project configuration, but they do not block session start.
env:
  required: []
  optional:
    - STRIPE_API_KEY
    - ANTHROPIC_API_KEY
    - ANTHROPIC_AUTH_TOKEN
    - CLAUDE_CODE_OAUTH_TOKEN
    - CODEX_AUTH_JSON
    - OPENAI_API_KEY
    - CODEX_API_KEY

# Sessions boot from a sandbox image. The platform default image includes the
# Kortix runtime layer and clones this repository into `/workspace`.
#
# Define named custom images when the project needs additional system
# dependencies. Use either `dockerfile` or `image` for each template.
#
# sandbox:
#   default: python
#   templates:
#     - slug: python
#       name: Python 3.12
#       image: python:3.12-slim
#       cpu: 2
#       memory: 4
#       disk: 20
#
# An agent can override the project default with
# `agents.<name>.sandbox: <template-slug>`.

# Each profile selects one native harness and its repository configuration
# directory. OpenCode keeps its agents, skills, commands, tools, plugins,
# providers, and models under `.kortix/opencode`.
runtimes:
  opencode:
    harness: opencode
    config_dir: .kortix/opencode
  claude:
    harness: claude
    config_dir: .claude
  codex:
    harness: codex
    config_dir: .codex
  pi:
    harness: pi
    config_dir: .pi

# Logical agents select runtime profiles. Kortix applies project governance
# fields such as connectors, secrets, skills, CLI grants, workspace, enabled,
# and sandbox. Harness-native behavior stays in the selected runtime's files.
#
# Direct credentials differ by harness:
# - Claude Code: ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, or
#   CLAUDE_CODE_OAUTH_TOKEN.
# - Codex: CODEX_AUTH_JSON, OPENAI_API_KEY, or CODEX_API_KEY.
# - Pi: OPENAI_API_KEY or CODEX_API_KEY.
#
# Kortix-managed model access needs no project credential when the platform
# gateway supports the selected harness and model.
agents:
  opencode:
    runtime: opencode
    agent: kortix
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all

  claude:
    runtime: claude
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all

  codex:
    runtime: codex
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all

  pi:
    runtime: pi
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all

  memory-reflector:
    runtime: opencode
    agent: memory-reflector
    kortix_cli: [project.cr.open]

# Each trigger creates a session and sends `prompt` as its initial message.
# `agent` must name a logical agent above. Omit it to use `default_agent`.
triggers:
  # The memory reflector reviews recent project activity. It updates
  # `.kortix/memory/` through a change request when it finds durable knowledge.
  - slug: memory-reflector
    name: Memory reflector
    type: cron
    agent: memory-reflector
    enabled: false
    cron: "0 0 3 * * *"
    timezone: UTC
    prompt: |
      Load the `kortix-memory` skill, then reflect on the last 24 hours of
      project activity. Review git history, merged change requests, and
      sessions from `kortix sessions digest --since 24h`. Update
      `.kortix/memory/` and open one change request titled `memory: ...`.
      Exit without a change request when there is no durable knowledge.

  # Example cron trigger:
  #
  # - slug: daily-digest
  #   name: Daily digest
  #   type: cron
  #   agent: claude
  #   enabled: true
  #   cron: "0 0 9 * * 1-5"
  #   timezone: America/Los_Angeles
  #   prompt: |
  #     Summarize yesterday's repository changes.

  # Example webhook trigger:
  #
  # - slug: webhook-handler
  #   name: Webhook handler
  #   type: webhook
  #   agent: codex
  #   enabled: true
  #   secret_env: WEBHOOK_SECRET
  #   prompt: |
  #     Process this webhook payload: {{ body }}

# Channel routing is live project state. Configure it in Customize > Channels.
# Connected channels appear as connectors after setup.
