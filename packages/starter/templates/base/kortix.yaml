# yaml-language-server: $schema=https://kortix.com/schema/kortix.v2.schema.json
#
# Kortix project manifest. This file is the source of truth for project-wide
# configuration stored with the repository.
#
# Version 2 is the current schema. It runs one runtime: OpenCode. Agent
# identity, governance, and behavior live in this one `agents:` map plus each
# agent's own `.kortix/opencode/agents/<name>.md`. Run
# `kortix schema --version 2` for the exact field list.
kortix_version: 2

# The agent used when a session or trigger does not name one. It must resolve to
# an agent declared below.
default_agent: kortix

# The only runtime this schema version supports.
runtime: opencode

project:
  name: "{{projectName}}"
  description: A Kortix project.

# Environment names used by this project. `required` is advisory. Missing
# values appear in project configuration, but they do not block session start.
env:
  required: []
  optional:
    - STRIPE_API_KEY

# OpenCode keeps its agents, skills, commands, tools, plugins, providers, and
# models under this directory.
opencode:
  config_dir: .kortix/opencode

# Sessions boot from a sandbox image. The platform default image includes the
# Kortix runtime layer and clones this repository into `/workspace`.
#
# Define named custom images when the project needs additional system
# dependencies. Use either `dockerfile` or `image` for each template.
#
# sandbox:
#   default: python
#   templates:
#     - slug: python
#       name: Python 3.12
#       image: python:3.12-slim
#       cpu: 2
#       memory: 4
#       disk: 20
#
# An agent can override the project default with
# `agents.<name>.sandbox: <template-slug>`.

# Each agent name matches its definition at
# `.kortix/opencode/agents/<name>.md`. Kortix applies the governance fields
# below — connectors, secrets, skills, CLI grants, workspace, enabled, and
# sandbox. OpenCode behavior stays in that agent's own frontmatter.
#
# Omitted grants resolve to `none` in this schema version. Grant explicitly.
agents:
  kortix:
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all

  memory-reflector:
    kortix_cli: [project.cr.open]

# Each trigger creates a session and sends `prompt` as its initial message.
# `agent` must name a declared agent above. Omit it to use `default_agent`.
triggers:
  # The memory reflector reviews recent project activity. It updates
  # `.kortix/memory/` through a change request when it finds durable knowledge.
  - slug: memory-reflector
    name: Memory reflector
    type: cron
    agent: memory-reflector
    enabled: false
    cron: "0 0 3 * * *"
    timezone: UTC
    prompt: |
      Load the `kortix-memory` skill, then reflect on the last 24 hours of
      project activity. Review git history, merged change requests, and
      sessions from `kortix sessions digest --since 24h`. Update
      `.kortix/memory/` and open one change request titled `memory: ...`.
      Exit without a change request when there is no durable knowledge.

  # Example cron trigger:
  #
  # - slug: daily-digest
  #   name: Daily digest
  #   type: cron
  #   agent: kortix
  #   enabled: true
  #   cron: "0 0 9 * * 1-5"
  #   timezone: America/Los_Angeles
  #   prompt: |
  #     Summarize yesterday's repository changes.

  # Example webhook trigger:
  #
  # - slug: webhook-handler
  #   name: Webhook handler
  #   type: webhook
  #   agent: kortix
  #   enabled: true
  #   secret_env: WEBHOOK_SECRET
  #   prompt: |
  #     Process this webhook payload: {{ body }}

# Channel routing is live project state. Configure it in Customize > Channels.
# Connected channels appear as connectors after setup.
