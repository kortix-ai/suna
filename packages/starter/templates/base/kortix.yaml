# yaml-language-server: $schema=https://kortix.com/schema/kortix.v3.schema.json
#
# {{projectName}}: the Kortix project manifest. Agents, what each may use,
# triggers and sandboxes live here, committed beside your files.
# Reference: https://kortix.com/docs/project/manifest
kortix_version: 3

project:
  name: "{{projectName}}"
  description: A Kortix project.

# The agent a session or trigger runs when it names none. My Kortix, the agent
# you talk to, is built in and runs the agents below for you.
default_agent: kortix

agents:
  kortix:
    description: "General knowledge worker: coding, research, writing, ops and data work, done end to end in its own sandbox."
    mode: primary
    permission: allow
    prompt_file: agents/kortix.md
    tools: all
    skills: all
    connectors: all
    secrets: all
    kortix_permissions: all
    workspace: { project_repository: true }

# More you can add here, each with an example in the reference:
#   sandbox.templates   a custom image or Dockerfile for sessions
#   skills, tools       your own, registered by name, then enabled per agent
#   triggers            run an agent on a schedule or an event
