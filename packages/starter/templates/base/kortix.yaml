# yaml-language-server: $schema=https://kortix.com/schema/kortix.v3.schema.json
#
# Kortix project manifest: the one file that defines this project's agents.
#
# The project REGISTERS what exists (skills, tools, commands, extensions,
# connectors, secrets). Each AGENT decides: its prompt, model and permission,
# and which registered things it enables, by name. Nothing applies to every
# agent by itself, and an agent sees only what it enables.
#
# Layout:
#   kortix.yaml               this file
#   agents/<name>.md          agent prompts (`agents.<name>.prompt_file`)
#   skills/<name>/SKILL.md    skills (`skills:` below)
#   tools/<name>.ts           project tools (`tools:` below)
#   extensions/<name>/        harness extensions (`extensions:` below)
#   memory/                   the project brain (the `kortix-memory` skill)
#
# `kortix validate` checks this file. `kortix schema --version 3` prints the
# full schema.
kortix_version: 3

project:
  name: "{{projectName}}"
  description: A Kortix project.

# The agent a session or trigger runs when it names none.
default_agent: kortix

# Secret names the runtime needs. Set the values in the Kortix Secrets
# Manager; a session cannot start until every required secret has a value.
# An agent receives only the secrets it enables (`agents.<name>.secrets`).
env:
  required: []
  optional: [STRIPE_API_KEY]

# ─── Sandbox templates ───────────────────────────────────────────────────
# Sessions boot from the platform's default image (Ubuntu + the Kortix
# runtime) and clone this repo into /workspace. Add named images only when a
# project needs more: a Dockerfile in the repo (`dockerfile:`) or a public
# image (`image:`). Hardware: cpu = cores, memory and disk = GiB.
#
# sandbox:
#   default: python                  # every agent; `agents.<name>.sandbox` overrides
#   templates:
#     - slug: python
#       name: Python 3.12
#       image: python:3.12-slim
#       cpu: 2
#       memory: 4
#     - slug: ml
#       name: ML Development
#       dockerfile: Dockerfile.ml
#       cpu: 4
#       memory: 16
#       disk: 50

# ═══ Registry: what this project has ═════════════════════════════════════

# ─── Skills ──────────────────────────────────────────────────────────────
# name → the folder that holds its SKILL.md. The folder is named after the
# skill. The Kortix skills (kortix-cli, kortix-system, kortix-memory, …) are
# always registered and need no entry. An agent loads a skill only when it
# enables it (`agents.<name>.skills`).
skills: {}

# ─── Tools ───────────────────────────────────────────────────────────────
# name → a module in this repo. The Kortix tools (web_search, image_search,
# scrape_webpage, memory, show, kortix-connectors_call,
# kortix-connectors_describe) are always registered; a project tool with one
# of those names replaces it. `kortix tools eject <name>` copies a Kortix
# tool here for you to change. Every agent gets every tool unless it narrows
# them (`agents.<name>.tools`).
#
# tools:
#   lookup_order: tools/lookup_order.ts

# ─── Commands ────────────────────────────────────────────────────────────
# Slash commands. `$ARGUMENTS` takes the arguments; `$1`, `$2`, … take them
# one word at a time. An agent offers a command only when it enables it
# (`agents.<name>.commands`).
#
# commands:
#   review:
#     description: Review the open change request.
#     prompt_file: commands/review.md
#   summarize:
#     prompt: Summarize $ARGUMENTS in five bullets.

# ─── Extensions ──────────────────────────────────────────────────────────
# Harness extensions: one implementation per harness. `opencode:` is a module
# loaded as an OpenCode plugin; `pi:` is a pi package (an exact npm pin or a
# repo path). A session loads the extensions its agent enables.
extensions:
  # Interactive terminals: the pty_spawn, pty_write, pty_read, pty_list and
  # pty_kill tools, for dev servers, watchers and REPLs that outlive one
  # command. pi's own bash tool covers the same ground there.
  pty:
    opencode: extensions/pty/pty.ts

# ═══ Agents: what each one does and may use ══════════════════════════════
#
# Each block is one agent. Behavior: description, mode (primary | subagent |
# all), model, prompt or prompt_file, and permission (per tool: allow | ask |
# deny; omitted = allow, so a tool never waits for an answer the agent did not
# ask for). Grants are deny-by-default: an omitted skills, subagents,
# commands, extensions, connectors, secrets or kortix_permissions grant is
# none. Write `all`, `none`, or a list of names.
#
# Only declared agents run. The harness's own build/plan/general/explore
# agents are off unless you declare one here.
agents:
  kortix:
    description: >-
      Generic Kortix general knowledge worker. Hands-on, full tool access,
      handles coding / research / content / ops / data tasks end-to-end in an
      isolated session sandbox. Edit agents/kortix.md to specialize it for
      your project.
    mode: primary
    prompt_file: agents/kortix.md
    # The project's own front-door agent gets everything, so a fresh project
    # is capable out of the box. Narrow it once you know what this project
    # needs.
    skills: all
    subagents: all
    commands: all
    extensions: all
    connectors: all
    secrets: all
    kortix_permissions: all
    # tools: [read, grep, web_search, lookup_order]   # only these
    # tools: { exclude: [bash] }                      # every tool but these
    # sandbox: python                                 # a template above, or "default"
    # workspace: { project_repository: false }        # no repo checkout

  harness-reflector:
    description: >-
      Continual-harness reflector. Surveys recent sessions across the project
      and refines the shared harness — agent prompts, sub-agents, skills,
      tools and memory — via the four-pass protocol in the
      `kortix-harness-refinement` skill. Runs on a cron (the
      `harness-reflector` trigger below) and ends every run by opening a
      single change request titled `harness: …`.
    mode: primary
    prompt_file: agents/harness-reflector.md
    # It runs unattended: a scoped kortix_permissions grant would 403 the CLI
    # reads it needs (skills, agents, triggers) with nobody there to widen it,
    # so it gets `all`. It reads untrusted transcripts, so it gets NO
    # connectors and NO secrets — nothing to exfiltrate.
    skills: all
    subagents: [session-reviewer]
    extensions: [pty]
    kortix_permissions: all

  session-reviewer:
    description: >-
      Read-only sub-agent of the harness-reflector. Given ONE session id,
      gathers that session's full history — transcript (when available), git
      branch commits and diffs, change requests — works through it turn by
      turn, and returns a structured failure-signature findings report.
      Never edits the harness, never opens change requests.
    mode: subagent
    prompt_file: agents/session-reviewer.md
    # "Read-only" is its prompt's discipline, not a permission gate: it runs
    # inside the reflector's session and needs the same CLI reads.
    skills: all
    extensions: [pty]
    kortix_permissions: all

# ─── Triggers ────────────────────────────────────────────────────────────
# Each entry starts a fresh session that runs `prompt` as its first message.
# `agent` names a declared agent (omitted: `default_agent`). Slugs are
# lowercase, URL-safe and unique per project.
triggers:
  # The continual-harness loop. It surveys what recent sessions did, finds
  # failure signatures (repeated tool failures, rediscovery loops, stalled
  # objectives) and refines the harness through one `harness: …` change
  # request; it exits silently when nothing is worth changing. Off by
  # default because every run creates a sandbox: set `enabled: true` once the
  # project has enough activity for a daily reflection.
  - slug: harness-reflector
    name: Harness reflector
    type: cron
    agent: harness-reflector
    enabled: false
    cron: "0 0 3 * * *" # 03:00 daily
    timezone: UTC
    prompt: |
      Load the `kortix-cli` skill, then read the refinement protocol
      with `kortix skills get kortix-harness-refinement` (served live by
      the CLI; `kortix skills get kortix-memory` for the memory pass).
      Run the four-pass refinement protocol over the last 24h of project
      activity: `kortix sessions digest --since 24h`, git log, and
      merged CRs. Identify failure signatures, refine only the
      components with observed failures, and open a single CR titled
      `harness: …`. Exit silently if nothing is worth changing.

  # A cron trigger fires on a 6-field croner expression
  # (second minute hour day month weekday):
  #
  # - slug: daily-digest
  #   name: Daily digest
  #   type: cron
  #   agent: kortix
  #   cron: "0 0 9 * * 1-5"          # 09:00 Mon–Fri
  #   timezone: America/Los_Angeles
  #   prompt: |
  #     Summarize yesterday's commits. Save the result to
  #     notes/digest-{{ fired_at }}.md and open a change request.
  #
  # A webhook trigger fires on signed POSTs to
  # /v1/webhooks/projects/<project_id>/<slug>, signed with
  # `X-Kortix-Signature: sha256=<hmac>` (HMAC-SHA256 of the raw body with the
  # secret `secret_env` names; GitHub's `X-Hub-Signature-256` also works):
  #
  # - slug: slack-hook
  #   name: Slack handler
  #   type: webhook
  #   agent: kortix
  #   secret_env: WEBHOOK_SLACK_SECRET
  #   prompt: |
  #     Slack event from {{ headers.user_agent }}.
  #     User said: {{ body.text }}
