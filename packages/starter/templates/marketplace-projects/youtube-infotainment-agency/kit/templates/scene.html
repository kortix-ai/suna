<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Scene {{ID}} — {{CONCEPT}} -->
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/vendor/gsap.min.js"></script>
    <script src="kit/kit.js"></script>
    <style>
      /* Scene-specific styles. Use the palette variables from kit.css, never raw hex. */
    </style>
  </head>
  <body>
    <div id="scene-root" class="k-stage bg-night" data-composition-id="{{ID}}" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
      <div id="world" class="k-layer">
        <!-- Build the scene here. Text stays inside the safe area (120px / 90px). -->
      </div>
      <div class="k-grain"></div>
      <div class="k-vignette"></div>
    </div>
    <script>
      /* @cues:begin — generated by `yt scene retime`; do not edit by hand */
      const CUES = {{CUES}};
      /* @cues:end */
      const tl = Kit.scene("{{ID}}", CUES.duration);
      window.__timelines["{{ID}}"] = tl; // explicit registration (HyperFrames static lint looks for it)
      // Sync every entrance to the narration with Kit.cue(CUES, "<beat>", "<word>").
      // Example: Kit.fadeUp(tl, "#title", Kit.cue(CUES, "b01", "sky"));
    </script>
  </body>
</html>
