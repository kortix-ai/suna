<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Scene sc03 — The payoff number: blue scatters ~5.9× more than red; Mote is delighted. -->
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/vendor/gsap.min.js"></script>
    <script src="kit/kit.js"></script>
    <style>
      #stat { left: var(--safe-x); top: 250px; color: var(--sky); }
      #stat-label { left: var(--safe-x); top: 460px; }
      #chips { left: var(--safe-x); top: 580px; display: flex; gap: 24px; }
      .chip-blue { background: var(--sky); color: var(--ink); }
      .chip-red { background: var(--coral); color: var(--ink); }
      #law { left: var(--safe-x); top: 720px; }
      #mote { right: 220px; bottom: 140px; }
    </style>
  </head>
  <body>
    <div id="scene-root" class="k-stage bg-night" data-composition-id="sc03" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <div id="world" class="k-layer">
        <div id="stat" class="k-abs k-stat">0×</div>
        <div id="stat-label" class="k-abs k-h2">more scattering for blue</div>
        <div id="chips" class="k-abs">
          <span class="k-chip chip-blue">450 nm blue</span>
          <span class="k-chip chip-red">700 nm red</span>
        </div>
        <div id="law" class="k-abs k-small">Rayleigh scattering ∝ 1/λ⁴ → (700/450)⁴ ≈ 5.9</div>
        <div id="mote" class="k-abs"></div>
      </div>
      <div class="k-grain"></div>
      <div class="k-vignette"></div>
    </div>
    <script>
      /* @cues:begin — generated by `yt scene retime`; do not edit by hand */
      const CUES = {};
      /* @cues:end */
      const tl = Kit.scene("sc03", CUES.duration);
      window.__timelines["sc03"] = tl; // explicit registration (HyperFrames static lint looks for it)
      Kit.mount("#mote", Kit.mascot({ mood: "happy", size: 300 }));

      const six = Kit.cue(CUES, "b03", "six");
      Kit.fadeUp(tl, "#stat", 0.1);
      Kit.countUp(tl, "#stat", six - 0.6, 5.9, 1.2, { fmt: (n) => "≈" + n.toFixed(1) + "×" });
      Kit.fadeUp(tl, "#stat-label", six);
      Kit.fadeUp(tl, "#chips .k-chip", Kit.cue(CUES, "b03", "red", -0.2), { stagger: 0.15 });
      Kit.fadeUp(tl, "#law", Kit.cue(CUES, "b03", "that"));
      Kit.pop(tl, "#mote", Kit.cue(CUES, "b03", "blue", 0, 0));
      Kit.float(tl, "#mote", Kit.cue(CUES, "b03", "blue") + 0.6, CUES.duration, { y: 8, period: 2.4 });
      Kit.blink(tl, "#mote .m-eyes", [Kit.cue(CUES, "b03", "see"), CUES.duration - 0.6]);
    </script>
  </body>
</html>
