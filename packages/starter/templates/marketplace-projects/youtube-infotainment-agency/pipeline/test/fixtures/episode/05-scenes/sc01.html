<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Scene sc01 — Daytime sky; Mote looks up; title question lands on 'blue'. -->
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/vendor/gsap.min.js"></script>
    <script src="kit/kit.js"></script>
    <style>
      #sun { left: 1380px; top: 120px; width: 260px; height: 260px; border-radius: 50%; background: var(--sun);
        box-shadow: 0 0 0 40px rgba(255, 201, 74, 0.25), 0 0 0 90px rgba(255, 201, 74, 0.12); }
      .cloud { position: absolute; height: 90px; border-radius: 90px; background: #fff; opacity: 0.92; }
      .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
      .cloud::before { width: 120px; height: 120px; left: 40px; top: -60px; }
      .cloud::after { width: 90px; height: 90px; left: 130px; top: -40px; }
      #c1 { width: 300px; left: 260px; top: 230px; }
      #c2 { width: 240px; left: 980px; top: 360px; opacity: 0.8; }
      #ground { left: 0; right: 0; bottom: 0; height: 220px; background: #2f9e6f; border-radius: 50% 50% 0 0 / 40px 40px 0 0; }
      #mote { left: 220px; bottom: 150px; }
      #title { left: var(--safe-x); top: 520px; width: 1100px; color: var(--ink); }
      #title .w-blue { display: inline-block; color: var(--sky-deep); }
    </style>
  </head>
  <body>
    <div id="scene-root" class="k-stage bg-day" data-composition-id="sc01" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <div id="world" class="k-layer">
        <div id="sun" class="k-abs"></div>
        <div id="c1" class="cloud"></div>
        <div id="c2" class="cloud"></div>
        <div id="ground" class="k-abs"></div>
        <div id="mote" class="k-abs"></div>
        <h1 id="title" class="k-abs k-title">Why is the sky <span class="w-blue">blue</span>?</h1>
      </div>
      <div class="k-grain"></div>
    </div>
    <script>
      /* @cues:begin — generated by `yt scene retime`; do not edit by hand */
      const CUES = {};
      /* @cues:end */
      const tl = Kit.scene("sc01", CUES.duration);
      window.__timelines["sc01"] = tl; // explicit registration (HyperFrames static lint looks for it)
      Kit.mount("#mote", Kit.mascot({ mood: "curious", size: 260 }));
      gsap.set("#mote .m-pupil", { y: -8 }); // looking up at the sky

      Kit.pop(tl, "#sun", 0.1, { duration: 0.8 });
      Kit.fadeUp(tl, "#mote", 0.3, { y: 60 });
      tl.fromTo("#c1", { x: -40 }, { x: 60, duration: CUES.duration, ease: "none" }, 0);
      tl.fromTo("#c2", { x: 30 }, { x: -50, duration: CUES.duration, ease: "none" }, 0);
      Kit.fadeUp(tl, "#title", Kit.cue(CUES, "b01", "why", -0.15));
      tl.fromTo("#title .w-blue", { scale: 1 }, { scale: 1.18, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, Kit.cue(CUES, "b01", "blue"));
      tl.to("#mote .m-arm-r", { rotation: -25, transformOrigin: "160px 122px", duration: 0.3, yoyo: true, repeat: 1 }, Kit.cue(CUES, "b01", "look"));
      Kit.blink(tl, "#mote .m-eyes", [1.6, Kit.beatEnd(CUES, "b01") - 0.4]);
    </script>
  </body>
</html>
