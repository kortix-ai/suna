<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Scene sc02 — Sunbeam meets air molecules; blue scatters in all directions, red continues straight. -->
    <link rel="stylesheet" href="kit/kit.css" />
    <script src="kit/vendor/gsap.min.js"></script>
    <script src="kit/kit.js"></script>
    <style>
      #diagram { left: 0; top: 0; }
      .mol { fill: var(--paper); }
      .mol-b { fill: var(--muted); }
      .ray-blue { stroke: var(--sky); stroke-width: 8; }
      .ray-red { stroke: var(--coral); stroke-width: 8; }
      .pk-white { fill: var(--paper); }
      .pk-blue { fill: var(--sky); }
      .pk-red { fill: var(--coral); }
      #lbl-mol { left: 900px; top: 700px; }
      #lbl-blue { left: 1240px; top: 190px; color: var(--sky); }
      #lbl-sun { left: 150px; top: 690px; }
      .wipe { background: var(--sky); }
    </style>
  </head>
  <body>
    <div id="scene-root" class="k-stage bg-night" data-composition-id="sc02" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <div id="world" class="k-layer">
        <div id="stars" class="k-layer"></div>
        <svg id="diagram" class="k-abs" width="1920" height="1080" viewBox="0 0 1920 1080">
          <circle id="sun" cx="260" cy="540" r="120" fill="#ffc94a" />
          <line id="beam" class="k-line" x1="380" y1="540" x2="960" y2="540" stroke-width="16" />
          <line id="red" class="k-line ray-red" x1="1010" y1="540" x2="1760" y2="540" />
          <g id="rays">
            <line class="k-line ray-blue" x1="990" y1="520" x2="1200" y2="250" />
            <line class="k-line ray-blue" x1="1000" y1="510" x2="1450" y2="380" />
            <line class="k-line ray-blue" x1="960" y1="500" x2="900" y2="220" />
            <line class="k-line ray-blue" x1="990" y1="570" x2="1260" y2="840" />
            <line class="k-line ray-blue" x1="950" y1="580" x2="760" y2="860" />
            <line class="k-line ray-blue" x1="940" y1="520" x2="700" y2="300" />
          </g>
          <g id="packets" opacity="0">
            <circle class="pk-white" cx="0" cy="0" r="16" /><circle class="pk-white" cx="0" cy="0" r="16" /><circle class="pk-white" cx="0" cy="0" r="16" />
            <circle class="pk-blue" cx="0" cy="0" r="15" /><circle class="pk-blue" cx="0" cy="0" r="15" /><circle class="pk-blue" cx="0" cy="0" r="15" />
            <circle class="pk-blue" cx="0" cy="0" r="15" /><circle class="pk-blue" cx="0" cy="0" r="15" /><circle class="pk-blue" cx="0" cy="0" r="15" />
            <circle class="pk-red" cx="0" cy="0" r="16" /><circle class="pk-red" cx="0" cy="0" r="16" />
          </g>
          <g id="mols">
            <circle class="mol" cx="975" cy="540" r="26" /><circle class="mol" cx="1012" cy="540" r="26" />
            <circle class="mol-b" cx="955" cy="600" r="16" /><circle class="mol-b" cx="1030" cy="480" r="14" />
          </g>
        </svg>
        <div id="lbl-sun" class="k-abs k-label">sunlight: every colour</div>
        <div id="lbl-mol" class="k-abs k-chip">air molecules</div>
        <div id="lbl-blue" class="k-abs k-label">short blue waves</div>
      </div>
      <div class="k-grain"></div>
      <div class="k-vignette"></div>
      <div id="wipe" class="k-wipe wipe"></div>
    </div>
    <script>
      /* @cues:begin — generated by `yt scene retime`; do not edit by hand */
      const CUES = {};
      /* @cues:end */
      const tl = Kit.scene("sc02", CUES.duration);
      window.__timelines["sc02"] = tl; // explicit registration (HyperFrames static lint looks for it)
      Kit.stars("#stars", { seed: 42, count: 120 });
      Kit.wipe(tl, "#wipe", 0, { duration: 0.6 }); // transition_in: wipe

      Kit.pop(tl, "#sun", 0.2);
      Kit.fadeUp(tl, "#lbl-sun", Kit.cue(CUES, "b02", "colour", -0.3));
      Kit.drawOn(tl, "#beam", Kit.cue(CUES, "b02", "when"), 0.9);
      Kit.pop(tl, "#mols circle", Kit.cue(CUES, "b02", "molecules", -0.4), { stagger: 0.08 });
      Kit.pop(tl, "#lbl-mol", Kit.cue(CUES, "b02", "molecules", 0.1));
      Kit.drawOn(tl, "#rays line", Kit.cue(CUES, "b02", "scattered"), 0.5, { stagger: 0.07, ease: "power3.out" });
      Kit.drawOn(tl, "#red", Kit.cue(CUES, "b02", "scattered", 0.2), 0.8);
      Kit.fadeUp(tl, "#lbl-blue", Kit.cue(CUES, "b02", "blue"));
      tl.to("#mols", { x: 4, duration: 0.12, yoyo: true, repeat: 7, ease: "sine.inOut" }, Kit.cue(CUES, "b02", "scattered"));

      // The reveal is only the set-up: from "scattered" to the cut the process keeps playing. Packets of
      // light leave the sun, hit the molecules; blue ones scatter out along every ray, red carry on straight.
      const flow = Kit.cue(CUES, "b02", "scattered");
      function stream(el, from, to, start, period) {
        const reps = Math.max(0, Math.floor((CUES.duration - start) / period) - 1);
        tl.fromTo(el, { attr: { cx: from[0], cy: from[1] } }, { attr: { cx: to[0], cy: to[1] }, duration: period, ease: "none", repeat: reps }, start);
        tl.fromTo(el, { opacity: 0 }, { keyframes: [{ opacity: 1, duration: period * 0.15 }, { opacity: 1, duration: period * 0.6 }, { opacity: 0, duration: period * 0.25 }], repeat: reps }, start);
      }
      tl.set("#packets", { opacity: 1 }, flow);
      const pk = (cls) => [...document.querySelectorAll("#packets ." + cls)];
      pk("pk-white").forEach((el, i) => stream(el, [380, 540], [960, 540], flow + i * 0.4, 1.2));
      [...document.querySelectorAll("#rays line")].forEach((ray, i) => {
        const a = (k) => Number(ray.getAttribute(k));
        stream(pk("pk-blue")[i], [a("x1"), a("y1")], [a("x2"), a("y2")], flow + 0.6 + i * 0.17, 1.0);
      });
      pk("pk-red").forEach((el, i) => stream(el, [1010, 540], [1760, 540], flow + 0.9 + i * 0.75, 1.5));
    </script>
  </body>
</html>
