# yaml-language-server: $schema=https://kortix.com/schema/kortix.v3.schema.json
kortix_version: 3
default_agent: opencode

runtimes:
  opencode:
    harness: opencode
    config_dir: .kortix/opencode
  claude:
    harness: claude
    config_dir: .claude
  codex:
    harness: codex
    config_dir: .codex
  pi:
    harness: pi
    config_dir: .pi

agents:
  opencode:
    runtime: opencode
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all
  claude:
    runtime: claude
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all
  codex:
    runtime: codex
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all
  pi:
    runtime: pi
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all
