main = "worker.mjs"
compatibility_date = "2026-08-01"
workers_dev = false
account_id = "9785405a992435bb0c7bd19f9b6d26d5"

name = "kortix-apps-router"
routes = [
  { pattern = "*.apps.kortix.com/*", zone_name = "kortix.com" },
]

[vars]
DEV_API_ORIGIN = "https://dev-api.kortix.com"
# Not staging-api.kortix.com: that host is a Worker route over a dead
# cfargotunnel record, and a same-zone subrequest skips the route and answers
# Cloudflare 530. Use the origin the api-router Worker uses (BACKEND_EU_WEST_2).
STAGING_API_ORIGIN = "https://staging-api-euw2.kortix.com"
PROD_API_ORIGIN = "https://api.kortix.com"
PREVIEW_API_ORIGIN = "https://dev-api.kortix.com"

# DEV_EDGE_SECRET, STAGING_EDGE_SECRET, PROD_EDGE_SECRET, and
# PREVIEW_EDGE_SECRET are Worker secrets. Each value must equal
# KORTIX_APPS_EDGE_SECRET in its API environment. Unset there, the API falls back to
# API_KEY_SECRET, which then sits in Cloudflare too: set a dedicated value
# (rotation: kortix-release skill, step 10).
